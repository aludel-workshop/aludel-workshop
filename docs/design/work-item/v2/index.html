<title>Aludel Work Item</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- WORK-ITEM-UX-01 prototype v2: owner review of v1 applied (F1-F16 in ../work-record.md). Static and clickable. W-4 run 1 uses the real request, its real single criterion and the real trace (2026-09-26); run 2 and W-9 are illustrative. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<style>
:root{
  --bg:#fafbff;--surface:#ffffff;--rail:#f0f4fc;--panel:#f3f6fd;--hover:#e3e9f7;--line:#dce2ef;--line-strong:#c5cee2;--ink:#141727;--muted:#52617d;
  --primary:#3047b9;--on-primary:#ffffff;--container:#dfe5ff;--on-container:#163698;
  --product:#6b35c9;--product-bg:#efe7ff;--platform:#0f7465;--platform-bg:#d9f3ec;--design:#b3245f;
  --ok:#146446;--ok-bg:#d9f3e7;--warn:#6b4b00;--warn-bg:#fff0c9;--warn-line:#e0a100;--bad:#a1231f;--bad-bg:#fce1e0;
  --p-medium:#b78103;--p-high:#e0531f;
  --shadow:0 18px 50px #1c2a5a26;--code-bg:#141727;--code-ink:#e8ebf7;--code-add:#1d4b35;--code-del:#5a2022;--ins:#d4f5e2;--del:#fde0df;
  --stage:#eef2fb;--stage-line:#cfd7ea;--rs-bg:#f5f7ff;--rs-line:#b9c4ec;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10121a;--surface:#181b26;--rail:#141722;--panel:#1f2331;--hover:#262b3c;--line:#2b3144;--line-strong:#3a4259;--ink:#e6e9f5;--muted:#9da8c2;
  --primary:#a3b3ff;--on-primary:#0f1a55;--container:#2b3670;--on-container:#e0e6ff;
  --product:#cdb1ff;--product-bg:#2d2150;--platform:#86e0cb;--platform-bg:#0f3932;--design:#ffa3c6;
  --ok:#94e2bc;--ok-bg:#12392a;--warn:#ffd680;--warn-bg:#3b2d0b;--warn-line:#b88400;--bad:#ffaca7;--bad-bg:#491a1a;
  --p-medium:#f2c14e;--p-high:#ff9a66;
  --shadow:0 18px 50px #00000080;--code-bg:#0b0d14;--code-ink:#dfe3f2;--code-add:#16402c;--code-del:#4d1b1d;--ins:#16402c;--del:#4d1b1d;
  --stage:#141722;--stage-line:#2b3144;--rs-bg:#1b2033;--rs-line:#3a4677;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121a;--surface:#181b26;--rail:#141722;--panel:#1f2331;--hover:#262b3c;--line:#2b3144;--line-strong:#3a4259;--ink:#e6e9f5;--muted:#9da8c2;
  --primary:#a3b3ff;--on-primary:#0f1a55;--container:#2b3670;--on-container:#e0e6ff;
  --product:#cdb1ff;--product-bg:#2d2150;--platform:#86e0cb;--platform-bg:#0f3932;--design:#ffa3c6;
  --ok:#94e2bc;--ok-bg:#12392a;--warn:#ffd680;--warn-bg:#3b2d0b;--warn-line:#b88400;--bad:#ffaca7;--bad-bg:#491a1a;
  --p-medium:#f2c14e;--p-high:#ff9a66;
  --shadow:0 18px 50px #00000080;--code-bg:#0b0d14;--code-ink:#dfe3f2;--code-add:#16402c;--code-del:#4d1b1d;--ins:#16402c;--del:#4d1b1d;
  --stage:#141722;--stage-line:#2b3144;--rs-bg:#1b2033;--rs-line:#3a4677;color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--primary)}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased;user-select:none}
.ms.sm{font-size:16px}.ms.xs{font-size:14px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-size:12.5px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* prototype bar */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;background:var(--code-bg);color:var(--code-ink);font-size:12.5px}
.proto b{font-weight:500;margin-right:6px}
.proto button{border:1px solid #ffffff30;background:transparent;border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--code-ink)}
.proto button[aria-current="true"]{background:var(--code-ink);color:var(--code-bg)}
.proto .sp{flex:1}
.proto .note{color:#aab3cc}
.substate{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 12px;font-size:12px;color:var(--muted)}
.substate button{border:1px dashed var(--line-strong);background:transparent;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12px}
.substate button[aria-pressed="true"]{background:var(--container);color:var(--on-container);border-style:solid;border-color:transparent}

/* shell */
.app{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:calc(100vh - 40px)}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;padding:4px 8px 12px}
.proj{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:10px}
.proj i{width:28px;height:28px;border-radius:7px;background:var(--design);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.proj small{display:block;color:var(--muted);font-size:11.5px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
.nav[aria-current="page"]{background:var(--container);color:var(--on-container);font-weight:500}
.main{padding:20px clamp(16px,3vw,36px) 60px;min-width:0}
.page{max-width:980px}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}.rail{display:none}}

/* header */
.crumb{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
.crumb a{color:inherit;text-decoration:none}
.head{display:flex;gap:12px 16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.head h1{font-size:24px;line-height:1.25;margin:0;font-weight:500;text-wrap:balance}
.head-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:8px 0 20px;font-size:13px;color:var(--muted)}
.facts>span{display:inline-flex;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 8px;font-size:12.5px;white-space:nowrap;line-height:20px;color:var(--ink)}
.chip.role-product{background:var(--product-bg);color:var(--product);border-color:transparent;font-weight:500}
.chip.role-platform{background:var(--platform-bg);color:var(--platform);border-color:transparent;font-weight:500}
.chip.pick{cursor:pointer}
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;line-height:20px;white-space:nowrap}
.st .ms{font-size:14px}
.st-review{background:var(--ok-bg);color:var(--ok)}.st-accepted{background:var(--ok-bg);color:var(--ok)}
.st-working{background:var(--container);color:var(--on-container)}.st-queued,.st-draft,.st-handoff,.st-closed{background:var(--panel);color:var(--muted)}
.st-sent{background:var(--warn-bg);color:var(--warn)}.st-needs{background:var(--warn-bg);color:var(--warn)}
.st-failed,.st-incomplete{background:var(--bad-bg);color:var(--bad)}
.prio{color:var(--p-medium)}.prio.high{color:var(--p-high)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 16px;background:var(--primary);color:var(--on-primary);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--line-strong)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad);color:var(--surface)}
.btn.badghost{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .n{background:var(--surface);color:var(--bad);border-radius:999px;padding:0 6px;font-size:11.5px;font-weight:700}
.linkbtn{border:0;background:none;color:var(--primary);cursor:pointer;padding:0;font-size:12.5px;display:inline-flex;gap:4px;align-items:center}

/* avatars + hover card */
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;flex:none;overflow:hidden;font-size:10.5px;font-weight:700;color:#fff;background:#3a4a7a}
.av svg{width:100%;height:100%;display:block}
.av.lg{width:30px;height:30px;font-size:12px}
.who{position:relative;display:inline-flex;gap:8px;align-items:center;font-weight:500;cursor:default}
.hc{position:absolute;top:calc(100% + 8px);left:0;z-index:20;width:250px;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:12px;font-weight:400;display:none}
.who:hover .hc,.who:focus-within .hc{display:block}
.hc b{display:block;font-weight:500}
.hc dl{display:grid;grid-template-columns:70px 1fr;gap:4px 8px;margin:8px 0 0;font-size:12.5px}
.hc dt{color:var(--muted)}.hc dd{margin:0}

/* tab bar */
.tabbar{display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0}
.tab{display:flex;align-items:center;gap:8px;border:0;background:none;padding:9px 14px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{border-bottom-color:var(--primary);color:var(--ink);font-weight:500}
.tab.draft{font-style:normal}
.tab .dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.review,.dot.accepted{background:var(--ok)}.dot.sent,.dot.needs{background:var(--warn-line)}.dot.failed,.dot.incomplete{background:var(--bad)}.dot.handoff,.dot.closed,.dot.draft{background:var(--line-strong)}
.dot.working{background:var(--primary);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.runcount{font-size:12.5px;color:var(--muted);padding-bottom:10px;white-space:nowrap}

/* the one card */
.card{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:16px;display:flex;flex-direction:column;gap:12px}

/* run status */
.rs{background:var(--rs-bg);border:1px solid var(--rs-line);border-radius:12px}
.rs>:last-child{border-radius:0 0 11px 11px}
.rs>:first-child{border-radius:11px 11px 0 0}
.rs>:only-child{border-radius:11px}
.rs-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px}
.rs-top .now{min-width:0;flex:1 1 220px;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-top .now b{font-weight:500}
.rs-stats{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rs-stats b{color:var(--ink);font-weight:500}
.chev{border:0;background:none;cursor:pointer;border-radius:8px;padding:2px;color:var(--muted);display:inline-flex}
.chev:hover{background:var(--hover)}
.chev[aria-expanded="true"] .ms{transform:rotate(180deg)}
.segbar{display:flex;gap:3px;padding:0 12px 10px}
.segbar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.segbar i.done{background:var(--primary)}
.segbar i.now{background:linear-gradient(90deg,var(--primary) 45%,var(--line) 45%)}
.segbar i.stuck{background:var(--warn-line)}
.rs-act{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:10px 12px;border-top:1px solid var(--rs-line)}
.rs-act p{margin:0;flex:1 1 260px;font-size:13.5px}
.rs-act .btns{display:flex;gap:8px;flex-wrap:wrap}
.rs-act.bad p{color:var(--bad)}
.sig{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--rs-line);font-size:13.5px}
.sig q{display:block;margin-top:2px}
.rs-more{border-top:1px solid var(--rs-line);background:var(--surface)}
.objlist{list-style:none;margin:0;padding:6px 0}
.objlist li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;padding:6px 12px;align-items:start;font-size:13.5px}
.objlist .ic{font-size:18px}
.objlist .done .ic{color:var(--ok)}.objlist .now .ic{color:var(--primary)}.objlist .todo .ic{color:var(--line-strong)}.objlist .stuck .ic{color:var(--warn-line)}.objlist .err .ic{color:var(--bad)}
.objlist small{display:block;color:var(--muted);font-size:12px}
.objlist .stumble{color:var(--warn);font-size:12px;display:flex;gap:4px;align-items:center}
.objlist time{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.logbtn{padding:4px 12px 12px 42px}
.log{list-style:none;margin:0;padding:0 12px 12px 42px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;max-height:240px;overflow:auto}
.log li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:start}
.log li .ms{font-size:15px;color:var(--muted)}
.log li.warn .ms{color:var(--warn-line)}.log li.err .ms{color:var(--bad)}.log li.ok .ms{color:var(--ok)}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.log li.fresh{animation:fadein .5s}
@keyframes fadein{from{background:var(--container)}to{background:transparent}}
.q{padding:10px 12px;border-top:1px solid var(--rs-line);display:flex;flex-direction:column;gap:8px}
.q h3{margin:0;font-size:14px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:13.5px;cursor:pointer}
.report{margin:0 12px 12px;border:1px solid var(--bad);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:13px}
.report h4{margin:0 0 6px;font-size:13px}
.report ul{margin:0;padding-left:18px}

/* sign-off */
.signoff{border-top:1px solid var(--rs-line);padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.signoff h3{margin:0;font-size:15px;font-weight:500}
.signoff textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--surface);min-height:60px;resize:vertical}
.warnbox{display:flex;gap:8px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}
.flaglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.flaglist li{display:flex;gap:6px;align-items:flex-start}
.flaglist .ms{color:var(--bad);font-size:16px}

/* accordion sections */
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.acc>summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .ttl{font-weight:500;display:flex;gap:8px;align-items:center}
details.acc>summary .ttl .ms{color:var(--muted)}
details.acc>summary .sum{flex:1;min-width:0;color:var(--muted);font-size:12.5px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.acc>summary .cv{color:var(--muted);transition:transform .15s}
details.acc[open]>summary .cv{transform:rotate(180deg)}
details.acc[open]>summary{border-bottom:1px solid var(--line)}
.acc-body{padding:12px}
.ask{font-size:15px;line-height:1.6;max-width:70ch;margin:0}
.ask-by{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
.carried{margin-top:12px;background:var(--panel);border-radius:10px;padding:10px 12px;font-size:13px}
.carried h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}

ol.crits{list-style:none;margin:0;padding:0}
.crit{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px dashed var(--line);align-items:start}
.crit:first-child{border-top:0;padding-top:0}
.crit .n{width:22px;height:22px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.crit .n.acc{background:var(--ok);color:var(--surface)}.crit .n.rej{background:var(--bad);color:var(--surface)}
.crit .src{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;font-size:11.5px;color:var(--muted);align-items:center}
.newtag{font-size:11px;font-weight:500;color:var(--primary);background:var(--container);border-radius:5px;padding:0 5px}
.crit .res{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.cstate{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.cstate .ms{font-size:16px}
.cstate.pass{color:var(--ok)}.cstate.fail{color:var(--bad)}.cstate.wait{color:var(--muted)}
.vchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:6px;padding:0 6px;background:var(--panel);color:var(--muted);white-space:nowrap}
.vchip .ms{font-size:14px}
.crit .note{grid-column:2/4;font-size:12.5px;color:var(--bad);display:flex;gap:4px;align-items:flex-start}
.crit.edit .t{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface)}
.crit.edit .t:focus{outline:2px solid var(--primary)}
.xbtn{border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;padding:2px}
.xbtn:hover{background:var(--hover)}
.suggest{margin-top:8px;background:var(--stage);border:1px dashed var(--stage-line);border-radius:8px;padding:8px}
textarea.req{width:100%;min-height:78px;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:15px;line-height:1.55;resize:vertical}

/* changes stack */
ul.chgs{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chgrow{border-top:1px solid var(--line)}
.chgrow:first-child{border-top:0}
.chgline{display:grid;grid-template-columns:20px minmax(0,1fr) auto 30px;gap:10px;align-items:center;padding:8px 10px}
.chgline:hover{background:var(--hover)}
.chgline .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.chgline .nm button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.chgline .nm button:hover{text-decoration:underline}
.chgline .op{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.op .c{color:var(--ok)}.op .m{color:var(--primary)}.op .r{color:var(--bad)}
.flagbtn{border:0;background:none;cursor:pointer;color:var(--muted);border-radius:6px;padding:3px;opacity:0}
.chgline:hover .flagbtn,.flagbtn:focus-visible,.flagbtn.on{opacity:1}
.flagbtn.on{color:var(--bad)}
@media (hover:none){.flagbtn{opacity:1}}
.flagnote{display:flex;gap:6px;align-items:center;padding:0 10px 8px 40px}
.flagnote input{flex:1;border:1px solid var(--bad);border-radius:8px;padding:5px 8px;background:var(--surface);font-size:13px}
.flagnote .ms{color:var(--bad)}
.flagnote.ro{font-size:12.5px;color:var(--bad)}
.applied{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:center}

/* activity */
section.activity{margin-top:26px}
section.activity h2{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;margin:0 0 10px}
ol.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ol.acts li{display:flex;gap:10px;font-size:13px;align-items:flex-start}
ol.acts time{color:var(--muted);font-size:12px;margin-left:6px}
.comment{display:flex;gap:8px;margin-top:12px}

function acc(id, icon, title, summary, body, defOpen){

function taskSection(key, task, runId){

}
function critSection(key, run, reviewKey){
  const crits = run.task.crits, res = run.results || {}, V = reviewKey ? S.verdicts[reviewKey] : run.verdicts || {}, N = reviewKey ? S.notes[reviewKey] : {};
  const met = crits.filter(c => res[c.id]==='pass').length, fl = crits.filter(c => V[c.id]==='reject').length;
  const newN = crits.filter(c => run.task.newIds.includes(c.id)).length;
  const sum = `${crits.length} criteria${newN ? ` · ${newN} new` : ''}${Object.values(res).some(Boolean) ? (run.state==='working'||run.state==='needs' ? ` · ${met} passing so far` : ` · agent reports ${met} met`) : ''}${fl ? ` · ${fl} flagged` : ''}`;
  const body = `<ol class="crits">${crits.map((c,i) => { const v = V[c.id], r = res[c.id];
    return `<li class="crit"><span class="n ${v==='accept'?'acc':v==='reject'?'rej':''}">${v==='accept'?ms('check','xs'):v==='reject'?ms('close','xs'):i+1}</span>
      <div><div>${c.t}</div><div class="src">${ms('bookmark','xs')}${c.src}${run.task.newIds.includes(c.id) ? `<span class="newtag">New in run ${run.id}</span>` : ''}</div></div>
      <div class="res">${r ? `<span class="cstate ${r==='pass'?'pass':'fail'}">${ms(r==='pass'?'check_circle':'cancel')}${run.state==='working'||run.state==='needs' ? (r==='pass'?'Passing':'Failing') : (r==='pass'?'Agent: met':'Agent: not met')}</span>` : ''}${vchip(c.v)}${c.v2?vchip(c.v2):''}</div>
      ${v==='reject' && N[c.id] ? `<div class="note">${ms('flag','xs')}${esc(N[c.id])}</div>` : ''}</li>`; }).join('')}</ol>`;
  return acc(`${key}-${run.id}-crit`, 'fact_check', 'Criteria', sum, body, false);
}
function changeSection(key, run, editable, reviewTarget){
  const chs = run.changes || [];
  const counts = { c:0, m:0, r:0 }; chs.forEach(c => counts[c.op]++);
  const flags = chs.filter(c => (editable ? S.flags[c.id] !== undefined : c.flag)).length;
  const sum = chs.length ? [counts.c && `${counts.c} created`, counts.m && `${counts.m} modified`, counts.r && `${counts.r} removed`].filter(Boolean).join(' · ') + (flags ? ` · ${flags} flagged` : '') : 'No changes';
  const body = chs.length ? `<ul class="chgs">${chs.map(c => { const f = editable ? S.flags[c.id] : c.flag;
    return `<li class="chgrow"><div class="chgline">${ms(c.icon,'sm')}<span class="nm">${reviewTarget ? `<button type="button" data-openchange="${reviewTarget}:${c.id}">${c.name}</button>` : c.name}${c.sub ? ` <span class="muted small">${c.sub}</span>` : ''}</span>
      <span class="op"><span class="${c.op}">${c.opText}</span> · ${c.size}</span>
      ${editable ? `<button type="button" class="flagbtn ${f!==undefined?'on':''}" data-flag="${c.id}" aria-label="${f!==undefined?'Remove flag from':'Flag'} ${c.name}" title="Flag this change">${ms('flag','sm')}</button>` : (f ? `<span class="flagbtn on" style="opacity:1" title="Flagged">${ms('flag','sm')}</span>` : '<span></span>')}</div>
      ${f !== undefined && f !== null ? (editable ? `<div class="flagnote">${ms('subdirectory_arrow_right','sm')}<label class="vh" for="fn-${c.id}">Flag note for ${c.name}</label><input id="fn-${c.id}" data-flagnote="${c.id}" value="${esc(f)}" placeholder="What’s wrong with this change?"></div>` : `<div class="flagnote ro">${ms('subdirectory_arrow_right','xs')}${esc(f)}</div>`) : ''}</li>`; }).join('')}</ul>
    <p class="applied">${ms('info','xs')}${run.state==='accepted' ? 'Applied when the run was accepted.' : run.state==='review' ? 'Nothing is applied until you accept this run.' : 'Not applied. Kept here and passed to the next run as context.'}</p>` : `<p class="muted small" style="margin:0">This run has not changed anything yet.</p>`;
  return acc(`${key}-${run.id}-chg`, 'difference', 'Changes', sum, body, false);
}
function objList(objs, key){
  const icon = s => s==='done'?'check_circle':s==='now'?'progress_activity':s==='stuck'?'warning':s==='err'?'error':'radio_button_unchecked';

function segbar(objs){ return `<div class="segbar" aria-hidden="true">${objs.map(o => `<i class="${o.s==='done'?'done':o.s==='now'?'now':o.s==='stuck'?'stuck':''}"></i>`).join('')}</div>`; }

/* ---------- run status (F3, F4, F8) ---------- */
function runStatus(key, run, opts){
  const k = `${key}-${run.id}`, exp = S.open[k+'-rs'] ?? false;
  const objs = opts.objs || run.objs, state = opts.state || run.state;
  const top = `<div class="rs-top">${who(run.who)}${pill(state)}${opts.now ? `<span class="now">${opts.now}</span>` : '<span class="now"></span>'}
    <span class="rs-stats"><span><b ${opts.timerId?`id="${opts.timerId}"`:''}>${opts.time || run.time}</b> ${state==='working'?'active':'total'}</span><span><b>${opts.tokens || run.tokens}</b> tokens</span></span>
    <button type="button" class="chev" data-rs="${k}" aria-expanded="${exp}" aria-label="${exp?'Hide':'Show'} objectives">${ms('expand_more')}</button></div>`;
  const bar = state==='working' || state==='needs' ? segbar(objs) : '';
  const more = exp ? `<div class="rs-more">${objList(objs, k)}${logList(opts.log || run.log, k)}</div>` : '';
  return `<section class="rs" aria-label="Run status">${top}${bar}${opts.action || ''}${opts.signoff || ''}${more}</section>`;
}
function sigRow(sig){ const icon = sig.outcome==='Accepted' ? 'verified' : sig.outcome==='Handed off' ? 'front_hand' : 'draw';
  return `<div class="sig">${me('lg')}<div><b>${sig.outcome}</b> by ${sig.by} · <span class="muted">${sig.at}</span>${sig.comment ? `<q>${esc(sig.comment)}</q>` : ''}</div>${ms(icon)}</div>`; }

// Actions for a run waiting on the reviewer (F8): Review is primary; Reject grows with flags; Accept confirms through the sign-off.
function reviewActions(reviewKey, run){
  const flagN = countFlags(reviewKey, run);
  const checked = Object.values(S.verdicts[reviewKey]).filter(v => v && v !== 'skip').length, total = run.task.crits.length;
  return `<div class="rs-act"><p>${whoName(run.who)} reports all ${total} criteria met${checked ? ` · you’ve checked ${checked} of ${total}` : ''}. Nothing is applied until you accept.</p>
    <div class="btns"><button type="button" class="btn ${flagN ? 'bad' : 'badghost'} sm" data-sign="${reviewKey}:reject">${ms('reply','sm')}Reject${flagN ? ` <span class="n">${flagN} flag${flagN>1?'s':''}</span>` : ''}</button>
      <button type="button" class="btn ghost sm" data-sign="${reviewKey}:accept">${ms('check','sm')}Accept</button>
      <button type="button" class="btn sm" data-go="${reviewKey}">${ms('rate_review','sm')}Review</button></div></div>`;
}
function countFlags(reviewKey, run){
  const V = S.verdicts[reviewKey];
  return Object.values(V).filter(v => v==='reject').length + (run.changes || []).filter(c => S.flags[c.id] !== undefined).length;
}
function signoff(reviewKey, run){
  if (!S.signing || S.signing.key !== reviewKey) return '';
  const accept = S.signing.kind === 'accept';
  const V = S.verdicts[reviewKey], N = S.notes[reviewKey];
  const critFlags = run.task.crits.filter(c => V[c.id]==='reject').map(c => [c.t, N[c.id]]);
  const chFlags = (run.changes || []).filter(c => S.flags[c.id] !== undefined).map(c => [c.name, S.flags[c.id]]);
  const flags = critFlags.concat(chFlags);
  const unchecked = run.task.crits.filter(c => !V[c.id] || V[c.id]==='skip').length;
  const warn = accept && (flags.length || unchecked) ? `<div class="warnbox">${ms('warning','sm')}<span>${flags.length ? `${flags.length} flag${flags.length>1?'s':''} will be dropped. ` : ''}${unchecked ? `You haven’t checked ${unchecked} of ${run.task.crits.length} criteria yourself. ` : ''}Accept anyway?</span></div>` : '';
  return `<div class="signoff"><h3>${accept ? `Accept run ${run.id}` : `Send back run ${run.id}`}</h3>
    ${warn}
    ${flags.length ? `<ul class="flaglist">${flags.map(([t,n]) => `<li>${ms('flag')}<span><b>${t}</b>${n ? `: ${esc(n)}` : ''}</span></li>`).join('')}</ul>` : ''}
    <p class="small muted" style="margin:0">${accept ? `Applies ${run.changes.length} change${run.changes.length>1?'s':''} and closes ${reviewKey==='rv4'?'W-4':'W-9'}. Your signature and comment are kept as the provenance.` : 'Nothing is applied. The changes, your flags and your comment stay in this tab and go to the next run as context. The task reopens as a Next run tab.'}</p>
    <label class="small" for="signc">Overall comment (optional)</label><textarea id="signc" placeholder="${accept ? 'Anything to note for the record' : 'What should the next run do differently?'}">${esc(S.comment)}</textarea>
    <div class="btns" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn ${accept?'ok':'bad'}" data-confirm="${reviewKey}:${S.signing.kind}">${ms('draw','sm')}${accept ? 'Sign and accept' : 'Sign and send back'}</button><button type="button" class="btn ghost" data-cancel>Cancel</button></div></div>`;
}

// The editable Next run tab (F9): request and criteria, editable until a worker starts it.
function draftCard(item, base){
  if (!S.draft) S.draft = { request: base.request, crits: base.crits.map(c => ({...c})), suggest: base.suggest || null, carried: base.carried || null };
  const D = S.draft;
  return `<div class="card">
    <section class="rs" aria-label="Next run"><div class="rs-top">${who(item.assignee)}${pill('draft')}<span class="now">Editable until a worker starts it. Then this becomes Run ${item.nextId}, locked to exactly what you see.</span></div></section>
    ${acc('draft-task','assignment','Task','Your request', `<label class="vh" for="req">Request</label><textarea id="req" class="req" data-draft="request">${esc(D.request)}</textarea>${D.carried ? `<div class="carried"><h4>Carried in from run ${item.nextId-1}</h4><ul style="margin:0;padding-left:18px">${D.carried.map(c => `<li>${c}</li>`).join('')}</ul></div>` : ''}`, true)}
    ${acc('draft-crit','fact_check','Criteria', `${D.crits.length} criteria · editable`, `<ol class="crits">${D.crits.map((c,i) => `<li class="crit edit"><span class="n">${i+1}</span><div><div class="t" contenteditable="true" data-critedit="${i}" role="textbox" aria-label="Criterion ${i+1}">${esc(c.t)}</div><div class="src">${ms('bookmark','xs')}${c.src}</div></div><div class="res">${vchip(c.v)}<button type="button" class="xbtn" data-critdel="${i}" aria-label="Remove criterion ${i+1}">${ms('close','sm')}</button></div></li>`).join('')}</ol>
      ${D.suggest ? `<div class="suggest crit"><span class="n">${ms('auto_awesome','xs')}</span><div><div>${D.suggest.t}</div><div class="src">${ms('auto_awesome','xs')}Suggested from your request</div></div><div class="res"><button type="button" class="btn ghost sm" data-keep>Keep</button><button type="button" class="linkbtn" data-dismiss>Dismiss</button></div></div>` : ''}
      <p style="margin:10px 0 0"><button type="button" class="linkbtn" data-critadd>${ms('add','xs')}Add a criterion</button></p>`, true)}
  </div>`;
}

  const tabs = runs.map(tabOf).concat(signedBack ? [nextTab()] : []);

    return page(`${header({ ...W4 }, 'queued', `<button type="button" class="btn" data-stage>${ms('playlist_add','sm')}Stage in Default agent’s batch</button>`)}${tabbar('w4', tabs, `${runs.length} runs`)}${draftCard({ ...W4, nextId:3 }, { request:REQ4, crits:C4, carried:[S.lastComment ? `Your comment: “${esc(S.lastComment)}”` : 'Your sign-off on run 2', ...countFlagTexts('rv4', runs[1]), 'Run 2’s proposed claim, not applied'] })}${activity(W4)}`);

function fmt(s){ return `${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`; }
function screenW9(){
  const sub = S.sub9, cur = S.tab.w9;
  const liveState = sub==='working' ? 'working' : sub==='asking' ? (S.answered ? 'working' : 'needs') : 'failed';
  const run3 = { ...RUN9, state:liveState };
  const tabs = W9.runs.map(tabOf).concat([tabOf(run3)]);
  const switcher = `<div class="substate" role="group" aria-label="Prototype: run 3 state">Prototype, run 3 state:
    ${[['working','Working'],['asking','Asking a question'],['failed','Failed']].map(([k,l]) => `<button type="button" data-sub="${k}" aria-pressed="${sub===k}">${l}</button>`).join('')}</div>`;
  let card;
  if (cur === 3){

document.addEventListener('click', e => {

  if (d.step !== undefined){ S.step = +d.step; S.vtab = null; S.hi = null; return render(true); }
