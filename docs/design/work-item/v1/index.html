<title>Aludel Work Item</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- WORK-ITEM-UX-01 prototype v1. Static and clickable. W-4 uses the real Browser Buddy request, claim and run trace (2026-09-26); run 2, W-9 and all timings beyond the real run are illustrative. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<style>
:root{
  --bg:#fafbff;--surface:#ffffff;--rail:#f0f4fc;--panel:#f3f6fd;--hover:#e3e9f7;--line:#dce2ef;--line-strong:#c5cee2;--ink:#141727;--muted:#52617d;
  --primary:#3047b9;--on-primary:#ffffff;--container:#dfe5ff;--on-container:#163698;
  --product:#6b35c9;--product-bg:#efe7ff;--platform:#0f7465;--platform-bg:#d9f3ec;--work:#8a5300;--work-bg:#fff0d4;--design:#b3245f;--design-bg:#ffe4ee;
  --ok:#146446;--ok-bg:#d9f3e7;--warn:#6b4b00;--warn-bg:#fff0c9;--warn-line:#e0a100;--bad:#a1231f;--bad-bg:#fce1e0;
  --p-medium:#b78103;--p-high:#e0531f;
  --shadow:0 18px 50px #1c2a5a26;--code-bg:#141727;--code-ink:#e8ebf7;--code-add:#1d4b35;--code-del:#5a2022;--ins:#d4f5e2;--del:#fde0df;
  --stage:#eef2fb;--stage-line:#cfd7ea;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10121a;--surface:#181b26;--rail:#141722;--panel:#1f2331;--hover:#262b3c;--line:#2b3144;--line-strong:#3a4259;--ink:#e6e9f5;--muted:#9da8c2;
  --primary:#a3b3ff;--on-primary:#0f1a55;--container:#2b3670;--on-container:#e0e6ff;
  --product:#cdb1ff;--product-bg:#2d2150;--platform:#86e0cb;--platform-bg:#0f3932;--work:#ffc774;--work-bg:#3d2b0c;--design:#ffa3c6;--design-bg:#461a2e;
  --ok:#94e2bc;--ok-bg:#12392a;--warn:#ffd680;--warn-bg:#3b2d0b;--warn-line:#b88400;--bad:#ffaca7;--bad-bg:#491a1a;
  --p-medium:#f2c14e;--p-high:#ff9a66;
  --shadow:0 18px 50px #00000080;--code-bg:#0b0d14;--code-ink:#dfe3f2;--code-add:#16402c;--code-del:#4d1b1d;--ins:#16402c;--del:#4d1b1d;
  --stage:#141722;--stage-line:#2b3144;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121a;--surface:#181b26;--rail:#141722;--panel:#1f2331;--hover:#262b3c;--line:#2b3144;--line-strong:#3a4259;--ink:#e6e9f5;--muted:#9da8c2;
  --primary:#a3b3ff;--on-primary:#0f1a55;--container:#2b3670;--on-container:#e0e6ff;
  --product:#cdb1ff;--product-bg:#2d2150;--platform:#86e0cb;--platform-bg:#0f3932;--work:#ffc774;--work-bg:#3d2b0c;--design:#ffa3c6;--design-bg:#461a2e;
  --ok:#94e2bc;--ok-bg:#12392a;--warn:#ffd680;--warn-bg:#3b2d0b;--warn-line:#b88400;--bad:#ffaca7;--bad-bg:#491a1a;
  --p-medium:#f2c14e;--p-high:#ff9a66;
  --shadow:0 18px 50px #00000080;--code-bg:#0b0d14;--code-ink:#dfe3f2;--code-add:#16402c;--code-del:#4d1b1d;--ins:#16402c;--del:#4d1b1d;
  --stage:#141722;--stage-line:#2b3144;color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--primary)}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased;user-select:none}
.ms.sm{font-size:16px}.ms.xs{font-size:14px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-size:12.5px}
.muted{color:var(--muted)}.small{font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* prototype bar */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;background:var(--code-bg);color:var(--code-ink);font-size:12.5px}
.proto b{font-weight:500;margin-right:6px}
.proto button{border:1px solid #ffffff30;background:transparent;border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--code-ink)}
.proto button[aria-current="true"]{background:var(--code-ink);color:var(--code-bg)}
.proto .sp{flex:1}

/* shell */
.app{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:calc(100vh - 40px)}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;padding:4px 8px 12px}
.proj{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:10px}
.proj i{width:28px;height:28px;border-radius:7px;background:var(--design);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.proj small{display:block;color:var(--muted);font-size:11.5px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
.nav[aria-current="page"]{background:var(--container);color:var(--on-container);font-weight:500}
.main{padding:20px clamp(16px,3vw,36px) 60px;min-width:0}
@media (max-width:860px){.app{grid-template-columns:1fr}.rail{display:none}}

/* header */
.crumb{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}
.crumb a{color:inherit;text-decoration:none}
.head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:24px;line-height:1.25;margin:0 0 8px;font-weight:500;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 8px;font-size:12.5px;white-space:nowrap;line-height:20px}
.chip.role-product{background:var(--product-bg);color:var(--product);border-color:transparent;font-weight:500}
.chip.role-platform{background:var(--platform-bg);color:var(--platform);border-color:transparent;font-weight:500}
.chip.ref{font-weight:500}
.chip.ref .ms{color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;line-height:20px;white-space:nowrap}
.st-review{background:var(--ok-bg);color:var(--ok)}.st-working{background:var(--container);color:var(--on-container)}.st-queued{background:var(--panel);color:var(--muted)}
.st-sent{background:var(--warn-bg);color:var(--warn)}.st-failed{background:var(--bad-bg);color:var(--bad)}.st-applied{background:var(--ok-bg);color:var(--ok)}.st-handoff{background:var(--panel);color:var(--muted)}
.prio{color:var(--p-medium)}.prio.high{color:var(--p-high)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 16px;background:var(--primary);color:var(--on-primary);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--line-strong)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad);color:var(--surface)}
.btn.sm{padding:4px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--primary);cursor:pointer;padding:0;font-size:12.5px}

/* avatars */
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;flex:none;overflow:hidden;font-size:10.5px;font-weight:700;color:#fff;background:#2f3a57}
.av svg{width:100%;height:100%;display:block}
.av.lg{width:32px;height:32px;font-size:13px}

/* layout */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h2{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500}
dl.fields{display:grid;grid-template-columns:84px minmax(0,1fr);gap:9px 10px;margin:0;align-items:center}
dl.fields dt{color:var(--muted);font-size:13px}dl.fields dd{margin:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}

section.blk{margin-bottom:26px}
.blk>h2{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;margin:0 0 10px}
.blk>h2 .count{font-weight:400;color:var(--muted);font-size:13px}
.blk>h2 .sp{flex:1}

/* task */
.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.task-row{padding:14px 18px;border-top:1px solid var(--line)}
.task-row:first-child{border-top:0}
.task-label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.task-label .sp{flex:1}
.ask{display:flex;gap:10px;align-items:flex-start}
.ask blockquote{margin:0;font-size:15px;line-height:1.55;max-width:68ch}
.ask cite{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:4px}
.produces{display:flex;flex-direction:column;gap:6px}
.prod{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.verb{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:1px 6px}
.verb.rev{background:var(--container);color:var(--on-container)}.verb.new{background:var(--ok-bg);color:var(--ok)}.verb.del{background:var(--bad-bg);color:var(--bad)}.verb.chg{background:var(--warn-bg);color:var(--warn)}
ol.crits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.crit{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px dashed var(--line);align-items:start}
.crit:first-child{border-top:0}
.crit .n{width:22px;height:22px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.crit .t{font-size:14px}
.crit .src{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.srcchip{font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.vchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:6px;padding:1px 7px;background:var(--panel);color:var(--ink);white-space:nowrap}
.vchip .ms{font-size:15px}
.crit.suggest{background:var(--stage);border-radius:8px;padding:9px 8px;border:1px dashed var(--stage-line);margin-top:6px}
.lockline{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding-top:10px}
.crit-state{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.crit-state.pass{color:var(--ok)}.crit-state.fail{color:var(--bad)}.crit-state.wait{color:var(--muted)}

/* runs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;border:0;background:none;padding:9px 14px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{border-bottom-color:var(--primary);color:var(--ink);font-weight:500}
.tab .dot{width:8px;height:8px;border-radius:50%}
.dot.review,.dot.applied{background:var(--ok)}.dot.sent{background:var(--warn-line)}.dot.failed{background:var(--bad)}.dot.handoff{background:var(--line-strong)}
.dot.working{background:var(--primary);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.runpanel{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.runsum{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.runsum .who{display:flex;gap:8px;align-items:center;font-weight:500}
.stat{display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.stat b{font-size:14px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.runsum .sp{flex:1}
.banner{display:flex;gap:10px;border-radius:10px;padding:10px 12px;font-size:13.5px}
.banner.sent{background:var(--warn-bg);color:var(--warn)}.banner.failed{background:var(--bad-bg);color:var(--bad)}.banner.handoff{background:var(--panel)}.banner.review{background:var(--ok-bg);color:var(--ok)}
.banner p{margin:0}.banner .ms{flex:none}
.banner q{color:var(--ink)}
.sub{font-size:13px;font-weight:500;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sub .sp{flex:1}
.changes{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chg{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.chg:first-child{border-top:0}
.chg-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chg-head .sp{flex:1}
.inline-diff{font-size:14px;line-height:1.6;padding-left:2px}
del{background:var(--del);text-decoration:line-through;text-decoration-color:var(--bad);border-radius:3px;padding:0 2px}
ins{background:var(--ins);text-decoration:none;border-radius:3px;padding:0 2px}
.plus{color:var(--ok);font-variant-numeric:tabular-nums}.minus{color:var(--bad);font-variant-numeric:tabular-nums}
.claims{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.claim{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.claim .ms{font-size:18px}
.claim.pass .ms{color:var(--ok)}.claim.fail .ms{color:var(--bad)}.claim.wait .ms{color:var(--muted)}
.claim small{display:block;color:var(--muted)}

/* timeline */
.objs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.obj{border-top:1px solid var(--line)}
details.obj:first-child{border-top:0}
details.obj>summary{list-style:none;display:grid;grid-template-columns:20px minmax(0,1fr) 120px 64px;gap:10px;align-items:center;padding:9px 12px;cursor:pointer}
details.obj>summary::-webkit-details-marker{display:none}
details.obj[open]>summary{background:var(--panel)}
.obj .ic{font-size:18px}
.obj.done .ic{color:var(--ok)}.obj.now .ic{color:var(--primary)}.obj.todo .ic{color:var(--line-strong)}.obj.stuck .ic{color:var(--warn-line)}
.obj .ot{display:flex;flex-direction:column;min-width:0}
.obj .ot small{color:var(--muted);font-size:12px}
.obj .stumble{color:var(--warn);font-size:12px;display:flex;gap:4px;align-items:center}
.bar{height:6px;background:var(--panel);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--line-strong);border-radius:3px}
.obj.now .bar i{background:var(--primary)}
.obj .dur{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
.events{list-style:none;margin:0;padding:6px 12px 12px 42px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.events li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:start}
.events li .ms{font-size:15px;color:var(--muted)}
.events li.warn .ms,.events li.warn{color:var(--warn)}
.events li.err .ms{color:var(--bad)}
.events li.ok .ms{color:var(--ok)}
.events time{color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:600px){details.obj>summary{grid-template-columns:20px minmax(0,1fr) 54px}.obj .bar{display:none}}

/* live */
.live-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live-now{display:flex;gap:10px;align-items:center;background:var(--container);color:var(--on-container);border-radius:10px;padding:10px 12px}
.live-now .ms{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.feed li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;font-size:12.5px;align-items:start;animation:fadein .4s}
.feed li .ms{font-size:15px;color:var(--muted)}
.feed li.ok .ms{color:var(--ok)}.feed li.err .ms{color:var(--bad)}.feed li.warn .ms{color:var(--warn-line)}
@keyframes fadein{from{background:var(--container)}to{background:transparent}}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}

/* activity */
ol.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ol.log li{display:flex;gap:10px;font-size:13px;align-items:flex-start}
ol.log time{color:var(--muted);font-size:12px;margin-left:6px}
.comment{display:flex;gap:8px;margin-top:12px}
.comment input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}

/* review mode */
.rvmode{display:grid;grid-template-rows:auto minmax(0,1fr);height:calc(100vh - 40px)}
.rv-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.rv-top h1{font-size:16px;margin:0;font-weight:500}
.rv-top .sp{flex:1}
.pips{display:flex;gap:4px}
.pip{width:22px;height:6px;border-radius:3px;background:var(--line);border:0;padding:0;cursor:pointer}
.pip.cur{outline:2px solid var(--primary);outline-offset:1px}
.pip.accept{background:var(--ok)}.pip.reject{background:var(--bad)}
.rv-body{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
.viewer{display:flex;flex-direction:column;min-height:0;background:var(--stage);border-right:1px solid var(--line)}
.vtabs{display:flex;gap:2px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.vpane{flex:1;overflow:auto;padding:20px}
.stepper{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.step{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.step-foot{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step-foot .sp{flex:1}
.kbd{font-family:"Roboto Mono",monospace;font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
.step h2{font-size:18px;font-weight:500;margin:0;line-height:1.35;text-wrap:balance}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0}
.srcbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);font-size:13px}
.srcbox q{display:block;margin-top:4px;font-size:13.5px}
.evid{display:flex;flex-direction:column;gap:6px}
.ev{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.ev:hover{background:var(--hover)}
.ev .ms{font-size:18px}
.ev.pass .ms{color:var(--ok)}.ev.fail .ms{color:var(--bad)}.ev.info .ms{color:var(--primary)}.ev.warn .ms{color:var(--warn-line)}
.ev small{display:block;color:var(--muted);font-size:12px}
.verdict{display:flex;gap:8px}
.verdict button{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px;cursor:pointer;font-weight:500}
.verdict button.yes[aria-pressed="true"]{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.verdict button.no[aria-pressed="true"]{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.verdict-note{width:100%;border:1px solid var(--bad);border-radius:8px;padding:8px 10px;background:var(--surface);min-height:64px;resize:vertical}
.sumlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sumlist li{display:flex;gap:8px;font-size:13px;align-items:flex-start}
.sumlist .ms{font-size:18px}
.sumlist .a{color:var(--ok)}.sumlist .r{color:var(--bad)}.sumlist .u{color:var(--muted)}
@media (max-width:900px){.rvmode{height:auto}.rv-body{grid-template-columns:minmax(0,1fr)}.viewer{border-right:0;border-bottom:1px solid var(--line)}.vpane{max-height:none}}

/* brief doc render */
.doc{max-width:680px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 32px;box-shadow:0 1px 2px #1c2a5a12}
.doc h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--product);margin:20px 0 6px;font-weight:500}
.doc h3:first-of-type{margin-top:0}
.doc p{margin:0 0 4px;font-size:15.5px;line-height:1.6}
.doc .docname{font-size:22px;font-weight:500;margin:0 0 4px}
.doc .dim{opacity:.55}
.hl{outline:2px solid var(--primary);outline-offset:4px;border-radius:4px}
.fieldiff{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:720px;margin:0 auto}
.fieldiff dt{color:var(--muted)}.fieldiff dd{margin:0}

/* code review */
.browser{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.browser-bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted)}
.browser-bar i{width:10px;height:10px;border-radius:50%;background:var(--line-strong)}
.browser-bar span{margin-left:8px;background:var(--surface);border-radius:6px;padding:2px 10px;flex:1}
.desk{position:relative;height:380px;background:linear-gradient(135deg,#dfe7f7,#eef1fa);overflow:hidden;cursor:crosshair}
:root[data-theme="dark"] .desk{background:linear-gradient(135deg,#1c2233,#232a3d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .desk{background:linear-gradient(135deg,#1c2233,#232a3d)}}
.petwin{position:absolute;right:18px;bottom:18px;width:300px;height:210px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.petwin header{font-size:11.5px;padding:4px 8px;border-bottom:1px solid var(--line);color:var(--muted);display:flex;justify-content:space-between}
.petfield{position:absolute;inset:25px 0 0 0}
.edge{position:absolute;inset:24px;border:1px dashed var(--warn-line);border-radius:6px;pointer-events:none;opacity:0}
.show-edge .edge{opacity:.8}
.pet{position:absolute;width:38px;height:34px;left:0;top:0;transition:transform .08s linear}
.preview-ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:12px;font-size:12.5px}
.tests{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;align-items:center;font-size:13px}
.trow.hl2{outline:2px solid var(--primary)}
.trow .ms{color:var(--ok);font-size:18px}
.trow small{color:var(--muted);display:block}
.tsum{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap}
.difffile{max-width:880px;margin:0 auto 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.difffile header{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;background:var(--panel)}
.difffile header .sp{flex:1}
.dcode{margin:0;overflow-x:auto;font-family:"Roboto Mono",monospace;font-size:12.5px;line-height:1.6;background:var(--code-bg);color:var(--code-ink);padding:8px 0}
.dcode span{display:block;padding:0 12px;white-space:pre}
.dcode .a{background:var(--code-add)}.dcode .d{background:var(--code-del)}

/* ledger + toast */
.ledger{position:fixed;right:16px;top:calc(48px + env(safe-area-inset-top,0px));z-index:40;width:min(440px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.ledger h2{font-size:14px;margin:0 0 8px}
.ledger table{border-collapse:collapse;font-size:12.5px;width:100%}
.ledger td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.ledger td:first-child{font-weight:500;white-space:nowrap}
.ledger a{cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--code-bg);color:var(--code-ink);padding:9px 16px;border-radius:999px;font-size:13px;z-index:50}

function taskBlock(item, opts={}){

    <div class="task-row"><p class="task-label">Done when <span class="count" style="text-transform:none;letter-spacing:0;font-weight:400">${crits.length} criteria</span><span class="sp"></span>

    </div>
  </div></section>`;
}
function critState(s, v){ const t = v === 'test'; return s === 'pass' ? `<span class="crit-state pass">${ms('check_circle','sm')}${t ? 'Test green' : 'Passing'}</span>` : s === 'fail' ? `<span class="crit-state fail">${ms('cancel','sm')}${t ? 'Test red' : 'Failing'}</span>` : `<span class="crit-state wait">${ms('radio_button_unchecked','sm')}Not yet</span>`; }
function side(item, rows){

    const tests = [['follows the cursor when it enters','0.04s','1'],['stays 24 px inside the left and top edges','0.03s','2'],['stays 24 px inside the right and bottom edges','0.03s','2'],['moves at motion.pet-walk with a controlled clock','0.06s','3'],['turns instead of walking when reduced motion is on','0.02s','4'],['imports Sprite from src/components','0.01s','5']];
    const hi = state.hiTest;
    return `<div class="tests"><div class="tsum">${ms('verified')}<b>6 of 6 passed</b><span class="muted">Re-run by Aludel on commit 4f2a9c1 · the agent’s own result matched</span></div>
      ${tests.map((t,k) => `<div class="trow ${hi===k?'hl2':''}"><span class="ms">check_circle</span><span>${t[0]}<small>tests/pet-follow.test.ts · proves criterion ${t[2]}</small></span><span class="muted small">${t[1]}</span></div>`).join('')}
      <p class="small muted">Written in step 2 of the run from the criteria, before the code change. 2 were red then, as expected.</p></div>`;
  }
  const files = [
    ['src/pet/pet.ts','chg','+31 −9',['  import { Sprite } from \'../components/sprite\';','- const SPEED = 2; // px per frame','+ const speed = tokens.motion.petWalk; // px per second','  export function step(pet, target, dt, reducedMotion) {','+   if (reducedMotion) return face(pet, target);','+   const d = Math.min(speed * dt, distance(pet, target));']],
    ['src/pet/bounds.ts','new','+21',['+ export const MARGIN = 24;','+ export function clamp(p, win) {','+   return { x: within(p.x, MARGIN, win.width - MARGIN),','+            y: within(p.y, MARGIN, win.height - MARGIN) };','+ }']],
    ['src/pet/clock.ts','new','+9',['+ export const clock = { now: () => performance.now() };']],
    ['tests/pet-follow.test.ts','new','+96',['+ test(\'stays 24 px inside the right and bottom edges\', () => {','+   const p = clamp({ x: 999, y: 999 }, { width: 300, height: 185 });','+   expect(p).toEqual({ x: 276, y: 161 });','+ });']],
  ];
  return files.map(([f,v,n,lines]) => `<div class="difffile"><header><span class="verb ${v}">${v==='new'?'Add':'Change'}</span><span class="mono">${f}</span><span class="sp"></span><span class="mono">${n}</span></header>
    <pre class="dcode">${lines.map(l => `<span class="${l[0]==='+'?'a':l[0]==='-'?'d':''}">${esc(l)}</span>`).join('')}</pre></div>`).join('') + `<p class="small muted" style="text-align:center">4 files · all inside src/pet/ and tests/ · package.json unchanged</p>`;
}

/* ---------- interactive preview pet ---------- */
let petRAF = null;
function startPet(){
  cancelAnimationFrame(petRAF);
  const field = document.getElementById('petfield'), pet = document.getElementById('pet'); if (!field) return;
  const desk = document.getElementById('desk');
  let pos = {x:40, y:60}, target = null, last = performance.now(), facing = 1;
  desk.addEventListener('mousemove', e => { const r = field.getBoundingClientRect(); const inside = e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom; target = inside ? {x:e.clientX-r.left, y:e.clientY-r.top} : null; });
  desk.addEventListener('mouseleave', () => target = null);
  const edge = document.getElementById('edge'); edge && edge.addEventListener('change', () => desk.classList.toggle('show-edge', edge.checked));
  const loop = now => {
    const dt = Math.min(.05, (now-last)/1000); last = now;
    const W = field.clientWidth, H = field.clientHeight, M = 24;
    const rm = document.getElementById('rm')?.checked;
    if (target){
      const tx = Math.max(M, Math.min(W-M, target.x)), ty = Math.max(M, Math.min(H-M, target.y));
      facing = tx < pos.x ? -1 : 1;
      if (!rm){ const dx = tx-pos.x, dy = ty-pos.y, dist = Math.hypot(dx,dy), s = Math.min(120*dt, dist); if (dist > .5){ pos.x += dx/dist*s; pos.y += dy/dist*s; } }
    }
    pet.style.transform = `translate(${pos.x-19}px,${pos.y-17}px) scaleX(${facing})`;
    petRAF = requestAnimationFrame(loop);
  };
  petRAF = requestAnimationFrame(loop);
}

/* ---------- ledger ---------- */
const ledger = [
  ['D1','Keep Details sidebar and Activity at the bottom','Every screen','w4'],
  ['D2','High-level task at the top','Task: request, produces, done when','w4'],
  ['D3','What happened: who, objectives, time each, changes, stumbles; compressed','Run tab › What happened (open a row); stumbles show while collapsed','w4'],
  ['D4','See what changed and interact with the result beside its criteria','Review mode: result on the left, criterion and its source on the right','rv4'],
  ['D5','Tabs per run, with why earlier runs weren’t applied','Run tabs with a reason banner (screens 2 and 4)','w9'],
  ['D6','Live run as its own tab, updating','Screen 4 · Run 3','w9'],
  ['D7','Generated progress, not hard-coded','Live plan written by the agent at the start','w9'],
  ['D8','Review stepping through the checklist','Full-page review route, one criterion at a time','rv9'],
  ['D9','Criteria set first; performer develops against them','Done when, fixed at Go; suggestions before Go; tests written first (screen 5, Tests)','before'],
  ['D10','The page works before work starts','Screen 1','before'],
];
function renderLedger(){ $('#ledger').innerHTML = `<h2>Your asks, and where each is answered</h2><table>${ledger.map(([id,a,w,s]) => `<tr><td>${id}</td><td>${a}<br><a data-go="${s}">${w}</a></td></tr>`).join('')}</table>`; }

/* ---------- render + events ---------- */
function render(keepScroll){
  const y = window.scrollY;
  const s = state.screen;
  $('#root').innerHTML = s==='before' ? screenBefore() : s==='w4' ? screenW4() : s==='w9' ? screenW9() : screenReview(s);
  document.querySelectorAll('.proto [data-screen]').forEach(b => b.setAttribute('aria-current', b.dataset.screen === s));
  if (s === 'rv9') startPet();
  if (keepScroll) window.scrollTo(0, y);
}
function go(screen){
  state.screen = screen; state.vtab = null; state.hiTest = null;
  if (screen.startsWith('rv')) state.step = 0;
  try { history.replaceState(null, '', '#' + screen); } catch (e) {}
  clearInterval(timer); if (screen === 'w9') timer = setInterval(tickLive, 1000);
  render(); window.scrollTo(0,0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-screen],[data-go],[data-run],[data-act],[data-step],[data-v],[data-nav],[data-vtab],[data-look]'); if (!t) return;
  const d = t.dataset;
  if (d.screen) return go(d.screen);
  if (d.go){ $('#ledger').hidden = true; return go(d.go); }
  if (d.run){ const [k,id] = d.run.split(':'); state.run[k] = id==='live' ? 'live' : +id; return render(true); }
  if (d.step !== undefined){ state.step = +d.step; state.vtab = null; return render(true); }
  if (d.vtab){ state.vtab = d.vtab; return render(true); }
  if (d.look){ const [tab, n] = d.look.split(':'); state.vtab = tab; state.hiTest = n !== undefined ? +n : null; return render(true); }
  if (d.nav){ const n = rv[state.screen].steps.length; state.step = Math.max(0, Math.min(n, state.step + +d.nav)); state.vtab = null; return render(true); }
  if (d.v){ const V = state.verdicts[state.screen]; V[state.step] = V[state.step] === d.v ? undefined : d.v;
    render(true); if (V[state.step] === 'reject') document.getElementById('rnote')?.focus(); else if (V[state.step]) setTimeout(() => { state.step++; state.vtab=null; render(true); }, 250); return; }
  const a = d.act;
  if (a === 'keep'){ state.suggested = true; toast('Criterion kept'); return render(true); }
  if (a === 'dismiss'){ state.suggested = true; toast('Suggestion dismissed'); return render(true); }
  if (a === 'stage') return toast('Staged in Default agent’s batch (prototype)');
  if (a === 'stop') return toast('Stop asks Deep agent to finish its current step (prototype)');
  if (a === 'apply') { toast(state.screen==='rv4' ? 'Brief › Value is now revision 2. W-4 is done.' : 'Commit 4f2a9c1 merged. W-9 is done.'); return; }
  if (a === 'sendback') { toast('Sent back with your notes. Stage it again when ready.'); return; }
});
document.addEventListener('input', e => { if (e.target.id === 'rnote') state.notes[state.screen][state.step] = e.target.value; });
document.addEventListener('keydown', e => {
  if (!state.screen.startsWith('rv') || e.target.matches('input,textarea')) return;
  const k = e.key.toLowerCase(); const n = rv[state.screen].steps.length;
  if (k === 'a' || k === 'r'){ if (state.step < n) document.querySelector(`[data-v="${k==='a'?'accept':'reject'}"]`)?.click(); }
  else if (k === 'j' || e.key === 'ArrowRight'){ state.step = Math.min(n, state.step+1); state.vtab=null; render(true); }
  else if (k === 'k' || e.key === 'ArrowLeft'){ state.step = Math.max(0, state.step-1); state.vtab=null; render(true); }
  else if (e.key === 'Escape') go(rv[state.screen].back);
});
$('#ledger-btn').addEventListener('click', () => { const l = $('#ledger'); l.hidden = !l.hidden; $('#ledger-btn').setAttribute('aria-expanded', !l.hidden); });
renderLedger();
const start = location.hash.replace('#','');
go(['before','w4','rv4','w9','rv9'].includes(start) ? start : 'w4');
</script>
