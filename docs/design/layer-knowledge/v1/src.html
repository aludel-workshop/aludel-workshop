<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layer Knowledge</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- LAYER-KNOWLEDGE-01 prototype v1 (static, clickable). Built from ../specs/*.json by build.mjs; edit src.html, not index.html.
     Owner asks A1-A8 in ../work-record.md map to screens; see the prototype bar's notes. Contents are illustrative. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<style>
:root{
  --bg:#fafbff;--surface:#fff;--rail:#f0f4fc;--panel:#f3f6fd;--hover:#e3e9f7;--line:#dce2ef;--line-strong:#c5cee2;--ink:#141727;--muted:#52617d;
  --primary:#3047b9;--on-primary:#fff;--container:#dfe5ff;--on-container:#163698;
  --ok:#146446;--ok-bg:#d9f3e7;--warn:#6b4b00;--warn-bg:#fff0c9;--warn-line:#e0a100;--bad:#a1231f;--bad-bg:#fce1e0;
  --code-bg:#141727;--code-ink:#e8ebf7;--shadow:0 18px 50px #1c2a5a26;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10121a;--surface:#181b26;--rail:#141722;--panel:#1f2331;--hover:#262b3c;--line:#2b3144;--line-strong:#3a4259;--ink:#e6e9f5;--muted:#9da8c2;
  --primary:#a3b3ff;--on-primary:#0f1a55;--container:#2b3670;--on-container:#e0e6ff;
  --ok:#94e2bc;--ok-bg:#12392a;--warn:#ffd680;--warn-bg:#3b2d0b;--warn-line:#b88400;--bad:#ffaca7;--bad-bg:#491a1a;
  --code-bg:#0b0d14;--code-ink:#dfe3f2;--shadow:0 18px 50px #00000080;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121a;--surface:#181b26;--rail:#141722;--panel:#1f2331;--hover:#262b3c;--line:#2b3144;--line-strong:#3a4259;--ink:#e6e9f5;--muted:#9da8c2;
  --primary:#a3b3ff;--on-primary:#0f1a55;--container:#2b3670;--on-container:#e0e6ff;
  --ok:#94e2bc;--ok-bg:#12392a;--warn:#ffd680;--warn-bg:#3b2d0b;--warn-line:#b88400;--bad:#ffaca7;--bad-bg:#491a1a;
  --code-bg:#0b0d14;--code-ink:#dfe3f2;--shadow:0 18px 50px #00000080;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font:14px/1.55 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--primary)}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;vertical-align:middle;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased;user-select:none}
.ms.sm{font-size:17px}.ms.xs{font-size:15px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-size:12.5px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* prototype bar */
.proto{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 16px;background:var(--code-bg);color:var(--code-ink);font-size:12.5px}
.proto b{font-weight:500;margin-right:4px}
.proto button{border:1px solid #ffffff30;background:transparent;border-radius:999px;padding:3px 10px;cursor:pointer;color:var(--code-ink)}
.proto button[aria-current="true"]{background:var(--code-ink);color:var(--code-bg)}
.proto .sp{flex:1}.proto .note{color:#aab3cc}

/* shell */
.app{display:grid;grid-template-columns:64px minmax(0,1fr);min-height:calc(100vh - 38px)}
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.rail a{display:grid;place-items:center;width:44px;height:40px;border-radius:12px;color:var(--muted);text-decoration:none}
.rail a:hover{background:var(--hover)}
.rail a[aria-current="page"]{background:var(--lb);color:var(--lc)}
.main{min-width:0;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:10px;padding:14px 24px 0}
.lhead .lic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--lb);color:var(--lc)}
.lhead h1{font-size:20px;font-weight:500;margin:0}
.lhead .chip{margin-left:4px}
.lbar{display:flex;gap:2px;align-items:flex-end;padding:8px 24px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.lbar a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.lbar a:hover{color:var(--ink)}
.lbar a[aria-current="page"]{color:var(--lc);border-bottom-color:var(--lc)}
.lbar .sp{flex:1}
.lbar .new{font-size:10.5px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:1px}

/* knowledge layout: one sidebar (Docs, then Information), reading pane, outline */
.kn{display:grid;grid-template-columns:300px minmax(0,1fr) 200px;flex:1;min-height:0}
.side{border-right:1px solid var(--line);padding:14px 10px 90px;position:sticky;top:38px;align-self:start;max-height:calc(100vh - 38px);overflow:auto;background:var(--surface)}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:0 4px 12px;color:var(--muted);background:var(--bg)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:16px 6px 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.sec-h:first-of-type{margin-top:4px}
.sec-h button{letter-spacing:0;text-transform:none;font-weight:500;font-size:12.5px}
.nl{display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px;border-radius:8px;color:var(--ink);text-decoration:none;border:0;background:transparent;text-align:left;cursor:pointer;min-height:32px}
.nl:hover{background:var(--hover)}
.nl[aria-current="page"]{background:var(--lb);color:var(--lc);font-weight:500}
.nl .tw{width:18px;flex:none;display:grid;place-items:center;color:var(--muted);border-radius:4px}
.nl .tw:hover{background:var(--line)}
.nl .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nl .cnt{font-size:11.5px;color:var(--muted)}
.nl input[type=checkbox]{margin:0 2px 0 0;width:16px;height:16px;accent-color:var(--lc)}
.nl .badge{font-size:10.5px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:0 5px}
.kids{margin-left:14px;border-left:1px solid var(--line);padding-left:4px}
.group-h{display:flex;align-items:center;gap:6px;padding:5px 8px;color:var(--muted);font-weight:500;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;border-radius:8px;min-height:32px}
.group-h:hover{background:var(--hover)}
.local-h{font-size:12px;color:var(--muted);margin:6px 8px 2px}
.bcard{border:1px solid var(--line-strong);border-radius:12px;margin:10px 2px 4px;background:var(--bg);overflow:hidden}
.bcard.proposed{border-style:dashed;border-color:var(--warn-line)}
.bcard.draft{border-style:dashed;border-color:var(--primary)}
.bcard-h{display:block;padding:8px 10px 6px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.bcard-h:hover{background:var(--hover)}
.bcard-h[aria-current="page"]{background:var(--container);color:var(--on-container)}
.bcard-h .t{display:flex;align-items:center;gap:6px;font-weight:500}
.bcard-h .w{font-size:12px;color:var(--muted);margin-top:2px;padding-left:24px}
.bcard .nodes{padding:4px}
.selbar{position:sticky;bottom:-90px;margin:14px -10px -90px;padding:10px 14px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 -8px 20px #1c2a5a14}
.selbar .n{flex:1;font-weight:500}

.read{padding:24px 40px 80px;min-width:0;max-width:900px}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{text-decoration:underline}
.read h2.title{font-size:28px;line-height:1.25;font-weight:500;margin:0 0 6px}
.lead{font-size:16.5px;color:var(--muted);margin:0 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.read h3{font-size:18px;font-weight:500;margin:28px 0 8px;scroll-margin-top:60px}
.md h2{font-size:19px;font-weight:500;margin:22px 0 6px}
.md p,.md ul,.md ol{margin:0 0 10px}
.md code{font-family:"Roboto Mono",monospace;font-size:12.5px;background:var(--panel);padding:1px 5px;border-radius:5px}
.md blockquote{margin:0 0 10px;padding:4px 12px;border-left:3px solid var(--line-strong);color:var(--muted)}
pre.fmt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;font-family:"Roboto Mono",monospace;font-size:12.5px;margin:0 0 10px;white-space:pre-wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--panel);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.meta .chip{white-space:normal;max-width:100%}
.chip.layer{background:var(--lb);color:var(--lc);border-color:transparent}
.chip.live{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.proposed{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.draft{background:var(--container);color:var(--on-container);border-color:transparent}
.chip.new{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);min-height:34px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 10px;min-height:28px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
table.t{width:100%;border-collapse:collapse;margin:0 0 8px;font-size:13.5px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:6px 8px}
table.t td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.tbl{overflow-x:auto}
.box{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);margin:0 0 12px}
.box.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.box.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.box.info{background:var(--container);border-color:transparent;color:var(--on-container)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:0 0 12px}
.card{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--line-strong);background:var(--hover)}
.card .h{display:flex;align-items:center;gap:6px;font-weight:500;margin-bottom:4px}
.card p{margin:0;color:var(--muted);font-size:13px}
.parts{display:grid;gap:10px}
.part{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.part .nodes a{display:inline-block;margin:0 6px 4px 0}
.role{font-size:12.5px;font-weight:500}
.role small{display:block;font-weight:400;color:var(--muted)}
.outline{position:sticky;top:60px;align-self:start;padding:28px 16px;font-size:12.5px}
.outline b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.outline a{display:block;color:var(--muted);text-decoration:none;padding:3px 0 3px 10px;border-left:2px solid var(--line)}
.outline a:hover{color:var(--ink);border-left-color:var(--line-strong)}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.editor textarea{width:100%;min-height:340px;border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;background:var(--surface);font-family:"Roboto Mono",monospace;font-size:12.5px;resize:vertical}
.editor .pv{border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:340px;background:var(--surface);overflow:auto}
.compose{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compose .col{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);min-width:0}
.compose h4{margin:0 0 8px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.picktree .nl{min-height:30px}
.field{display:grid;gap:4px;margin:0 0 12px}
.field label{font-weight:500;font-size:13px}
.field input,.field textarea,.field select{border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;background:var(--surface)}
.field textarea{min-height:84px;resize:vertical}
.leads{display:flex;flex-wrap:wrap;gap:8px}
.leads label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.leads input{accent-color:var(--primary)}
ul.effects{margin:0;padding-left:18px}ul.effects li{margin:0 0 6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--code-bg);color:var(--code-ink);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:60;max-width:min(560px,calc(100vw - 32px))}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.sw{width:88px;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:11.5px;background:var(--surface)}
.sw i{display:block;height:44px}
.sw span{display:block;padding:4px 6px}
.rolenote{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 16px}
.tabpage{padding:24px}
.mtoggle{display:none}
@media (max-width:1279px){.kn{grid-template-columns:280px minmax(0,1fr)}.outline{display:none}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}.rail{display:none}
  .kn{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:none;padding-bottom:16px}
  .kn.open .side{display:block}
  .selbar{position:static;margin:14px 0 0;bottom:auto}
  .mtoggle{display:flex;margin:12px 16px 0}
  .read{padding:16px 16px 60px}
  .lhead,.lbar{padding-left:16px;padding-right:16px}
  .part{grid-template-columns:1fr}
  .editor,.compose{grid-template-columns:1fr}
  .read h2.title{font-size:23px}
}
</style>

<body>
<div class="proto" role="region" aria-label="Prototype controls">
  <b>LAYER-KNOWLEDGE-01 · v1</b><span class="note">Tool Share · open a layer:</span>
  <span id="layerBtns"></span>
  <span class="sp"></span>
  <button type="button" id="theme">Theme</button>
  <button type="button" id="reset">Reset</button>
</div>
<div class="app" id="app"></div>
<script id="data" type="application/json">/*DATA*/</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const fresh = () => JSON.parse(JSON.stringify(DATA.project));
let state = { project: fresh(), select: false, picked: new Set(), open: {}, edits: {}, draft: null, tab: null, menu: false };
const L = key => DATA.layers[key];
const poss = n => esc(n) + (String(n).endsWith('s') ? '\u2019' : '\u2019s');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const roleWords = { authority: ['Leads', 'Others follow it'], replica: ['Keeps a copy', 'Read-only; propose changes'], ceded: ['Hands over', 'Points to the lead'] };

// ---- tree helpers ----
function walk(nodes, fn, parent = null) { for (const n of nodes) { fn(n, parent); walk(n.children || [], fn, n); } }
function findNode(layer, key) { let hit = null, par = null; walk(L(layer).information, (n, p) => { if (n.key === key) { hit = n; par = p; } }); return hit && { node: hit, parent: par }; }
function pathOf(layer, key) { const out = []; let cur = findNode(layer, key); while (cur) { out.unshift(cur.node); cur = cur.parent ? findNode(layer, cur.parent.key) : null; } return out; }
function descendants(node) { const out = [node.key]; walk(node.children || [], n => out.push(n.key)); return out; }
// Bindings a node takes part in, directly or through an ancestor (a bound node brings its children).
function bindingsOf(layer, key, includeProposed = true) {
  const keys = pathOf(layer, key).map(n => n.key);
  return state.project.bindings.filter(b => (includeProposed || b.status === 'live') && b.participants.some(p => p.layer === layer && p.nodes.some(k => keys.includes(k))));
}
function participant(b, layer) { return b.participants.find(p => p.layer === layer); }
function layerBindings(layer) { return state.project.bindings.filter(b => b.participants.some(p => p.layer === layer)); }
function boundTop(layer) { const s = new Set(); for (const b of layerBindings(layer)) for (const k of participant(b, layer).nodes) s.add(k); return s; }
function inBoundSubtree(layer, key) { const bound = boundTop(layer); return pathOf(layer, key).some(n => bound.has(n.key)); }
function localView(layer) {
  const bound = boundTop(layer);
  const strip = n => { if (bound.has(n.key)) return null; if (!n.children) return n; const kids = n.children.map(strip).filter(Boolean); return kids.length ? { ...n, children: kids } : null; };
  return L(layer).information.map(strip).filter(Boolean);
}
// Remove `k` from a binding's node list: drop it, or split the bound ancestor into its other parts.
function without(layer, nodes, k) {
  const split = x => x === k ? [] : findNode(layer, x).node.children.flatMap(c => c.key === k ? [] : descendants(c).includes(k) ? split(c.key) : [c.key]);
  return nodes.flatMap(x => descendants(findNode(layer, k).node).includes(x) ? [] : descendants(findNode(layer, x).node).includes(k) ? split(x) : [x]);
}
function referencedBy(layer, key) { const out = []; for (const [lk, l] of Object.entries(DATA.layers)) walk(l.information, n => { for (const r of n.refersTo || []) if (r === `${layer}:${key}`) out.push([lk, n]); }); return out; }

// ---- markdown (enough for docs pages) ----
function md(src, layer) {
  const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(#([^)]+)\)/g, (m, t, h) => `<a href="#${layer}/${h}">${t}</a>`);
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of String(src || '').split('\n')) {
    const line = raw.trimEnd();
    if (/^## /.test(line)) { close(); out.push(`<h2>${inline(line.slice(3))}</h2>`); }
    else if (/^# /.test(line)) { close(); out.push(`<h2>${inline(line.slice(2))}</h2>`); }
    else if (/^- /.test(line)) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(line.slice(2))}</li>`); }
    else if (/^\d+\. /.test(line)) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(line.replace(/^\d+\. /, ''))}</li>`); }
    else if (/^> /.test(line)) { close(); out.push(`<blockquote>${inline(line.slice(2))}</blockquote>`); }
    else if (!line) close();
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close(); return out.join('');
}

// ---- routing: #layer/kind/key ----
function route() {
  const [layer = 'pages', kind = 'doc', ...rest] = location.hash.slice(1).split('/');
  return { layer: DATA.layers[layer] ? layer : 'pages', kind, key: rest.join('/') || (kind === 'doc' ? 'overview' : '') };
}
const go = h => { location.hash = h; };
function toast(text) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text; document.body.append(t); setTimeout(() => t.remove(), 4200); }

// ---- sidebar ----
function nodeLink(layer, n, r, depth) {
  const kids = n.children || [];
  const open = state.open[`${layer}:${n.key}`] ?? depth === 0;
  const cur = r.kind === 'node' && r.key === n.key;
  const picked = state.picked.has(`${layer}:${n.key}`);

  for (const [rl, rn, lk, k] of refs) if (roleOf(d, lk) === 'ceded') out.push(`${nodeRef(rl, rn.key)} point at ${nodeRef(lk, k)}. ${esc(L(rl).layer.name)} gets Work to point them at ${esc(L(d.leads).layer.name)} instead.`);

  h += `<h2 class="title">Propose a binding</h2><p class="lead">Bind ${poss(L(d.from).layer.name)} selected information with the matching information in another layer.</p>`;
  h += `<div class="compose"><div class="col"><h4>${layerChip(d.from)} Selected</h4>${d.nodes.map(k => `<div class="nl"><span class="ms xs">check_box</span><span class="lbl">${pathOf(d.from, k).map(x => esc(x.title)).join(' › ')}</span><button class="btn sm ghost" type="button" data-act="unpick" data-node="${k}" aria-label="Remove ${esc(findNode(d.from, k).node.title)}">Remove</button></div><p class="small muted" style="margin:0 0 6px 26px">${esc(findNode(d.from, k).node.intent)}</p>`).join('')}</div>`;
  h += `<div class="col"><h4>With</h4><div class="field"><label for="withLayer">Layer</label><select id="withLayer"><option value="">Choose a layer…</option>${others.map(k => `<option value="${k}" ${d.focus === k ? 'selected' : ''}>${esc(L(k).layer.name)}</option>`).join('')}</select></div>`;
  if (d.focus) {
    const pick = (n, depth) => { const on = (d.with[d.focus] || []).includes(n.key); return `<label class="nl" style="padding-left:${8 + depth * 16}px"><input type="checkbox" data-with="${d.focus}:${n.key}" ${on ? 'checked' : ''}><span class="lbl">${esc(n.title)}</span>${bindingsOf(d.focus, n.key).length ? `<span class="chip" style="padding:0 6px;font-size:11px">in ${esc(bindingsOf(d.focus, n.key)[0].name)}</span>` : ''}</label><p class="small muted" style="margin:-2px 0 4px ${34 + depth * 16}px">${esc(n.intent)}</p>` + (n.children || []).map(c => pick(c, depth + 1)).join(''); };
    h += `<div class="picktree">${L(d.focus).information.map(n => pick(n, 0)).join('')}</div>`;
  }
  h += `</div></div>`;
  const chosen = Object.entries(d.with).filter(([, ns]) => ns.length);
  if (chosen.length) {
    const lead = [d.from, ...chosen.map(([k]) => k)];
    const { out } = draftEffects(d);
    h += `<h3>Who leads?</h3><p class="small muted">The leading layer is where this information is changed. The others follow it.</p><div class="leads">${lead.map(k => `<label><input type="radio" name="lead" value="${k}" ${d.leads === k ? 'checked' : ''}>${esc(L(k).layer.name)}</label>`).join('')}</div>`;
    h += `<h3>What the others do</h3><div class="tbl"><table class="t"><tbody>${lead.filter(k => k !== d.leads).map(k => `<tr><td>${layerChip(k)}</td><td><div class="leads"><label><input type="radio" name="role-${k}" data-role="${k}" value="replica" ${roleOf(d, k) === 'replica' ? 'checked' : ''}>Keep a copy</label><label><input type="radio" name="role-${k}" data-role="${k}" value="ceded" ${roleOf(d, k) === 'ceded' ? 'checked' : ''}>Hand over</label></div></td></tr>`).join('')}</tbody></table></div><p class="small muted">Keep a copy: it stays in this layer, read-only, kept in step. Hand over: the lead takes it over and this layer points there.</p>`;
    h += `<h3>Describe it</h3><div class="field"><label for="bname">Name</label><input id="bname" value="${esc(d.name)}" placeholder="e.g. The app's brand"></div><div class="field"><label for="bstate">How the parts match</label><textarea id="bstate" placeholder="Say why these are the same information and how one side drives the other, even though each layer keeps it in its own form.">${esc(d.statement)}</textarea></div>`;
    h += `<h3>What changes if accepted</h3><ul class="effects">${out.map(e => `<li>${e}</li>`).join('')}</ul>`;
    h += `<p style="display:flex;gap:8px;margin-top:16px"><button class="btn primary" type="button" data-act="submit">Propose</button><button class="btn" type="button" data-act="cancel-propose">Cancel</button></p>`;
  }
  return h;
}

// ---- edit (docs and spec) ----
function editPage(r) {
  const [what, key] = r.key.split('/');
  let title, body, isSpec = what !== 'doc';
  if (what === 'doc') { const d = L(r.layer).docs.find(x => x.key === key); title = d.title; body = state.edits[`${r.layer}:doc:${key}`] ?? d.body; }
  else if (what === 'node') { const n = findNode(r.layer, key).node; title = n.title; body = state.edits[`${r.layer}:node:${key}`] ?? n.body; }
  else { title = 'New information'; body = '# Title\n\nWhat it is for.\n\n## Form\n…'; }
  let h = crumbs(r, [[isSpec ? 'Information' : 'Docs'], [title, isSpec && key ? `#${r.layer}/node/${key}` : `#${r.layer}/doc/${key}`], ['Edit']]);
  h += `<h2 class="title">Edit ${esc(title)}</h2>`;
  h += `<p class="muted">${isSpec ? 'This is part of the spec. Saving puts the change on a branch of the layer repository; merging it creates a “Compare specs” task for a person or an agent.' : 'Saving puts the change on a branch of the layer repository, for you to merge.'}</p>`;
  h += `<div class="editor"><div><label class="vh" for="ed">Markdown</label><textarea id="ed">${esc(body)}</textarea></div><div class="pv md" id="pv" aria-label="Preview">${md(body, r.layer)}</div></div>`;
  h += `<p style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" type="button" data-act="save-edit" data-what="${what}:${key}">Save to a branch</button><a class="btn" href="#${r.layer}/${what === 'doc' ? 'doc' : what === 'node' ? 'node' : 'info'}/${key}">Cancel</a></p>`;
  return h;
}

// ---- an editor tab (A2: Pages' Kit) ----
function tabPage(r) {
  if (r.layer === 'pages' && r.key === 'kit') {
    return `<div class="tabpage"><div class="rolenote"><span class="ms">link</span><span style="flex:1"><strong>A copy of Design's design system.</strong> Changes are made in Design and arrive here automatically.</span><a class="btn sm" href="#design/binding/design-system">About this binding</a><button class="btn sm" type="button" data-act="todo">Propose a change</button></div>
      <h3>Tokens</h3><div class="swatches">${[['Primary', '#2e7d5b'], ['On primary', '#ffffff'], ['Surface', '#f7faf8'], ['Accent', '#c76b1e'], ['Error', '#b3261e']].map(([n, c]) => `<div class="sw"><i style="background:${c}"></i><span>${n}<br><span class="mono">${c}</span></span></div>`).join('')}</div>
      <h3>Components</h3><div class="cards">${['Button', 'Card', 'List row', 'Form field', 'Avatar', 'Badge'].map(c => `<div class="card"><span class="h">${c}</span><p>From Design › Components</p></div>`).join('')}</div>
      <h3>Brand</h3><div class="cards">${['Name: Tool Share', 'Mark: Spanner', 'Hero: Neighbours lending'].map(c => `<div class="card"><span class="h">${c}</span><p>From Design › Brand</p></div>`).join('')}</div>
      <p class="small muted">Prototype note (A2): Pages' Kit is contents, so it gets an editor tab. While Design leads, it is read-only here.</p></div>`;
  }
  return `<div class="tabpage"><p class="muted">The ${esc(tabLabel(r.layer, r.key))} tab is the layer's existing editor; it isn't part of this prototype.</p><p><a href="#${r.layer}/doc/overview">Back to Knowledge</a></p></div>`;
}

function outline(r) {
  const ids = { node: [['about', 'About'], ['parts', 'Parts'], ['shape', 'Shape'], ['contents', 'Contents'], ['sharing', 'Sharing'], ['refers', 'Points to'], ['refby', 'Referenced by']], binding: [['what', 'What it binds'], ['pairs', 'Matching parts'], ['changes', 'What changes'], ['manage', 'Change it'], ['activity', 'Activity']], info: [['local', 'Only here'], ['bindings', 'Shared']], doc: [['keeps', 'What it keeps'], ['shared', 'Shared with']] }[r.kind] || [];
  const present = ids.filter(([id]) => document.getElementById(id));
  return present.length ? `<b>On this page</b>${present.map(([id, t]) => `<a href="#" data-jump="${id}">${t}</a>`).join('')}` : '';
}

// ---- render ----
function render() {
  const r = route(); const l = L(r.layer).layer;
  document.querySelectorAll('#layerBtns button').forEach(b => b.setAttribute('aria-current', String(b.dataset.layer === r.layer)));
  const app = document.getElementById('app');
  app.style.setProperty('--lc', l.colour); app.style.setProperty('--lb', l.bg);
  const tabs = l.tabs.map(([k, t]) => `<a href="#${r.layer}/tab/${k}" ${r.kind === 'tab' && r.key === k ? 'aria-current="page"' : ''}>${esc(t)}${r.layer === 'pages' && k === 'kit' ? '<span class="new">new</span>' : ''}</a>`).join('');
  const inKn = r.kind !== 'tab';
  let body;
  if (!inKn) body = tabPage(r);
  else {
    const pane = { doc: docPage, info: infoPage, node: nodePage, binding: bindingPage, propose: proposePage, edit: editPage }[r.kind] || docPage;
    body = `<div class="kn ${state.menu ? 'open' : ''}"><button class="btn sm mtoggle" type="button" data-act="menu" aria-expanded="${state.menu}"><span class="ms xs">menu</span>${esc(l.name)} knowledge</button><aside class="side" aria-label="${esc(l.name)} knowledge">${sidebar(r)}</aside><main class="read" id="read">${pane(r)}</main><nav class="outline" id="outline" aria-label="On this page"></nav></div>`;
  }
  app.innerHTML = `<nav class="rail" aria-label="Layers">${Object.entries(DATA.layers).map(([k, x]) => `<a href="#${k}/doc/overview" title="${esc(x.layer.name)}" aria-label="${esc(x.layer.name)}" ${k === r.layer ? 'aria-current="page"' : ''} style="--lc:${x.layer.colour};--lb:${x.layer.bg}"><span class="ms">${x.layer.icon}</span></a>`).join('')}</nav>
    <div class="main"><div class="lhead"><span class="lic"><span class="ms">${l.icon}</span></span><h1>${esc(l.name)}</h1>${l.custom ? '<span class="chip">Markdown layer</span>' : ''}</div>
    <nav class="lbar" aria-label="${esc(l.name)}">${tabs}<span class="sp"></span><a href="#${r.layer}/tab/tasks">Tasks</a><a href="#${r.layer}/doc/overview" ${inKn ? 'aria-current="page"' : ''}>Knowledge</a><a href="#${r.layer}/tab/manage">Manage</a></nav>${body}</div>`;
  const o = document.getElementById('outline'); if (o) o.innerHTML = outline(r);
  const ed = document.getElementById('ed'); if (ed) ed.addEventListener('input', () => { document.getElementById('pv').innerHTML = md(ed.value, r.layer); });
  const wl = document.getElementById('withLayer'); if (wl) wl.addEventListener('change', () => { state.draft.focus = wl.value; render(); });
  document.querySelectorAll('input[data-role]').forEach(i => i.addEventListener('change', () => { state.draft.roles = { ...(state.draft.roles || {}), [i.dataset.role]: i.value }; keepFields(); render(); }));
  document.querySelectorAll('input[name=lead]').forEach(i => i.addEventListener('change', () => { state.draft.leads = i.value; keepFields(); render(); }));
}
function keepFields() { const n = document.getElementById('bname'), s = document.getElementById('bstate'); if (n && state.draft) { state.draft.name = n.value; state.draft.statement = s.value; } }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-toggle],[data-act],[data-jump]'); if (!t) return;
  const r = route();
  if (t.dataset.toggle) { e.preventDefault(); const k = t.dataset.toggle; const depth0 = !k.includes(':g:') && L(r.layer).information.some(n => `${r.layer}:${n.key}` === k); state.open[k] = !(state.open[k] ?? (k.includes(':g:') || depth0)); render(); return; }
  if (t.dataset.jump) { e.preventDefault(); document.getElementById(t.dataset.jump)?.scrollIntoView({ behavior: 'smooth' }); return; }
  const act = t.dataset.act;
  if (act === 'menu') { state.menu = !state.menu; render(); }
  if (act === 'select') { state.select = true; state.selectLayer = r.layer; state.picked = new Set(); state.menu = true; render(); }
  if (act === 'select-node') { state.select = true; state.selectLayer = r.layer; state.picked = new Set([t.dataset.node]); state.menu = true; render(); toast('Selected. Tick more if you like, then choose Propose a binding.'); }
  if (act === 'cancel-select') { state.select = false; state.picked = new Set(); render(); }
  if (act === 'propose') startPropose(r.layer);
  if (act === 'unpick') { state.draft.nodes = state.draft.nodes.filter(k => k !== t.dataset.node); keepFields(); render(); }
  if (act === 'cancel-propose') { state.draft = null; go(`#${r.layer}/info`); }
  if (act === 'submit') {
    keepFields(); const d = state.draft; const { renegotiate } = draftEffects(d);
    const id = 'b' + Date.now().toString(36);
    const participants = [[d.from, d.nodes], ...Object.entries(d.with)].filter(([, ns]) => ns.length).map(([lk, ns]) => ({ layer: lk, nodes: ns, role: roleOf(d, lk) }));
    const effects = draftEffects(d).out;
    state.project.bindings.push({ id, name: d.name || 'Untitled binding', status: 'proposed', since: 'just now', origin: 'Proposed by you from ' + L(d.from).layer.name + "'s Knowledge", statement: d.statement || '(No description yet.)', participants, effects, renegotiates: [...renegotiate].map(([bid, parts]) => ({ bid, parts })), activity: [['just now', 'Proposed by you']] });
    state.draft = null; state.picked = new Set(); go(`#${d.from}/binding/${id}`); toast('Proposed. It waits for the owner’s decision, here or in Work.');
  }
  if (act === 'accept') {
    const b = state.project.bindings.find(x => x.id === t.dataset.b);
    for (const rn of b.renegotiates || []) { const old = state.project.bindings.find(x => x.id === rn.bid); for (const [lk, k] of rn.parts) { const p = participant(old, lk); if (!p) continue; p.nodes = without(lk, p.nodes, k);
      old.pairs = (old.pairs || []).filter(pr => !pr.some(x => { const [a, b] = x.split(':'); return a === lk && (descendants(findNode(lk, k).node).includes(b)); })); }
      old.participants = old.participants.filter(p => p.nodes.length);
      old.activity.unshift(['just now', `Renegotiated by ${b.name}`]); }
    b.status = 'live'; b.since = 'today'; b.activity.unshift(['just now', 'Accepted by the owner']); render(); toast('Accepted. Work was raised for each layer that has something to do.');
  }
  if (act === 'dismiss') { state.project.bindings = state.project.bindings.filter(x => x.id !== t.dataset.b); go(`#${r.layer}/info`); toast('Dismissed.'); }
  if (act === 'save-edit') { const [what, key] = t.dataset.what.split(':'); const v = document.getElementById('ed').value; if (what !== 'spec') state.edits[`${r.layer}:${what}:${key}`] = v; go(what === 'doc' ? `#${r.layer}/doc/${key}` : what === 'node' ? `#${r.layer}/node/${key}` : `#${r.layer}/info`); toast('Saved to a branch. Merge it when you are happy.'); }
  if (act === 'merge') { const [lk, what, key] = t.dataset.what.split(':'); const v = state.edits[t.dataset.what]; delete state.edits[t.dataset.what];
    if (what === 'doc') L(lk).docs.find(x => x.key === key).body = v; else { findNode(lk, key).node.body = v; }
    render(); toast(what === 'node' ? 'Merged. Created W-32 “Compare specs: ' + L(lk).layer.name + '’s ' + findNode(lk, key).node.title + ' changed”, for a person or an agent.' : 'Merged into the layer repository.'); }
  if (act === 'discard') { delete state.edits[t.dataset.what]; render(); }
  if (act === 'todo') toast('Not in this prototype round.');
});
document.addEventListener('change', e => {
  const p = e.target.closest('[data-pick]'); if (p) { const k = p.dataset.pick; p.checked ? state.picked.add(k) : state.picked.delete(k);
    // A ticked parent brings its children; drop children that are now implied.
    const [lk, nk] = k.split(':'); if (p.checked) for (const d of descendants(findNode(lk, nk).node).slice(1)) state.picked.delete(`${lk}:${d}`); render(); return; }
  const w = e.target.closest('[data-with]'); if (w) { const [lk, nk] = w.dataset.with.split(':'); const cur = new Set(state.draft.with[lk] || []); w.checked ? cur.add(nk) : cur.delete(nk); state.draft.with[lk] = [...cur]; keepFields(); render(); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-toggle][role=button]')) { e.preventDefault(); e.target.click(); } });
document.getElementById('layerBtns').innerHTML = Object.entries(DATA.layers).map(([k, x]) => `<button type="button" data-layer="${k}">${esc(x.layer.name)}</button>`).join(' ');
document.getElementById('layerBtns').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(`#${b.dataset.layer}/doc/overview`); });
document.getElementById('theme').addEventListener('click', () => { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark'; });
document.getElementById('reset').addEventListener('click', () => { location.reload(); });
window.addEventListener('hashchange', () => { state.menu = false; render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
