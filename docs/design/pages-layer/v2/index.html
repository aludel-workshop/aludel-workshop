<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aludel Pages Layer</title>
<!-- PAGES-UX-01 prototype v2 (round-1 ledger M1-M11 in ../work-record.md; v1 ledger P1-P10). Static; illustrative Tool Share data; nothing is saved. The canvas imitates the generated app with HTML styled by the project's tokens; the build would render the spec with the real components and show the running preview in an iframe. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
:root{
  --bg:#fbfbfd;--surface:#fff;--rail:#f3f5f9;--panel:#f4f6fa;--hover:#e9edf5;--line:#dfe3ec;--line-strong:#c8cfdc;--ink:#1b1f2a;--muted:#5d6679;--faint:#8a93a6;
  --accent:#3047b9;--accent-bg:#e3e8ff;
  --lc:#2a7230;--lb:#e2f4e3;--hl:#e39b00;--sel:#2a7230;
  --ok:#146446;--ok-bg:#d9f3e7;--bad:#a1231f;--bad-bg:#fce1e0;--warn:#8a5a00;--warn-bg:#fff0cc;--info:#1a5fb4;--info-bg:#e2ecfb;--work:#5b3cc4;--work-bg:#ece7fd;--plat:#1a5fb4;--plat-bg:#e2ecfb;
  --shadow:0 18px 50px #1c2a5a2e;
  /* Tool Share's tokens (from its Design layer) */
  --t-primary:#2e6b4f;--t-on-primary:#fff;--t-primary-c:#c9ecd7;--t-on-primary-c:#0c3a25;--t-surface:#f8faf6;--t-c-low:#f1f5f0;--t-c:#ebf0ea;--t-c-high:#e4ebe4;--t-on:#191c1a;--t-muted:#56605a;--t-outline:#c2cbc4;--t-error:#ba1a1a;--t-error-c:#ffdad6;--t-tertiary-c:#ffe0b2;--t-r:16px;--t-font:'DM Sans',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Roboto,system-ui,sans-serif;font-size:14.5px;line-height:1.45;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.icon{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;display:inline-block;vertical-align:middle;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;flex:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono,code{font-family:"Roboto Mono",ui-monospace,monospace;font-size:.88em}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}.push{margin-left:auto}.wrap{flex-wrap:wrap}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Shell: matches the built portal */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;padding:2px 8px 12px}
.brand .icon{color:var(--accent);font-size:26px}
.proj{display:flex;align-items:center;gap:9px;padding:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.proj .mk{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#2e7d5b;color:#fff;font-weight:700;font-size:12px}
.proj small{display:block;color:var(--muted);font-size:11.5px}
.nav a{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 6px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:color-mix(in srgb,var(--nb) 70%,transparent)}
.nav a.active{background:var(--nb);font-weight:700}
.tile{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--nb);color:var(--nc)}
.tile .icon{font-size:19px}
.nav a.active .tile{background:var(--nc);color:#fff}
.rail .sp{flex:1}
.n-home{--nc:#c62828;--nb:#fde8e8}.n-vision{--nc:#b93c0a;--nb:#ffeddc}.n-design{--nc:#8a6100;--nb:#fff3cc}.n-pages{--nc:#2a7230;--nb:#e2f4e3}.n-data{--nc:#00766c;--nb:#d6f3ee}.n-platform{--nc:#1a5fb4;--nb:#e2ecfb}.n-work{--nc:#5b3cc4;--nb:#ece7fd}.n-library{--nc:#9c27b0;--nb:#f5e2f8}.n-settings{--nc:#5f6368;--nb:#eceff3}
.top{display:flex;align-items:center;gap:14px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.search{position:relative;flex:1;max-width:480px}.search input{width:100%;padding:8px 14px 8px 38px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search .icon{position:absolute;left:11px;top:8px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--hover)}.btn .icon{font-size:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#2539a0}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:3px 9px;font-size:12.5px}.btn.sm .icon{font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.main{padding:14px 24px 12px;min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--lc);font-weight:700;margin:0 0 2px}
.eyebrow .icon{font-size:16px}
h1{font-size:24px;line-height:1.2;margin:0 0 8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
.tabs button{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border:0;background:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button .icon{font-size:18px;color:var(--lc)}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--lc)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:18px;background:var(--panel);color:var(--muted)}
.chip .icon{font-size:14px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.pages{background:var(--lb);color:var(--lc)}.chip.work{background:var(--work-bg);color:var(--work)}.chip.plat{background:var(--plat-bg);color:var(--plat)}.chip.design{background:#fff3cc;color:#8a6100}.chip.data{background:#d6f3ee;color:#00766c}.chip.lib{background:#f5e2f8;color:#9c27b0}
.chip.dash{background:none;box-shadow:inset 0 0 0 1px var(--line-strong)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px;color:var(--muted);white-space:nowrap}
.seg button .icon{font-size:16px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.sel-in{padding:4px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12.5px}
.lbl-in{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}

/* ---------- Map: planning canvas ---------- */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;height:calc(100vh - 196px);min-height:560px}
.vp{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background-color:#f2f4f8;background-image:radial-gradient(#cdd3df 1.2px,transparent 1.3px);touch-action:none;user-select:none;-webkit-user-select:none}
.vp.hand,.vp.hand .node{cursor:grab}.vp.panning,.vp.panning .node{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.world svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.lkp{fill:none;stroke:#98a3bd;stroke-width:1.8}
.lkp.on{stroke:var(--lc);stroke-width:3}.lkp.dim{opacity:.18}.lkp.sel{stroke:var(--accent);stroke-width:3}
.lkp.missing{stroke:var(--hl);stroke-dasharray:7 6;stroke-width:2.4}
.lkp.temp{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:5 5}
.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
#labels{position:absolute;left:0;top:0}
.llabel{position:absolute;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--muted);white-space:nowrap;z-index:5;cursor:pointer}
.llabel.on{border-color:var(--lc);color:var(--lc);font-weight:700}.llabel.dim{opacity:.25}.llabel.sel{border-color:var(--accent);color:var(--accent);font-weight:700}
.llabel.missing{border-color:var(--hl);color:var(--warn);background:#fffaf0;cursor:default}
.llabel input{border:0;outline:0;font:inherit;width:150px;background:none;color:var(--ink)}
.node{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px #0000000f;padding:8px;display:flex;flex-direction:column;gap:6px;z-index:3;cursor:default}
.node:hover{box-shadow:0 0 0 2px #e39b0080,0 6px 16px #00000012}
.node.sel{box-shadow:0 0 0 2.5px var(--accent),0 6px 16px #00000014}
.node.inflow{box-shadow:0 0 0 2.5px var(--lc)}
.node.inflow.sel{box-shadow:0 0 0 2.5px var(--accent)}
.node.dim{opacity:.55}
.node.dragging{z-index:10;box-shadow:0 0 0 2.5px var(--accent),0 16px 36px #00000030;opacity:.92}
.node.target{box-shadow:0 0 0 3px var(--accent),0 0 0 8px #3047b926}
.node.planned{background:#fbfcfe;border:1.5px dashed #aab4c8}
.nhead{display:flex;align-items:center;gap:6px;height:24px;font-weight:700;font-size:14px;min-width:0}
.nhead .icon{font-size:18px;color:var(--lc)}
.node.planned .nhead .icon{color:var(--faint)}
.nhead .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nhead .ob{margin-left:auto;border:0;background:none;border-radius:8px;padding:2px 4px;color:var(--muted);display:inline-flex}
.nhead .ob:hover{background:var(--hover);color:var(--ink)}
.nhead .ob .icon{color:inherit}
.ntitle{flex:1;min-width:0;border:1px solid transparent;border-radius:6px;padding:1px 5px;font:700 14px Roboto,sans-serif;background:none}
.ntitle:hover,.ntitle:focus{border-color:var(--line);background:var(--surface);outline:0}
.nbody{flex:1;min-height:0;display:flex;gap:8px}
.nbody.blank{flex-direction:column;gap:6px}
.nnote{flex:1;resize:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--surface);color:var(--ink)}
.nstories{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.nstories select{font-size:11.5px;padding:1px 4px;border:1px dashed var(--line-strong);border-radius:999px;background:none;color:var(--muted)}
.nth{position:relative;overflow:hidden;border-radius:8px;background:var(--t-surface);box-shadow:inset 0 0 0 1px var(--line);flex:none}
.nth .tapp{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.nfoot{display:flex;gap:4px;overflow:hidden;height:20px;flex:none}
.handle{position:absolute;right:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--surface);border:2.5px solid var(--lc);cursor:crosshair;opacity:0;transition:opacity .12s;z-index:6}
.node:hover .handle,.node.sel .handle,.vp.connecting .handle{opacity:1}
.handle:hover{background:var(--lc)}
.nstep{position:absolute;top:-12px;left:10px;display:flex;gap:3px;z-index:6}
.nstep b{background:var(--lc);color:#fff;border-radius:999px;font-size:11.5px;padding:0 8px;line-height:21px}
.addstep{position:absolute;top:-13px;right:12px;z-index:6;display:inline-flex;align-items:center;gap:2px;border:1px solid var(--lc);background:var(--surface);color:var(--lc);border-radius:999px;font-size:11.5px;font-weight:700;padding:1px 9px 1px 5px}
.addstep .icon{font-size:15px}
.addstep:hover{background:var(--lc);color:#fff}
.ghostcell{position:absolute;border:2px dashed var(--accent);border-radius:14px;background:#3047b90f;pointer-events:none;z-index:1}
.ghostcell.bad{border-color:var(--bad);background:#a1231f14}
.marquee{position:absolute;border:1px solid var(--accent);background:#3047b914;pointer-events:none;z-index:20}
.ctools{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:6px;z-index:30;flex-wrap:wrap;pointer-events:none}
.ctools>*{pointer-events:auto}
.tgroup{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;box-shadow:0 2px 8px #0000000f}
.tgroup button{border:0;background:none;border-radius:8px;padding:5px 8px;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink)}
.tgroup button:hover{background:var(--hover)}
.tgroup button[aria-pressed=true]{background:var(--ink);color:#fff}
.tgroup button .icon{font-size:18px}
.tgroup .z{min-width:44px;text-align:center;font-size:12px;color:var(--muted)}
.chint{position:absolute;left:12px;bottom:10px;z-index:30;font-size:11.5px;color:var(--muted);background:#ffffffd9;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.fbanner{position:absolute;left:50%;top:58px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;background:var(--lc);color:#fff;border-radius:999px;padding:5px 6px 5px 14px;font-size:12.5px;box-shadow:0 4px 14px #0002;white-space:nowrap}
.fbanner button{background:#ffffff2b;border:0;color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.flows{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.flows h2{font-size:16px;margin:0}
.frow{border:1px solid var(--line);border-radius:12px;background:var(--surface);flex:none}
.frow.on{border-color:var(--lc);box-shadow:inset 3px 0 0 var(--lc)}
.fhd{display:grid;gap:5px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:12px}
.fhd:hover{background:#f6f8fb}
.frow.on .fhd{background:#f5fbf5}
.fhd b{font-size:13.5px}
.fhd small{font-size:11.5px}
.sbar{display:flex;gap:3px;height:8px}
.sbar i{flex:1;border-radius:3px;min-width:6px}
.st-built{background:#3047b9}.st-drift{background:#3047b9;box-shadow:inset 0 -3px 0 #e39b00}.st-specified{background:#e07aa2}.st-planned{background:#c1c8d8}.st-gap{background:repeating-linear-gradient(135deg,#e39b00 0 3px,#fff0cc 3px 6px)}.st-none{background:#eef0f5}
.lg{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.lg span{display:inline-flex;align-items:center;gap:4px}.lg i{width:14px;height:8px;border-radius:3px;display:inline-block}
.fedit{display:grid;gap:8px;padding:4px 10px 10px}
.fsteplist{list-style:none;margin:0;padding:0}
.fs{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:13px;padding:3px 0}
.fs .n{width:20px;height:20px;border-radius:50%;background:var(--lc);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.fs .warn{color:var(--warn)}
.fs .ctl{display:flex}
.fs .ctl button{border:0;background:none;padding:2px;border-radius:6px;color:var(--muted);display:inline-flex}
.fs .ctl button:hover{background:var(--hover);color:var(--ink)}
.fs .ctl button:disabled{opacity:.3}
.fs .ctl .icon{font-size:17px}
.fconn{font-size:11.5px;color:var(--muted);padding:0 0 0 2px;display:flex;align-items:center;gap:6px}
.fconn .icon{font-size:15px;color:var(--lc)}
.fconn.miss{color:var(--warn)}.fconn.miss .icon{color:var(--warn)}
.missing{border:1px dashed var(--warn);border-radius:10px;padding:7px 9px;display:grid;gap:6px;font-size:12.5px;background:#fffaf0}
.missing>b{display:flex;align-items:center;gap:4px;color:var(--warn);font-size:12px}
.missing .icon{font-size:16px}

/* ---------- Page workspace ---------- */
.ws{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;border:1px solid var(--line);border-radius:16px;background:var(--surface);height:calc(100vh - 196px);min-height:600px;overflow:hidden}
.pane{min-height:0;overflow:auto}
.left{border-right:1px solid var(--line);display:flex;flex-direction:column}
.phead{padding:10px 12px 6px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--faint);display:flex;align-items:center;gap:6px}
.plist{padding:0 4px 6px}
.pitem{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:5px 8px;border-radius:9px;text-align:left;font-size:13.5px}
.pitem:hover{background:var(--hover)}
.pitem.on{background:var(--lb);font-weight:700;box-shadow:inset 3px 0 0 var(--lc)}
.pitem .icon{font-size:18px;color:var(--lc)}
.pitem .st{margin-left:auto}
.pitem.child{padding-left:26px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.d-planned{background:#c1c8d8}.d-specified{background:#e07aa2}.d-built{background:#3047b9}.d-drift{background:var(--hl)}
.outline{border-top:1px solid var(--line);padding:0 4px 20px;flex:1}
.oitem{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;padding:4px 8px;border-radius:8px;text-align:left;font-size:13px;min-height:28px}
.oitem:hover,.oitem.hov{background:#fff7de}
.oitem.on{background:var(--lb);box-shadow:inset 3px 0 0 var(--lc);font-weight:600}
.oitem .icon{font-size:16px;color:var(--muted)}
.oitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oitem.l2{padding-left:24px}
.oitem.ghost .nm{color:var(--faint);font-style:italic}
.oitem .tag{font-size:10.5px;font-weight:700;border-radius:6px;padding:0 5px;white-space:nowrap}
.tag.nb{background:var(--panel);color:var(--muted)}.tag.df{background:var(--warn-bg);color:var(--warn)}.tag.wk{background:var(--work-bg);color:var(--work)}.tag.ph{background:#eef0f5;color:var(--faint)}

.center{display:flex;flex-direction:column;background:#eef0f4;min-width:0}
.cbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.cbar .sep{width:1px;height:20px;background:var(--line)}
.editsw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;background:var(--surface);font-size:12.5px;font-weight:500}
.editsw i{width:30px;height:18px;border-radius:9px;background:#c8cfdc;position:relative;transition:background .15s}
.editsw i::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.editsw[aria-pressed=true] i{background:var(--ink)}.editsw[aria-pressed=true] i::after{left:14px}
.stage{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center;position:relative;min-height:0}
.frame{width:100%;max-width:980px;height:max-content;min-height:100%;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px #0002,0 0 0 1px #0000000d;background:var(--t-surface)}
.frame.phone{max-width:390px;border-radius:30px;box-shadow:0 0 0 8px #1b1f2a,0 16px 40px #0003;min-height:720px}
.urlbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#e7e9ee;font-size:11.5px;color:var(--muted);border-bottom:1px solid #d7dbe3}
.urlbar .u{flex:1;background:#fff;border-radius:999px;padding:2px 10px;font-family:"Roboto Mono",monospace;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame.phone .urlbar{display:none}
.specbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:repeating-linear-gradient(135deg,#f3f7f2 0 10px,#edf3ec 10px 20px);font-size:11.5px;color:var(--lc);font-weight:700;border-bottom:1px solid #d7e5d6}
.frame.phone .specbar{padding-top:14px}
.cfoot{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--line);background:var(--surface);font-size:12.5px;flex-wrap:wrap}
.driftnote{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-weight:500}
.driftnote .icon{font-size:17px}

/* Hover/selection overlays */
.ov{position:absolute;pointer-events:none;border:2px solid var(--hl);border-radius:6px;z-index:30;transition:all .06s}
.ov.sel{border-color:var(--sel);border-width:2.5px}
.ov.ct{border-style:solid;border-color:#3b82f6}
.ov.dt{border-style:dashed;border-color:#00766c}
.ov .tg{position:absolute;left:-2px;top:-19px;background:var(--hl);color:#241800;font:700 10.5px/17px Roboto,sans-serif;padding:0 6px;border-radius:5px 5px 5px 0;white-space:nowrap;display:flex;gap:4px;align-items:center}
.ov .tg .icon{font-size:13px}
.ov.sel .tg{background:var(--sel);color:#fff}
.ov.ct .tg{background:#3b82f6;color:#fff}
.ov.dt .tg{background:#00766c;color:#fff}
.ov.below .tg{top:auto;bottom:-19px;border-radius:0 5px 5px 5px}

/* Right pane: inspector */
.right{border-left:1px solid var(--line);padding:12px 14px 30px;display:grid;gap:12px;align-content:start}
.right h2{font-size:17px;margin:0;line-height:1.25}
.right h3{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);margin:6px 0 -4px;display:flex;align-items:center;gap:6px}
.right h3 .btn{margin-left:auto;text-transform:none;letter-spacing:0}
.kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.lk{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-size:12px;background:var(--surface);cursor:pointer;color:var(--ink);text-decoration:none}
.lk:hover{border-color:var(--lc)}
.lk .icon{font-size:14px}
.lk.design .icon{color:#8a6100}.lk.data .icon{color:#00766c}.lk.product .icon{color:#b93c0a}.lk.page .icon{color:var(--lc)}.lk.work .icon{color:var(--work)}.lk.plat .icon{color:var(--plat)}.lk.lib .icon{color:#9c27b0}
.story{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:start;font-size:13px;padding:4px 0}
.story b{font-family:"Roboto Mono",monospace;font-size:11.5px;color:#b93c0a;padding-top:1px}
.sm-st{font-size:10.5px;font-weight:700;border-radius:6px;padding:0 5px;white-space:nowrap}
.s-proposed{background:#eef0f5;color:#6b7385}.s-defined{background:#e6e9f7;color:#4a56a0}.s-designed{background:#fbe3ec;color:#a3325e}.s-built{background:#e3e8ff;color:#3047b9}.s-shipped{background:var(--ok-bg);color:var(--ok)}
.matrix{width:100%;border-collapse:collapse;font-size:12.5px}
.matrix th{font-weight:500;color:var(--muted);text-align:left;padding:3px 4px;font-size:11.5px}
.matrix td{padding:3px 4px;border-top:1px solid var(--line)}
.matrix tr.cur td{background:var(--lb)}
.matrix button{border:0;background:none;padding:0;text-align:left;font-weight:500;color:var(--ink)}
.matrix .icon{font-size:16px}
.y{color:var(--ok)}.n{color:var(--faint)}.dfc{color:var(--warn)}
.why p{margin:0 0 6px;font-size:13px}.why small{color:var(--muted)}
.actions{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.actions .row .btn{flex:1;justify-content:center}
.note{font-size:12px;color:var(--muted);line-height:1.4}
.callout{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.4}
.callout .icon{font-size:18px}
.callout.warn{background:var(--warn-bg);color:#5c3d00}.callout.info{background:var(--info-bg);color:#0f3f7a}.callout.pages{background:var(--lb);color:#174a1b}.callout.work{background:var(--work-bg);color:#3b2388}
.field{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.field input,.field textarea,.field select{padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:13.5px;width:100%}
.field textarea{resize:vertical}
.imgpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.imgpick button{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px;display:grid;gap:3px;font-size:11px;color:var(--muted)}
.imgpick button.cur{border-color:#3b82f6;box-shadow:0 0 0 2px #3b82f633}
.imgpick .art{height:48px;border-radius:7px}

/* ---------- Tool Share app (imitates the generated Angular Material app) ---------- */
.app{font-family:Roboto,sans-serif;color:var(--t-on);background:var(--t-surface);min-height:100%;display:flex;flex-direction:column;font-size:14px;position:relative}
.frame .app{flex:1}
.a-bar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--t-surface);border-bottom:1px solid var(--t-c-high)}
.a-bar .logo{display:flex;align-items:center;gap:8px;font:700 18px/1 var(--t-font);color:var(--t-primary)}
.a-bar .logo .mk{width:28px;height:28px;border-radius:8px;background:var(--t-primary);color:#fff;display:grid;place-items:center;font-size:12px}
.a-bar .navd{display:flex;gap:4px;margin-left:24px}
.a-bar .navd span{padding:6px 14px;border-radius:999px;font-weight:500;color:var(--t-muted);display:flex;align-items:center;gap:6px}
.a-bar .navd span.on{background:var(--t-primary-c);color:var(--t-on-primary-c)}
.a-bar .av{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--t-tertiary-c);display:grid;place-items:center;font-weight:700;color:#6b4000;font-size:13px}
.a-body{padding:22px 26px 30px;flex:1;display:grid;gap:16px;align-content:start}
.a-h{font:600 26px/1.2 var(--t-font);margin:0}
.a-sub{color:var(--t-muted);margin:0}
.a-nb{display:none;border-top:1px solid var(--t-c-high);background:var(--t-c-low);padding:8px 0 14px;justify-content:space-around;margin-top:auto}
.a-nb span{display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--t-muted)}
.a-nb span .icon{padding:3px 18px;border-radius:999px;font-size:22px}
.a-nb span.on .icon{background:var(--t-primary-c);color:var(--t-on-primary-c);font-variation-settings:'FILL' 1}
.phone .a-bar .navd{display:none}.phone .a-nb{display:flex}.phone .a-body{padding:16px 16px 20px}.phone .a-h{font-size:22px}
.thumb .a-bar .navd{display:none}.thumb .a-nb{display:flex}.thumb .a-body{padding:16px}
.a-search{display:flex;align-items:center;gap:10px;background:var(--t-c-high);border-radius:999px;padding:11px 16px;color:var(--t-muted)}
.a-chips{display:flex;gap:8px;flex-wrap:wrap}
.a-chip{border:1px solid var(--t-outline);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--t-muted);display:flex;gap:4px;align-items:center}
.a-chip.on{background:var(--t-primary-c);border-color:transparent;color:var(--t-on-primary-c)}
.a-chip .icon{font-size:16px}
.a-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.phone .a-grid,.thumb .a-grid{grid-template-columns:minmax(0,1fr);gap:10px}
.a-card{background:var(--t-c-low);border-radius:var(--t-r);overflow:hidden;box-shadow:0 1px 2px #0000001f}
.a-card .ph{height:120px;display:grid;place-items:center}
.a-card .ph .icon{font-size:44px;opacity:.75}
.phone .a-card,.thumb .a-card{display:grid;grid-template-columns:88px minmax(0,1fr)}
.phone .a-card .ph,.thumb .a-card .ph{height:auto;min-height:84px}
.a-card .bd{padding:10px 14px 12px;display:grid;gap:2px}
.a-card .t{font:600 15px/1.25 var(--t-font)}
.a-card .m{font-size:12.5px;color:var(--t-muted);display:flex;gap:6px;align-items:center}
.a-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:10px 22px;font-weight:500;background:var(--t-primary);color:var(--t-on-primary);border:0;font-size:14px;width:max-content}
.a-btn.tonal{background:var(--t-primary-c);color:var(--t-on-primary-c)}
.a-btn.out{background:none;border:1px solid var(--t-outline);color:var(--t-primary)}
.a-btn.text{background:none;color:var(--t-primary);padding:10px 12px}
.a-btn.full{width:100%}
.a-fab{position:absolute;right:22px;bottom:22px;display:flex;align-items:center;gap:8px;background:var(--t-primary-c);color:var(--t-on-primary-c);border-radius:16px;padding:16px 20px;font-weight:500;box-shadow:0 3px 8px #0003}
.phone .a-fab,.thumb .a-fab{bottom:92px;right:16px}
.a-field{border:1px solid var(--t-outline);border-radius:6px;padding:10px 14px 8px;display:grid;gap:1px}
.a-field small{font-size:11.5px;color:var(--t-primary)}
.a-field span{color:var(--t-muted)}
.a-empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:24px 10px}
.a-art{width:170px;height:120px;border-radius:20px;display:grid;place-items:center;position:relative;overflow:hidden}
.a-art .icon{font-size:56px;color:#ffffffe6;font-variation-settings:'FILL' 1}
.art-shed{background:linear-gradient(135deg,#5e9c7a,#2e6b4f)}.art-street{background:linear-gradient(135deg,#f0b35a,#c46b2c)}.art-hands{background:linear-gradient(135deg,#7aa3d6,#3d5f9a)}.art-none{background:var(--t-c-high)}.art-none .icon{color:var(--t-muted)}
.a-skel{border-radius:var(--t-r);background:linear-gradient(90deg,var(--t-c) 0%,var(--t-c-high) 50%,var(--t-c) 100%);height:84px}
.a-banner{display:flex;gap:10px;align-items:center;background:var(--t-error-c);color:#410002;border-radius:12px;padding:12px 14px}
.a-2col{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
.phone .a-2col,.thumb .a-2col{grid-template-columns:minmax(0,1fr);gap:14px}
.a-gal{height:240px;border-radius:var(--t-r);display:grid;place-items:center;background:linear-gradient(135deg,#7c8f84,#4b5d52)}
.a-gal .icon{font-size:80px;color:#ffffffd0}
.phone .a-gal,.thumb .a-gal{height:190px}
.a-panel{background:var(--t-c-low);border-radius:var(--t-r);padding:14px 16px;display:grid;gap:10px}
.a-panel h4{margin:0;font:600 16px/1.2 var(--t-font)}
.a-row{display:flex;align-items:center;gap:10px}
.a-lender{display:flex;align-items:center;gap:10px}
.a-lender i{width:36px;height:36px;border-radius:50%;background:var(--t-tertiary-c);display:grid;place-items:center;font-style:normal;font-weight:700;color:#6b4000}
.a-list{display:grid;border-radius:var(--t-r);overflow:hidden;background:var(--t-c-low)}
.a-li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--t-c-high)}
.a-li:last-child{border-bottom:0}
.a-li i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;flex:none}
.a-li .tx{flex:1;min-width:0}.a-li .tx b{display:block;font-weight:500}.a-li .tx span{font-size:12.5px;color:var(--t-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.a-badge{background:var(--t-primary);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.a-bub{max-width:75%;padding:9px 13px;border-radius:18px;background:var(--t-c-high);font-size:14px}
.a-bub.me{margin-left:auto;background:var(--t-primary);color:#fff}
.a-compose{display:flex;gap:8px;align-items:center;border-top:1px solid var(--t-c-high);padding-top:12px}
.a-compose .a-search{flex:1;border-radius:24px}
.a-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.a-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:520px}
.a-hero .a-art{width:100%;height:100%;border-radius:0;min-height:220px}
.a-hero .a-art .icon{font-size:110px}
.a-hero .fm{padding:44px 40px;display:grid;gap:14px;align-content:center}
.phone .a-hero,.thumb .a-hero{grid-template-columns:minmax(0,1fr);min-height:0}
.phone .a-hero .a-art,.thumb .a-hero .a-art{min-height:200px}
.phone .a-hero .fm,.thumb .a-hero .fm{padding:20px 18px}
.a-drop{border:1.5px dashed var(--t-outline);border-radius:var(--t-r);display:grid;justify-items:center;gap:6px;padding:26px;color:var(--t-muted)}
.a-drop .icon{font-size:34px;color:var(--t-primary)}
.a-skeleton-note{border:1.5px dashed var(--t-outline);border-radius:var(--t-r);padding:18px;color:var(--t-muted);display:grid;gap:10px}
.a-skeleton-note i{display:block;height:12px;border-radius:6px;background:var(--t-c-high)}

/* Spec mode: section frames and not-built sections */
.specmode .sec{outline:1px dashed #9cc3a0;outline-offset:3px;border-radius:4px}
.sec.ghost{opacity:.55}
.sec.differs{outline:2px dashed var(--hl);outline-offset:4px;border-radius:6px;position:relative}
.sec.differs::before{content:"Differs from spec";position:absolute;right:0;top:-12px;background:var(--hl);color:#241800;font:700 10.5px/17px Roboto,sans-serif;padding:0 7px;border-radius:5px;z-index:2}
.sec.req{outline:1.5px dashed var(--work)!important;outline-offset:3px;border-radius:6px;padding:14px;background:repeating-linear-gradient(135deg,#f5f2ff 0 10px,#efe9ff 10px 20px);color:#3b2388;display:grid;gap:4px}
.sec .phase{display:inline-block;font:700 10px/16px Roboto,sans-serif;background:#eef0f5;color:#6b7385;border-radius:5px;padding:0 6px;margin-bottom:6px}
.ct{border-radius:3px}
.editing .ct{box-shadow:inset 0 -1.5px 0 #3b82f6aa;cursor:text}
.editing .ct.img{box-shadow:0 0 0 2px #3b82f6aa;cursor:pointer}
.ct[contenteditable=true]{outline:2px solid #3b82f6;outline-offset:2px;background:#3b82f614}
.dt{cursor:help}
.unspec{display:grid;justify-items:center;text-align:center;gap:10px;padding:50px 20px;color:var(--muted);border:2px dashed var(--line-strong);border-radius:16px;margin:24px;background:var(--surface)}
.unspec .icon{font-size:36px;color:var(--faint)}
.notbuilt{display:grid;justify-items:center;text-align:center;gap:10px;padding:60px 24px;color:var(--muted)}
.notbuilt .icon{font-size:40px;color:var(--faint)}
.redirect{display:grid;justify-items:center;text-align:center;gap:8px;padding:60px 24px;color:var(--muted)}

/* ---------- Flows ---------- */
.fl2{display:grid;grid-template-columns:280px minmax(0,1fr) 320px;gap:14px;height:calc(100vh - 196px);min-height:600px}
.fsteps{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.fsteps select{width:100%;font-size:14px;font-weight:700;padding:7px 9px}
.fsl{display:grid;gap:0}
.fsi{display:grid;grid-template-columns:22px 50px minmax(0,1fr);gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 6px;background:var(--surface);text-align:left;width:100%;position:relative}
.fsi:hover{border-color:var(--line-strong)}
.fsi.on{border-color:var(--lc);box-shadow:inset 3px 0 0 var(--lc);background:#f5fbf5}
.fsi.gapstep{border-style:dashed;border-color:var(--warn);background:#fffaf0}
.fsi .n{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.fsi.on .n{background:var(--lc)}
.mini{width:50px;height:88px;position:relative;overflow:hidden;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);background:var(--t-surface);display:block}
.mini .tapp{position:absolute;left:0;top:0;width:390px;transform:scale(.128);transform-origin:0 0;pointer-events:none}
.mini.gapm{display:grid;place-items:center;color:var(--warn);background:repeating-linear-gradient(135deg,#fff8e8 0 6px,#fff1d4 6px 12px)}
.fsi b{font-size:13px;display:block}
.fsi small{font-size:11.5px;color:var(--muted);display:block}
.fsi .rvn{position:absolute;right:8px;top:6px}
.fsc{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--lc);padding:3px 0 3px 8px;min-height:24px}
.fsc .icon{font-size:16px}
.fprev{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#eef0f4;min-height:0;min-width:0}
.fprev .stage{align-items:flex-start}
.wside{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:10px;align-content:start;overflow:auto;min-height:0}
.wside h3{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);margin:4px 0 -4px}
.gwt{display:grid;gap:3px;font-size:13px;background:var(--panel);border-radius:10px;padding:8px 10px}
.gwt b{color:#b93c0a;font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-right:4px}
.trig{display:flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--lc);color:var(--lc);border-radius:10px;padding:6px 10px;background:var(--lb)}
.rnote{border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px;display:grid;gap:4px}
.rnote .k{display:flex;gap:6px;align-items:center}
.ntype{display:flex;gap:4px;flex-wrap:wrap}
.ntype button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted)}
.ntype button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}

/* Drawer, toast */
.scrim{position:fixed;inset:0;background:#0f172a38;z-index:79}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:80;overflow:auto;padding:18px 20px 40px;display:grid;align-content:start;gap:12px}
.drawer h2{margin:0;font-size:20px}
.drawer h3{margin:6px 0 -4px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint)}
.chg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px}
.chg .op{font-weight:700;font-size:11px;border-radius:6px;padding:1px 6px}
.op.add{background:var(--ok-bg);color:var(--ok)}.op.chgd{background:var(--info-bg);color:var(--info)}.op.rm{background:var(--bad-bg);color:var(--bad)}
.chgform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;border:1px dashed var(--line-strong);border-radius:12px;padding:10px}
.chgform .wide{grid-column:1/-1}
.route{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;border-radius:12px;padding:10px 12px;background:var(--plat-bg)}
.route .tile{--nc:#1a5fb4;--nb:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:13.5px;z-index:90;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:92vw}
.toast button{background:#ffffff26;border:0;color:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px}
.notes table{border-collapse:collapse;font-size:13px;width:100%}.notes td{border-top:1px solid var(--line);padding:6px 6px;vertical-align:top}.notes td:first-child{font-weight:700;white-space:nowrap}

/* Narrow */
@media (max-width:1180px){.ws{grid-template-columns:220px minmax(0,1fr)}.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.ws{height:auto}.center{min-height:640px}.mapwrap{grid-template-columns:minmax(0,1fr);height:auto}.vp{height:72vh}.fl2{grid-template-columns:260px minmax(0,1fr);height:auto}.fl2 .wside{grid-column:1/-1}.fprev{min-height:640px}}
@media (max-width:900px){

/* ================= The Tool Share app renderer ================= */
// o: {mode:'spec'|'built', state, as, q}. Sections carry data-sec; content carries data-ct; data carries data-dt.
function sec(p, id, inner, o, cls='') {
  const s = secById(p, id); if (!s) return inner;
  const built = s.built;
  if (o.mode === 'built' && built === false) return '';
  if (s.as && o.as && s.as !== o.as) return '';
  const ghost = o.mode === 'spec' && built === false && s.phase;
  const differs = o.mode === 'built' && built === 'differs';
  return `${reqAt(p, 'Above ' + s.name, o)}<div class="sec ${cls} ${ghost ? 'ghost' : ''} ${differs ? 'differs' : ''}" data-sec="${id}">${ghost ? `<span class="phase">${s.phase} · not built</span>` : ''}${inner}</div>${reqAt(p, 'Below ' + s.name, o)}`;
}

const CELL = {both:{w:500,h:318}, desktop:{w:420,h:338}, phone:{w:200,h:410}};
const GX = 120, GY = 90;

const LINKS = [];
PAGES.forEach(p => p.sections.forEach(s => (s.leads || []).forEach(l => { if (!LINKS.some(x => x.from === p.id && x.to === l[0])) LINKS.push({id:'L' + LINKS.length, from:p.id, to:l[0], label:l[1], origin:'spec'}); })));
let CAM = null, DRAG = null, SPACE = false, nBlank = 0, nLink = 100;
const cellSz = () => CELL[S.mview];
const cellXY = (c, r) => [c * (cellSz().w + GX), r * (cellSz().h + GY)];

function linkBetween(a, b) { return LINKS.find(l => l.from === a && l.to === b); }

/* Links, camera and pointer handling */
function drawLinks() {
  const svg = document.getElementById('links'), lab = document.getElementById('labels'); if (!svg) return;
  const f = curFlow(), pairs = [];
  if (f) { const ps = f.steps.filter(s => !s.gap).map(s => s.page); for (let i = 0; i < ps.length - 1; i++) if (ps[i] !== ps[i + 1]) pairs.push([ps[i], ps[i + 1]]); }
  const items = LINKS.slice();
  pairs.forEach(([a, b]) => { if (!linkBetween(a, b) && !items.some(x => x.from === a && x.to === b)) items.push({id:'', from:a, to:b, label:'No link yet', missing:true}); });
  const geo = items.map(l => { const A = nodeRect(l.from), B = nodeRect(l.to); const dir = B.x >= A.x + A.w ? 'r' : B.x + B.w <= A.x ? 'l' : B.y > A.y ? 'd' : 'u';
    return {l, A, B, sa:{r:'r', l:'l', d:'b', u:'t'}[dir], sb:{r:'l', l:'r', d:'t', u:'b'}[dir]}; });
  // Spread links that share a side of a page so they don't sit on top of each other.
  const ports = {};
  geo.forEach((g, i) => { (ports[g.l.from + g.sa] = ports[g.l.from + g.sa] || []).push([i, 'a', g.B]); (ports[g.l.to + g.sb] = ports[g.l.to + g.sb] || []).push([i, 'b', g.A]); });
  Object.entries(ports).forEach(([k, list]) => { const side = k.slice(-1); list.sort((p, q) => side === 'r' || side === 'l' ? p[2].y - q[2].y : p[2].x - q[2].x); list.forEach(([i, end], j) => { geo[i]['o' + end] = (j - (list.length - 1) / 2) * 30; }); });
  const pt = (R, side, o) => side === 'r' ? [R.x + R.w, R.y + R.h / 2 + o] : side === 'l' ? [R.x, R.y + R.h / 2 + o] : side === 'b' ? [R.x + R.w / 2 + o, R.y + R.h] : [R.x + R.w / 2 + o, R.y];
  const vec = {r:[1, 0], l:[-1, 0], b:[0, 1], t:[0, -1]};
  const mk = (id, c) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`;
  let out = `<defs>${mk('m', '#98a3bd')}${mk('mon', '#2a7230')}${mk('msel', '#3047b9')}${mk('mmiss', '#e39b00')}</defs>`, labels = '';
  geo.forEach(g => {
    const [x1, y1] = pt(g.A, g.sa, g.oa || 0), [x2, y2] = pt(g.B, g.sb, g.ob || 0);
    const k = Math.max(50, Math.hypot(x2 - x1, y2 - y1) / 2.6);
    const c1 = [x1 + vec[g.sa][0] * k, y1 + vec[g.sa][1] * k], c2 = [x2 + vec[g.sb][0] * k, y2 + vec[g.sb][1] * k];
    const d = `M${x1},${y1} C${c1} ${c2} ${x2},${y2}`;
    const mx = (x1 + 3 * c1[0] + 3 * c2[0] + x2) / 8, my = (y1 + 3 * c1[1] + 3 * c2[1] + y2) / 8;
    const on = f && pairs.some(p => p[0] === g.l.from && p[1] === g.l.to) && !g.l.missing;

    <div class="pane center"><div class="cbar"><span class="chip">Planned</span><span class="small muted">Added on the Map</span></div>
      <div class="stage"><div class="unspec" style="max-width:520px;height:max-content">${ic('draft')}<b>${esc(p.label)} isn’t specified yet</b><span class="small">${esc(p.note || 'No note yet.')}</span>
        <div class="row wrap" style="justify-content:center"><button class="btn primary sm" data-act="startspec">${ic('edit_document')}Start the spec</button><button class="btn sm" data-act="gapwork" data-v="<b>${esc(p.label)}</b> · write the spec" data-role="Experience designer">${ic('add_task')}Add to Work · Experience designer</button></div>
        <span class="note">A spec starts with a layout from Design, then sections chosen from the design system, each linked to its stories and data.</span></div></div></div>
    <div class="pane right"><div class="row"><span class="chip pages">${ic('web')}Page</span><span class="chip">Planned</span></div>
      <label class="field">Title<input data-title="${p.id}" value="${esc(p.label)}"></label>
      <label class="field">Note<textarea rows="4" data-note="${p.id}">${esc(p.note)}</textarea></label>
      <h3>Stories</h3><div>${storyRows(p.stories)}</div>
      <h3>In flows</h3><div class="row wrap">${flows.map(f => `<span class="chip pages">${esc(f.title)}</span>`).join('') || '<span class="note">None yet.</span>'}</div>
      <button class="btn sm" data-act="tab" data-v="map">${ic('account_tree')}Show on the Map</button></div></div>`;
}

/* ================= Hover and selection on the canvas ================= */
function overlay(id, el, cls, label, icon) {
  const stage = document.getElementById('stage'); if (!stage || !el) return;
  let ov = document.getElementById(id); if (!ov) { ov = document.createElement('div'); ov.id = id; stage.appendChild(ov); }
  const r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  ov.className = 'ov ' + cls + (r.top - sr.top < 22 ? ' below' : '');
  ov.style.left = (r.left - sr.left + stage.scrollLeft - 3) + 'px'; ov.style.top = (r.top - sr.top + stage.scrollTop - 3) + 'px';
  ov.style.width = (r.width + 6) + 'px'; ov.style.height = (r.height + 6) + 'px';
  ov.innerHTML = `<span class="tg">${ic(icon)}${label}</span>`;
}
const clearOv = id => document.getElementById(id)?.remove();
function describe(el) {
  const p = P(S.page);
  if (el.dataset.ct) return ['ct', (ARTS[C(el.dataset.ct)] ? 'Image · ' : 'Text · ') + el.dataset.ct, ARTS[C(el.dataset.ct)] ? 'image' : 'text_fields'];
  if (el.dataset.dt) return ['dt', 'Data · ' + el.dataset.dt, 'schema'];
  const id = el.dataset.sec;
  if (id === '__shell') return ['', 'App shell · shared', 'dock_to_bottom'];
  const r = (S.requested[p.id] || []).find(x => x.secId === id); if (r) return ['', r.name + ' · ' + r.w, 'add_box'];
  const s = secById(p, id); if (!s) return null;
  return ['', `${s.name} · ${s.comp}${s.stories?.length ? ' · ' + s.stories.join(' ') : ''}${s.built === 'differs' ? ' · differs' : ''}`, s.built === 'differs' ? 'difference' : 'view_agenda'];
}
function pick(target) {
  const frame = document.getElementById('frame'); if (!frame || !frame.contains(target)) return null;
  if (S.edit) { const c = target.closest('[data-ct]'); if (c) return c; }
  const d = target.closest('[data-dt]'); if (d && !S.edit && d.closest('[data-sec]') && target.closest('[data-sec]') === d.closest('[data-sec]') && d.dataset.dt && d === target.closest('[data-dt]') && S.sel?.type === 'sec' && S.sel.id === d.closest('[data-sec]').dataset.sec) return d;
  return target.closest('[data-sec]');
}
function drawSel() {
  clearOv('ov-sel');
  if (!S.sel || S.sel.type === 'page') return;
  const sel = S.sel.type === 'content' ? `[data-ct="${S.sel.id}"]` : S.sel.type === 'data' ? `[data-dt="${S.sel.id}"]` : `[data-sec="${S.sel.id}"]`;
  const el = document.querySelector('#frame ' + sel);
  if (el) { const d = describe(el); overlay('ov-sel', el, 'sel ' + (S.sel.type === 'content' ? 'ct' : S.sel.type === 'data' ? 'dt' : ''), d[1], d[2]); }
}
document.addEventListener('mouseover', e => {
  if (S.tab !== 'pages') return;
  const oi = e.target.closest('[data-hov]');
  let el = oi ? document.querySelector(`#frame [data-sec="${oi.dataset.hov}"]`) : pick(e.target);
  document.querySelectorAll('.oitem.hov').forEach(x => x.classList.remove('hov'));
  if (!el) { clearOv('ov-hov'); return; }
  const d = describe(el); if (!d) { clearOv('ov-hov'); return; }
  if (S.sel && ((S.sel.type === 'sec' && el.dataset.sec === S.sel.id) || (S.sel.type === 'content' && el.dataset.ct === S.sel.id))) { clearOv('ov-hov'); return; }
  overlay('ov-hov', el, d[0], d[1], d[2]);
  if (el.dataset.sec) document.querySelector(`.oitem[data-hov="${el.dataset.sec}"]`)?.classList.add('hov');
});

/* ================= Actions ================= */
function refreshInspector() { const i = document.getElementById('inspector'); if (i) i.innerHTML = inspector(P(S.page)); }
function stopEditing() { document.querySelectorAll('[contenteditable=true]').forEach(x => x.removeAttribute('contenteditable')); }
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  // Canvas click: select what's under the pointer (or edit content in Edit mode)
  if (!a && S.tab === 'pages') {
    const el = pick(e.target);
    if (el) {
      if (S.edit && el.dataset.ct) {
        S.sel = {type:'content', id:el.dataset.ct};
        if (!ARTS[C(el.dataset.ct)]) { stopEditing(); el.setAttribute('contenteditable', 'true'); el.focus(); el.oninput = () => { CONTENT[el.dataset.ct] = el.textContent; const t = document.querySelector(`[data-act="cttext"][data-k="${el.dataset.ct}"]`); if (t) t.value = el.textContent; }; }
      } else if (el.dataset.dt) S.sel = {type:'data', id:el.dataset.dt};
      else S.sel = {type:'sec', id:el.dataset.sec};
      refreshInspector(); clearOv('ov-hov'); drawSel(); return;
    }
  }
  if (!a || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA') return;
  const v = a.dataset.v; e.preventDefault();
  switch (a.dataset.act) {
    case 'tab': S.tab = v; render(); break;
    case 'openpage': openPage(v); break;
    case 'mode': S.mode = v; render(); break;
    case 'vp': S.vp = v; render(); break;
    case 'edit': S.edit = !S.edit; if (!S.edit) stopEditing(); render(); break;
    case 'selpage': S.sel = {type:'page'}; refreshInspector(); drawSel(); document.querySelectorAll('.oitem').forEach(x => x.classList.toggle('on', x.dataset.act === 'selpage')); break;
    case 'selsec': { S.sel = {type:'sec', id:v}; const sx = secById(P(S.page), v); if (sx?.state) S.state = sx.state; else if (sx && S.state === 'empty' && P(S.page).sections.some(q => q.state === 'empty')) S.state = 'ready'; } render(); document.querySelector(`#frame [data-sec="${v}"]`)?.scrollIntoView({block:'nearest'}); break;
    case 'selct': S.edit = true; S.sel = {type:'content', id:v}; render(); break;
    case 'setstate': S.state = v; render(); break;
    case 'setimg': CONTENT[a.dataset.k] = v; render(); toast('Image changed. It’s live in the preview; no build needed.'); break;
    case 'tool': S.tool = v; render(); break;
    case 'mview': S.mview = v; S.refit = true; render(); break;
    case 'zoom': { const vp = document.getElementById('vp'); zoomAt(+v, vp.clientWidth / 2, vp.clientHeight / 2); break; }
    case 'fit': fit(); break;
    case 'newpage': { const vp = document.getElementById('vp'); const id = addBlank(freeCellNear((vp.clientWidth / 2 - CAM.x) / CAM.z - cellSz().w / 2, (vp.clientHeight / 2 - CAM.y) / CAM.z - cellSz().h / 2)); render(); focusTitle(id); break; }
    case 'selflow': S.mapFlow = S.mapFlow === v ? '' : v; S.msel.clear(); render(); break;
    case 'doneflow': S.mapFlow = ''; render(); break;
    case 'newflow': { const id = 'flow' + FLOWS.length; FLOWS.push({id, title:'New flow', persona:'Sam', as:'sam', review:'Not started', steps:[], custom:true}); S.mapFlow = id; render(); const i = document.querySelector(`[data-flowtitle="${id}"]`); i?.focus(); i?.select(); break; }
    case 'addstep': { const f = curFlow(); f.steps.push(newStep(f, v)); render(); toast(`${P(v).label} is step ${f.steps.length} of ${f.title}.`); break; }
    case 'rmstep': curFlow().steps.splice(+v, 1); render(); break;
    case 'upstep': { const st = curFlow().steps; [st[+v - 1], st[+v]] = [st[+v], st[+v - 1]]; render(); break; }
    case 'fillgap': { const f = curFlow(), g = f.steps[+v]; const prev = f.steps.slice(0, +v).reverse().find(s => !s.gap); const near = prev ? POS[prev.page] : [0, 0]; const id = addBlank(freeCellNear(near[0] + 1, near[1])); P(id).label = g.name; P(id).note = g.why || ''; f.steps[+v] = {page:id, as:f.as, story:g.story, name:g.name}; render(); focusTitle(id); break; }
    case 'blankfor': { const f = curFlow(); const last = f.steps.filter(s => !s.gap).slice(-1)[0]; const near = last ? POS[last.page] : [0, 2]; const id = addBlank(freeCellNear(near[0] + 1, near[1]), v); f.steps.push({page:id, as:f.as, story:v, name:P(id).label}); render(); focusTitle(id); toast(`Page blank added for ${v} and made step ${f.steps.length}.`); break; }
    case 'reviewflow': S.tab = 'flows'; S.flow = v; S.step = 0; render(); break;
    case 'editonmap': S.tab = 'map'; S.mapFlow = v; render(); break;
    case 'fvp': S.fvp = v; render(); break;
    case 'startspec': toast('The spec editor isn’t in this prototype. In the build: choose a layout from Design, then add sections.'); break;
    case 'gapwork': { const role = a.dataset.role; const w = 'W-' + S.nextW++; toast(`${w} added to Work › ${role === 'Engineer' ? 'Engineer · implement' : 'Experience designer'}: ${v.replace(/<[^>]+>/g, '')}`); break; }
    case 'buildspec': { const w = 'W-' + S.nextW++; toast(`${w} added to Work › Engineer · implement: make ${P(S.page).label} match its spec. Assigned to Codex.`); break; }
    case 'request': openRequest(v || null); break;
    case 'closedrawer': closeDrawer(); break;
    case 'chgform': CR.form = v || null; drawRequest(); break;
    case 'rmchg': CR.changes.splice(+v, 1); drawRequest(); break;
    case 'addchg': {
      const n = document.getElementById('cf-name').value.trim(), c = document.getElementById('cf-comp')?.value.trim() || '', w = document.getElementById('cf-where')?.value || '', st = document.getElementById('cf-story')?.value;
      if (CR.form === 'add' && !n) { document.getElementById('cf-name').focus(); break; }
      CR.changes.push({op:CR.form, name:n, comp:c, where:w, stories: st ? [st] : []}); if (st && !CR.stories.includes(st)) CR.stories.push(st); CR.form = null; drawRequest(); break; }
    case 'submitreq': {
      const w = 'W-' + S.nextW++; const list = S.requested[CR.page] = S.requested[CR.page] || [];
      const adds = CR.changes.filter(c => c.op === 'add');
      if (adds.length) adds.forEach((c, i) => list.push({w, op:'add', secId:'req-' + w + '-' + i, name:c.name, comp:c.comp, where:c.where, title:CR.title, why:CR.what || CR.title, agent:CR.agent, stories:c.stories}));
      else list.push({w, op:'chg', target:CR.target, title:CR.title, why:CR.what || CR.title, agent:CR.agent, stories:CR.stories});
      WORK.push({id:w, t:CR.title, role:'Engineer', type:'implement', st:'Ready'});
      closeDrawer(); S.mode = 'spec'; render();
      toast(`${w} is in Work › Ready · Engineer · implement, assigned to ${CR.agent.split(' ·')[0]}. The spec is at revision ${revOf(P(CR.page))}.`, ['Show in spec', 'showreq']); break; }
    case 'showreq': { const l = S.requested[S.page] || []; const last = l[l.length - 1]; S.tab = 'pages'; S.mode = 'spec'; S.sel = last?.secId ? {type:'sec', id:last.secId} : last?.target ? {type:'sec', id:last.target} : null; render(); break; }
    case 'flow': S.flow = v; S.step = 0; render(); break;
    case 'step': S.step = Math.max(0, +v); render(); break;
    case 'startreview': S.reviewing[S.flow] = {done:false}; S.noteType = 'Looks right'; toast(`W-${S.nextW++} is in progress · Experience designer · review “${FLOWS.find(f => f.id === S.flow).title}”.`); render(); break;
    case 'ntype': S.noteType = v; render(); break;
    case 'addnote': {
      const t = document.getElementById('ntext').value.trim(); if (!t) { document.getElementById('ntext').focus(); break; }
      const f = FLOWS.find(x => x.id === S.flow), step = f.steps[S.step]; const key = S.flow + S.step; (S.notes[key] = S.notes[key] || []);
      const note = {type:S.noteType, text:t};
      if (S.noteType === 'Question') note.link = 'Asked Product lead';
      S.notes[key].push(note);
      if (S.noteType === 'Change request') { S.page = step.page; openRequest(null); CR.title = `${P(step.page).label}: ${t.slice(0, 60)}`; CR.what = t + ` (from the ${f.title} flow review, step ${S.step + 1})`; CR.stories = [step.story]; drawRequest(); note.link = 'Change request opened'; render(); drawRequest(); }
      else if (S.noteType === 'Content fix') { note.link = 'Opened in Edit content'; S.tab = 'pages'; S.page = step.page; S.as = step.as; S.edit = true; S.mode = P(step.page).status === 'built' ? 'built' : 'spec'; S.sel = null; render(); toast('Edit content is on. Click the text to fix it.'); }
      else render();
      break; }
    case 'finishreview': { const f = FLOWS.find(x => x.id === S.flow); const notes = f.steps.flatMap((s, i) => S.notes[S.flow + i] || []); const needs = notes.some(n => n.type !== 'Looks right');
      S.reviewing[S.flow] = {done:true, verdict: needs ? 'Needs changes' : 'Reviewed'}; toast(needs ? `Review closed: needs changes. ${notes.filter(n => n.type !== 'Looks right').length} follow-ups are linked to it.` : 'Review closed: the flow works.'); render(); break; }
    case 'notes': openNotes(); break;
  }
});
document.addEventListener('change', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'state') { S.state = a.value; render(); }
  if (a.dataset.act === 'as') { S.as = a.value; S.sel = null; render(); }
  if (a.dataset.act === 'flowsel') { S.flow = a.value; S.step = 0; render(); }
  if (a.dataset.act === 'nodestory' && a.value) { P(a.dataset.v).stories.push(a.value); render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.title) { P(t.dataset.title).label = t.value || 'Untitled'; return; }
  if (t.dataset.note) { P(t.dataset.note).note = t.value; return; }
  if (t.dataset.flowtitle) { FLOWS.find(f => f.id === t.dataset.flowtitle).title = t.value || 'Untitled flow'; return; }
  const a = e.target.closest('[data-act="cttext"]'); if (!a) return;
  CONTENT[a.dataset.k] = a.value; document.querySelectorAll(`#frame [data-ct="${a.dataset.k}"]`).forEach(x => x.textContent = a.value); drawSel();
});
document.addEventListener('focusout', e => { if ((e.target.dataset?.title || e.target.dataset?.flowtitle) && S.tab === 'map') setTimeout(() => { if (!document.activeElement?.closest?.('.flows,.node')) renderSidebar(); }, 0); });
document.addEventListener('keyup', e => { if (e.key === ' ') { SPACE = false; if (S.tab === 'map' && S.tool !== 'hand') document.getElementById('vp')?.classList.remove('hand'); } });
document.addEventListener('keydown', e => {
  if (S.tab !== 'map' || document.querySelector('.drawer')) return;
  if (e.target.closest?.('input,textarea,select')) { if (e.key === 'Escape' || (e.key === 'Enter' && e.target.tagName === 'INPUT')) e.target.blur(); return; }
  if (e.key === ' ') { SPACE = true; document.getElementById('vp')?.classList.add('hand'); e.preventDefault(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { deleteSel(); e.preventDefault(); }
  else if (e.key === 'v' || e.key === 'h') { S.tool = e.key === 'h' ? 'hand' : 'select'; render(); }
  else if (e.key === 'Escape') { if (S.mapFlow && !S.msel.size && !S.mlink) { S.mapFlow = ''; render(); } else { S.msel.clear(); S.mlink = null; refreshSel(); drawLinks(); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (document.querySelector('.drawer')) closeDrawer(); else if (document.querySelector('[contenteditable=true]')) { stopEditing(); } } });
function closeDrawer() { document.querySelectorAll('.drawer,.scrim').forEach(e => e.remove()); }
function openNotes() {
  const rows = [['M1','Map is a canvas: zoom and pan','Scroll, Ctrl/⌘ + scroll, Space-drag or the hand tool; Fit','map'],['M2','Desktop and phone; clean grid','Desktop · Phone · Both; pages sit in grid cells','map'],['M3','Pop in page blanks for stories','“Page blank” tool, or a flow’s “Stories with no page” › Blank','map'],['M4','Drag with snapping; move a group','Drag a page; drag empty space to select several; a taken cell is refused','map'],['M5','Connect pages by dragging','Hover a page, drag its ● to another page, name the link','map'],['M6','Blank has title and note; button opens it in Pages','Type on the blank; ↗ opens it (double-click works too)','map'],['M7','Flows sidebar replaces picker and gaps; edit the selected flow on canvas','Map › Flows; select one, use “+ Step”, reorder or remove in the sidebar','map'],['M10','“As” lists Vision’s personas','Pages › As','pages'],['M11','Flows: preview first; steps down the left with a dropdown','Flows tab','flows']];
  document.querySelectorAll('.drawer,.scrim').forEach(e => e.remove());
  const sc = document.createElement('div'); sc.className = 'scrim'; sc.dataset.act = 'closedrawer';
  const d = document.createElement('aside'); d.className = 'drawer';
  d.innerHTML = `<div class="row"><h2>Review notes · v2</h2><button class="btn sm ghost push" data-act="closedrawer" aria-label="Close">${ic('close')}</button></div><p class="small muted">Each row of the brief and where to look. Illustrative Tool Share data; nothing is saved.</p><div class="notes"><table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3] ? `<button class="btn sm" data-act="tab" data-v="${r[3]}">Show</button>` : ''}</td></tr>`).join('')}</table></div>
  <h3 style="margin-top:14px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint)">Things to try</h3>
  <ul class="small" style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Map › Flows › Give it back › Blank (S16), then Blank (S17). Drag the second one next to the first and draw a link between them.</li><li>Drag empty space over Profile and List a tool, then drag both one row down together.</li><li>Map › Flows › Borrow: the missing step is dashed. Use its ▣ button to add a blank.</li><li>Drag Browse onto Tool detail: the cell is taken, so it goes back.</li><li>Map › Phone, then Desktop: the grid respaces.</li><li>Open a blank (↗): Pages shows its note and “Start the spec”.</li><li>Flows › Find a tool: preview in the middle; steps on the left.</li></ul></ul>`;
  document.body.append(sc, d);
  d.addEventListener('click', ev => { if (ev.target.closest('[data-act="tab"]')) closeDrawer(); });
}
window.addEventListener('resize', () => { if (S.tab === 'pages') drawSel(); });
if (innerWidth < 900) S.vp = 'phone';
render();
</script>
