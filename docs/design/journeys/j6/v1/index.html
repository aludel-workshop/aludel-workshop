<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aludel walk review</title>
<!-- JOURNEYS-01 J6 prototype v1 (questions Q1-Q7 in ../../work-record.md#j6-walk-review-prototype-round). Static; illustrative
     Team Notes data; nothing is saved or sent except the reviewer's own notes, which stay in this browser. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
:root{color-scheme:light;
  --bg:#fbfbfd;--surface:#fff;--rail:#f3f5f9;--panel:#f4f6fa;--hover:#e9edf5;--line:#dfe3ec;--line-strong:#c8cfdc;--ink:#1b1f2a;--muted:#5d6679;--faint:#636c80;
  --accent:#3047b9;--accent-bg:#e3e8ff;
  --ok:#146446;--ok-bg:#d9f3e7;--bad:#a1231f;--bad-bg:#fce1e0;--warn:#7a4f00;--warn-bg:#fff0cc;--info:#1a5fb4;--info-bg:#e2ecfb;
  --new:#5b3cc4;--new-bg:#ece7fd;
  --shadow:0 18px 50px #1c2a5a2e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Roboto,system-ui,sans-serif;font-size:14.5px;line-height:1.45;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.icon{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;display:inline-block;vertical-align:middle;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono,code{font-family:"Roboto Mono",ui-monospace,monospace;font-size:.88em}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:8px}.push{margin-left:auto}.wrap{flex-wrap:wrap}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0}

/* Shell, as the built portal */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;padding:2px 8px 12px}
.brand .icon{color:var(--accent);font-size:26px}
.proj{display:flex;align-items:center;gap:9px;padding:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.proj .mk{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#3047b9;color:#fff;font-weight:700;font-size:12px}
.proj small{display:block;color:var(--muted);font-size:11.5px}
.nav a{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 6px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a.active{background:var(--nb);font-weight:700}
.tile{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--nb);color:var(--nc)}
.tile .icon{font-size:19px}
.nav a.active .tile{background:var(--nc);color:#fff}
.n-home{--nc:#c62828;--nb:#fde8e8}.n-vision{--nc:#b93c0a;--nb:#ffeddc}.n-design{--nc:#8a6100;--nb:#fff3cc}.n-pages{--nc:#2a7230;--nb:#e2f4e3}.n-data{--nc:#00766c;--nb:#d6f3ee}.n-code{--nc:#1a5fb4;--nb:#e2ecfb}.n-deploy{--nc:#2f3a9e;--nb:#e4e7f8}.n-work{--nc:#5b3cc4;--nb:#ece7fd}
.main{padding:14px 18px 80px;min-width:0}

.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--hover)}.btn .icon{font-size:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#2539a0}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:3px 9px;font-size:12.5px}.btn.sm .icon{font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--panel);color:var(--muted);white-space:nowrap}
.chip .icon{font-size:15px}
.chip.new{background:var(--new-bg);color:var(--new)}.chip.changed{background:var(--info-bg);color:var(--info)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.t-passed{color:var(--ok)}.t-failed{color:var(--bad)}.t-uncovered,.t-no-fixture{color:var(--warn)}
.eyebrow{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);font-weight:700}

/* Review frame (borrowed: the built review, work-review.ts) */
.wr{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wr-top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wr-top h1{font-size:16px}
.who{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.av{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#ece7fd;color:#5b3cc4;font-size:13px}
.claims{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%}
.claims button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.claims button[aria-current="true"]{background:var(--accent-bg);border-color:var(--accent);font-weight:700}
.claims .n{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--panel);font-size:11px;font-weight:700}
.claims .done .n{background:var(--ok);color:#fff}
.banner{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:13.5px;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg)}
.banner .icon{font-size:18px}

/* Walk: rail | preview | step (invented arrangement; parts borrowed, see the work record) */
.walk{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;min-height:620px}
.walk>*{min-width:0}
.steps{border-right:1px solid var(--line);padding:12px 10px;background:#fcfcfe}
.jhead{padding:2px 6px 10px}
.jhead h2{font-size:15px}
.steps ol{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.stepbtn{position:relative;display:grid;grid-template-columns:24px 1fr auto;gap:2px 8px;align-items:start;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:12px;padding:7px 8px}
.stepbtn:hover{background:var(--hover)}
.stepbtn[aria-current="step"]{background:var(--accent-bg);border-color:#b9c4f5}
.stepbtn .num{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);font-size:11.5px;font-weight:700;background:var(--surface)}
.stepbtn.walked .num{background:var(--ok);border-color:var(--ok);color:#fff}
.stepbtn.noted .num{background:var(--warn);border-color:var(--warn);color:#fff}
.stepbtn.unclaimed .num{border-style:dashed}
.stepbtn .nm{font-weight:500;font-size:13.5px}
.stepbtn .meta{grid-column:2/4;display:flex;gap:4px;flex-wrap:wrap}
.stepbtn .tm{font-size:18px}
.legend{margin:12px 6px 0;font-size:12px;color:var(--muted)}

.pv{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);background:var(--panel)}
.pvbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 11px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.persona{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:#fff3cc;color:#6b4b00;font-size:12.5px;font-weight:500}
.persona .icon{font-size:16px}
.frames{flex:1;display:grid;gap:10px;padding:10px;grid-template-columns:1fr;align-content:start}
.frames.two{grid-template-columns:1fr 1fr}
.frame{border:1px solid var(--line-strong);border-radius:12px;background:#fff;overflow:hidden;display:flex;flex-direction:column;min-height:440px}
.fhead{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#eef0f5;border-bottom:1px solid var(--line);font-size:12px}
.fhead .addr{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead .lbl{font-weight:700;font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.fhead .lbl.prev{color:var(--muted)}.fhead .lbl.prop{color:var(--accent)}
.fbody{flex:1;position:relative}
.reached{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--ok-bg);color:var(--ok);font-size:12.5px;border-top:1px solid var(--line)}

/* the mock app: Team Notes */
.app{font-family:system-ui,sans-serif;font-size:13.5px;color:#222;height:100%;display:flex;flex-direction:column}
.app .ah{display:flex;align-items:center;gap:14px;padding:10px 14px;background:#20323f;color:#fff}
.app .ah b{font-size:14.5px}
.app .ah button{background:none;border:0;color:#cfe0ea;padding:3px 6px;border-radius:6px}
.app .ah button.on{background:#ffffff22;color:#fff}
.app .ah .me{margin-left:auto;font-size:12px;color:#cfe0ea}
.app .am{padding:14px 16px}
.app .h{margin:0 0 10px;font-size:17px}
.app .card{border:1px solid #e3e3e3;border-radius:8px;padding:9px 11px;margin-bottom:7px}
.app .abtn{background:#1f7a5c;color:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:600}
.app .abtn.sec{background:#eef3f1;color:#1f5a46}
.app label{display:block;font-size:12px;color:#555;margin:8px 0 3px}
.app input,.app select{width:100%;max-width:300px;padding:6px 8px;border:1px solid #bbb;border-radius:6px}
.app table{border-collapse:collapse;width:100%;max-width:420px}
.app td{padding:6px 4px;border-bottom:1px solid #eee}
.app .pend{color:#8a5a00;background:#fff0cc;border-radius:4px;padding:0 6px;font-size:12px}
.app .err{color:#a1231f;background:#fce1e0;border-radius:6px;padding:7px 10px;margin-top:10px}
.app .welcome{background:#e3f4ec;border-radius:6px;padding:7px 10px;margin-bottom:10px}
.app .mail{border:1px solid #ddd;border-radius:8px;max-width:440px}
.app .mail .mh{padding:8px 10px;border-bottom:1px solid #eee;font-size:12.5px;color:#555}
.app .mail .mb{padding:10px}
.app .stub{font-size:11px;color:#595959;margin-bottom:8px}
.app.nf{align-items:center;justify-content:center;color:#666;gap:6px}
.app.nf b{font-size:30px;color:#999}
.hint .hot{outline:2px dashed #e08a00;outline-offset:2px}
.state{display:grid;place-items:center;height:100%;padding:24px;text-align:center;color:var(--muted)}
.state .icon{font-size:34px}
.state ol{text-align:left;margin:10px 0 0;padding-left:20px}

/* step panel */
.sp{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sp h2{font-size:17px;line-height:1.25}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:13.5px}
.spec dt{color:var(--muted);font-weight:500}
.spec dd{margin:0}
.box{border:1px solid var(--line);border-radius:12px;padding:10px}
.box h3{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.proof{display:flex;align-items:center;gap:6px;font-weight:500}
.thumb{display:block;width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;padding:0;margin-top:8px;position:relative;height:150px}
.thumb .scale{transform:scale(.5);transform-origin:0 0;width:200%;height:300px;pointer-events:none}
.thumb .cap{position:absolute;right:6px;bottom:6px;background:#1b1f2aE6;color:#fff;border:0;font-size:12px;padding:3px 8px;border-radius:8px;display:inline-flex;gap:4px;align-items:center}.thumb .cap .icon{font-size:16px}
.pages-thumb{background:#f2f8f2;border:1px dashed #9cc59f;border-radius:8px;padding:8px;font-size:12.5px;color:#2a7230;margin-top:6px}
.ntypes{display:flex;gap:4px;flex-wrap:wrap}
.ntypes button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.ntypes button .icon{font-size:16px}
.ntypes button[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent)}
textarea{width:100%;min-height:62px;border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;resize:vertical}
select.inp{border:1px solid var(--line-strong);border-radius:8px;padding:4px 6px;background:#fff}
.notes{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.notes li{display:flex;gap:6px;font-size:13px;background:var(--panel);border-radius:8px;padding:6px 8px;align-items:flex-start}
.notes li .icon{font-size:17px}
.notes li .x{margin-left:auto;border:0;background:none;padding:0;color:var(--muted)}
.blocker{display:flex;gap:6px;align-items:flex-start;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:8px 10px;font-size:13px}
.caution{display:flex;gap:6px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px}
.blocker .icon,.caution .icon{font-size:18px}
.spfoot{margin-top:auto;display:flex;gap:6px;justify-content:space-between}

/* under the hood (borrowed: GitHub's collapsed file list) */
details.hood{border-top:1px solid var(--line)}
details.hood summary{padding:10px 14px;cursor:pointer;font-weight:500;display:flex;gap:8px;align-items:center;list-style:none}
details.hood summary::-webkit-details-marker{display:none}
details.hood[open] summary .icon.chev{transform:rotate(90deg)}
.hoodbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;padding:0 14px 14px}
.files{list-style:none;margin:0;padding:0;font-size:13px}
.files li{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.hoodbody>*{min-width:0}.files .mono{overflow-wrap:anywhere;min-width:0}
.files .a{color:var(--ok)}.files .d{color:var(--bad)}
pre.diff{margin:0;background:#1b1f2a;color:#e7e9ef;border-radius:10px;padding:10px;font-size:12px;overflow:auto;max-height:260px}
pre.diff .a{background:#1f4d36;display:block}pre.diff .d{background:#5a2020;display:block}pre.diff .h{color:#9fb2ff;display:block}

/* other claims and sign-off */
.claimview{padding:18px;display:grid;gap:14px;max-width:900px}
.claimview h2{font-size:18px}
table.reg{border-collapse:collapse;width:100%;font-size:13.5px}
table.reg th,table.reg td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.reg th{font-size:12px;color:var(--muted);font-weight:500}
.verdict{display:flex;gap:6px;flex-wrap:wrap}
.verdict button[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);font-weight:700}
.signbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:6px}
.fu{display:grid;gap:6px;list-style:none;padding:0;margin:0}
.fu li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13.5px}

/* prototype-only controls */
.proto{position:fixed;right:14px;bottom:14px;z-index:50;display:flex;gap:6px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--surface);box-shadow:var(--shadow);z-index:60;padding:16px;overflow:auto;display:none}
.drawer.open{display:block}
.drawer h2{font-size:16px;margin-bottom:8px}
.drawer fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:8px 10px}
.drawer legend{font-weight:700;font-size:13px;padding:0 4px}
.drawer label{display:flex;gap:6px;align-items:center;font-size:13.5px;padding:2px 0}
.drawer .q{margin-bottom:12px}
.drawer .q p{margin:0 0 4px;font-size:13.5px}
.lightbox{position:fixed;inset:0;background:#0009;z-index:70;display:none;place-items:center;padding:20px}
.lightbox.open{display:grid}
.lightbox .lb{background:#fff;border-radius:12px;width:min(760px,100%);overflow:hidden}
.lightbox .lbh{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.lightbox .lbb{height:440px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b1f2a;color:#fff;padding:8px 14px;border-radius:10px;z-index:80;font-size:13.5px}

/* narrow */
@media (max-width:1180px){ .walk{grid-template-columns:220px minmax(0,1fr)} .sp{grid-column:1/-1;border-top:1px solid var(--line)} .pv{border-right:0} }
@media (max-width:860px){
  .shell{grid-template-columns:1fr} .rail{display:none} .main{padding:8px}
  .walk{grid-template-columns:1fr}
  .steps{border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .steps ol{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  .steps li{flex:none;width:200px}
  .legend{display:none}
  .frames.two{grid-template-columns:1fr}
  .frame{min-height:400px}
  .hoodbody{grid-template-columns:1fr}
  .claims{margin-left:0;width:100%}
  .side-only{display:none}
}
</style>
<body>
<div class="shell">
  <nav class="rail" aria-label="Project">
    <div class="brand"><span class="icon" aria-hidden="true">deployed_code</span>Aludel</div>
    <div class="proj"><span class="mk" aria-hidden="true">TN</span><div><b>Team Notes</b><small>Imported app</small></div></div>
    <div class="nav">
      <a href="#" class="n-home"><span class="tile"><span class="icon" aria-hidden="true">home</span></span>Home</a>
      <a href="#" class="n-vision"><span class="tile"><span class="icon" aria-hidden="true">lightbulb</span></span>Vision</a>
      <a href="#" class="n-design"><span class="tile"><span class="icon" aria-hidden="true">palette</span></span>Design</a>
      <a href="#" class="n-pages"><span class="tile"><span class="icon" aria-hidden="true">web</span></span>Pages</a>
      <a href="#" class="n-data"><span class="tile"><span class="icon" aria-hidden="true">schema</span></span>Data</a>
      <a href="#" class="n-code"><span class="tile"><span class="icon" aria-hidden="true">code</span></span>Code</a>
      <a href="#" class="n-deploy"><span class="tile"><span class="icon" aria-hidden="true">rocket_launch</span></span>Deploy</a>
      <a href="#" class="n-work active" aria-current="page"><span class="tile"><span class="icon" aria-hidden="true">checklist</span></span>Work</a>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="proto">
  <button class="btn" type="button" data-act="scenarios"><span class="icon" aria-hidden="true">tune</span>Scenarios</button>
  <button class="btn primary" type="button" data-act="questions"><span class="icon" aria-hidden="true">rate_review</span>Review questions</button>
</div>
<aside class="drawer" id="scenarios" aria-label="Prototype scenarios"></aside>
<aside class="drawer" id="questions" aria-label="Review questions"></aside>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Test screenshot"></div>
<script>
// ---------- illustrative data ----------
const PERSONAS = {
  owner: { label: 'owner', fixture: 'seeded-team', session: 'ana@team.invalid' },
  member: { label: 'member', fixture: 'seeded-team', session: 'lee@team.invalid' },
  newcomer: { label: 'newcomer', fixture: 'fresh', session: null },
};
const JOURNEYS = {
  invite: { id: 'invite-teammates', title: 'Invite teammates', revision: 2, origin: 'authored', steps: [
    { id: 'open-settings', name: 'Settings open', persona: 'owner', route: '/settings', start: 'notes', end: 'settings', change: 'unchanged', claimed: false,
      trigger: 'Clicks Settings in the top bar', expected: 'Settings lists the team.' },
    { id: 'open-invite', name: 'Invite form opens', persona: 'owner', route: '/settings', start: 'settings', end: 'invite-form', change: 'new', claimed: true,
      trigger: 'Clicks Invite teammate', expected: 'A form asks for an email address and a role.' },
    { id: 'send-invite', name: 'Invite sent', persona: 'owner', route: '/settings/invite', start: 'invite-form', end: 'settings-pending', change: 'new', claimed: true,

  const walked = claimed.filter(([, i]) => S.walked[key('invite', i)]).length;
  const failing = claimed.filter(([s]) => testOf('invite', s).status !== 'passed');
  const allNotes = Object.entries(S.notes).flatMap(([k, ns]) => ns.map(n => ({ k, ...n })));
  const changes = allNotes.filter(n => n.type === 'change');
  const other = allNotes.filter(n => n.type === 'content' || n.type === 'question');
  const reasons = [];
  if (S.scn.stale) reasons.push('The accepted head moved. Refresh against latest, then sign.');
  failing.forEach(([s]) => reasons.push(`Step “${s.name}”: ${TEST[testOf('invite', s).status][1].toLowerCase()}.`));
  if (S.scn.preview !== 'running' && S.scn.preview !== 'stopped') reasons.push('The build is still running its checks.');
  return `<div class="claimview"><div><div class="eyebrow">Sign off</div><h2>Run 1 of W-9 · Implement: Invite teammates</h2></div>
    <table class="reg"><thead><tr><th scope="col">Claim</th><th scope="col">Automated proof</th><th scope="col">Your review</th></tr></thead><tbody>
      <tr><td>1 · Invite teammates, 3 steps</td><td>${failing.length ? `${icon('cancel', 't-failed')} ${3 - failing.length} of 3 passed` : `${icon('check_circle', 't-passed')} 3 of 3 passed`}</td><td>${walked} of 3 steps walked${allNotes.length ? ` · ${allNotes.length} note${allNotes.length > 1 ? 's' : ''}` : ''}</td></tr>
      <tr><td>2 · Existing journeys still work</td><td>${icon('check_circle', 't-passed')} 6 of 6 passed</td><td>${S.claimVerdict.c2 === 'holds' ? 'Holds' : S.claimVerdict.c2 === 'no' ? 'Doesn’t hold' : '<span class="muted">Not looked at</span>'}</td></tr>
      <tr><td>3 · Invite emails name the team</td><td><span class="muted">None (unbacked)</span></td><td>${S.claimVerdict.c3 === 'holds' ? 'Holds' : S.claimVerdict.c3 === 'no' ? 'Doesn’t hold' : '<span class="muted">No verdict</span>'}</td></tr>
    </tbody></table>
    ${changes.length ? `<div><h3 class="eyebrow" style="margin-bottom:6px">Change notes become follow-up work</h3><ul class="fu">${changes.map((n, i) => `<li>${icon('playlist_add')}<span>${esc(n.text || '(no text)')}</span><span class="chip">${n.layer}</span><span class="tiny muted push">from step ${esc(n.k.split(':')[1])}</span><label class="row small"><input type="checkbox" checked data-fu="${i}">Create</label></li>`).join('')}</ul>
      <p class="tiny muted" style="margin:6px 0 0">Created when you sign, in each layer's backlog, linked to this run. Accepting doesn't wait for them.</p></div>` : ''}
    ${other.length ? `<p class="small" style="margin:0">${icon('sticky_note_2')} ${other.length} content or question note${other.length > 1 ? 's' : ''} go to the performer with your signature.</p>` : ''}
    ${reasons.map(r => `<div class="blocker">${icon('block')}<span>${esc(r)}</span></div>`).join('')}
    ${!reasons.length && walked < 3 ? `<div class="caution">${icon('info')}<span>You walked ${walked} of 3 claimed steps. Their tests passed; you can still accept.</span></div>` : ''}
    ${S.accepted ? `<div class="caution" style="background:var(--ok-bg);color:var(--ok)">${icon('verified')}<span>${S.accepted === 'accept' ? `Accepted. Commit ${COMMIT.proposed.slice(0, 7)} merges as reviewed${changes.length ? `, and ${changes.length} follow-up${changes.length > 1 ? 's were' : ' was'} created` : ''}.` : 'Rejected with your notes. The agent gets them for its next run.'} (Prototype: nothing was sent.)</span></div>` : ''}
    <div class="signbar"><button type="button" class="btn sm" data-claim="c3">${icon('arrow_back')}Claim 3</button><span class="push"></span>
      <button type="button" class="btn danger" data-act="reject">${icon('flag')}Reject</button><button type="button" class="btn primary" data-act="accept" ${reasons.length ? 'disabled aria-describedby="why"' : ''}>${icon('check')}Accept</button></div>
    ${reasons.length ? '<p id="why" class="tiny muted" style="margin:0;text-align:right">Accept unlocks when the red items above are resolved.</p>' : ''}</div>`;
}

function render() {
  const claims = [['c1', 'Invite teammates', '3 steps'], ['c2', 'Existing journeys', ''], ['c3', 'Note', ''], ['end', 'Sign off', '']];
  const done = { c1: JOURNEYS.invite.steps.every((s, i) => !s.claimed || S.walked[key('invite', i)]), c2: !!S.claimVerdict.c2, c3: !!S.claimVerdict.c3 };
  const walkView = S.claim === 'c1' || (S.claim === 'c2' && S.walkingReg);
  $('#main').innerHTML = `<div class="wr">
    <header class="wr-top"><a class="btn ghost sm" href="#" aria-label="Close review">${icon('close')}</a><h1>Review W-9 · Run 1</h1>
      <span class="who"><span class="av">${icon('smart_toy').replace('class="icon ', 'style="font-size:14px" class="icon ')}</span>Builder agent</span><span class="muted small">Implement: Invite teammates</span>
      <nav class="claims" aria-label="Claims">${claims.map(([id, l, sub], i) => `<button type="button" data-claim="${id}" ${S.claim === id ? 'aria-current="true"' : ''} class="${done[id] ? 'done' : ''}">${id === 'end' ? icon('draw') : `<span class="n">${done[id] ? '✓' : i + 1}</span>`}${l}${sub ? ` <span class="muted">· ${sub}</span>` : ''}</button>`).join('')}</nav></header>
    ${S.scn.stale ? `<div class="banner warn" role="status">${icon('history')}The accepted head moved 2 commits since this build. Your notes stay.<button type="button" class="btn sm push" data-act="refresh">Refresh against latest</button></div>`
      : `<div class="banner">${icon('difference')}Reviewing <span class="mono">${COMMIT.proposed.slice(0, 7)}</span> against accepted <span class="mono">${COMMIT.previous.slice(0, 7)}</span>. Raised by W-8 (Specify), which made this journey revision 2.</div>`}
    ${walkView ? `<div class="walk">${stepsRail()}${preview()}${stepPanel()}</div>${hood()}` : S.claim === 'c2' ? regression() : S.claim === 'c3' ? noteClaim() : signoff()}
  </div>`;
  renderScenarios();
}

// ---------- scenarios and review questions (prototype only) ----------
const QUESTIONS = [
  ['Q1', 'Walk view: steps on the left, the live preview in the middle, the step’s spec, test proof and your notes on the right. Is that the right reading order, and is the preview big enough?'],
  ['Q2', 'Claims along the top (journey, regression, note, sign-off) replace the old one-claim-at-a-time panel. Clear enough, or should every step be its own pip?'],
  ['Q3', 'Notes: “Looks right” marks a step walked; Content, Change and Question flag it. A Change note becomes follow-up work in a layer you pick at sign-off. Right?'],
  ['Q4', 'Previous/Proposed: a toggle plus side by side on wide screens, each frame walked on its own. Would you rather the two stay in step (click once, both move)?'],
  ['Q5', 'The rail follows the preview: reaching a step’s end screen marks it reached and offers the next step (Scenarios › “Rail follows the preview”). Helpful, or should walking stay fully manual?'],
  ['Q6', 'Blocked states (failed test, no test, no fixture, stale head, still building): is each one clear about why Accept is locked and what happens next?'],
  ['Q7', 'Under the hood is collapsed below the walk: files, checks, diff. Is that enough reach to the code, or is it in the way?'],
];
function renderScenarios() {
  const sc = S.scn; const r = (name, val, label) => `<label><input type="radio" name="${name}" value="${val}" ${sc[name] === val ? 'checked' : ''}>${label}</label>`;
  $('#scenarios').innerHTML = `<div class="row"><h2>Scenarios</h2><button type="button" class="btn ghost sm push" data-act="close-drawer">${icon('close')}Close</button></div>
    <p class="small muted">Prototype controls for the exceptional states. The real review has none of these.</p>
    <fieldset><legend>“Invite sent” test</legend>${r('sendTest', 'passed', 'Passed')}${r('sendTest', 'failed', 'Failed (the invite never shows as Pending)')}</fieldset>
    <fieldset><legend>“Invite form opens” test</legend>${r('inviteTest', 'passed', 'Written and passing')}${r('inviteTest', 'uncovered', 'Missing: the run wrote none')}</fieldset>
    <fieldset><legend>Newcomer fixture</legend>${r('fixture', 'present', 'In review.json')}${r('fixture', 'missing', 'Missing')}</fieldset>
    <fieldset><legend>Preview</legend>${r('preview', 'running', 'Running')}${r('preview', 'building', 'Still building')}${r('preview', 'stopped', 'Stopped after idle')}</fieldset>
    <fieldset><legend>Journey authority</legend>${r('source', 'code', 'Code only')}${r('source', 'pages', 'Pages flow (replica in Code)')}</fieldset>
    <fieldset><legend>Other</legend><label><input type="checkbox" name="stale" ${sc.stale ? 'checked' : ''}>Accepted head moved since this build</label>
      <label><input type="checkbox" name="follow" ${sc.follow ? 'checked' : ''}>Rail follows the preview (Q5)</label><label><input type="checkbox" name="hint" ${sc.hint ? 'checked' : ''}>Outline what each step clicks</label></fieldset>
    <button type="button" class="btn" data-act="reset">${icon('restart_alt')}Reset the walk (keeps your review answers)</button>`;
}
function renderQuestions() {
  const a = store.get('answers', {});
  $('#questions').innerHTML = `<div class="row"><h2>Review questions</h2><button type="button" class="btn ghost sm push" data-act="close-drawer">${icon('close')}Close</button></div>
    <p class="small muted">Answer in your own words; they stay in this browser. Copy them into the thread when you're done.</p>
    ${QUESTIONS.map(([id, q]) => `<div class="q"><p><b>${id}.</b> ${q}</p><label class="vh" for="a-${id}">Answer to ${id}</label><textarea id="a-${id}" data-ans="${id}">${esc(a[id] || '')}</textarea></div>`).join('')}
    <button type="button" class="btn primary" data-act="copy">${icon('content_copy')}Copy answers</button>`;
}

// ---------- behaviour ----------
function selectStep(i, opts = {}) {
  S.step = i; S.noteType = null; S.anon = false; S.screen = {};
  render(); if (opts.focus !== false) $('#steph')?.focus();
}
function navigate(side, to) {
  const s = step(); S.screen[side] = to;
  if (side === 'proposed' && to === s.end) {
    if (S.scn.follow && S.step < J().steps.length - 1 && J().steps[S.step + 1].start === to && J().steps[S.step + 1].persona === s.persona) {
      render(); toast(`Reached the end of step ${S.step + 1}. Leave a note, or go on to step ${S.step + 2}.`); return;
    }
  }
  render();
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  const d = t.dataset;
  if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault();
  if (d.go) { const side = t.closest('.fbody')?.dataset.side; if (side) navigate(side, d.go); return; }
  if (d.step) return selectStep(+d.step);
  if (d.view) { S.view = d.view; return render(); }
  if (d.claim) { S.claim = d.claim; S.walkingReg = false; if (d.claim === 'c1') { S.journey = 'invite'; S.screen = {}; } return render(); }
  if (d.note) { S.noteType = S.noteType === d.note ? null : d.note;
    if (d.note === 'looks-right') { const k = key(S.journey, S.step); (S.notes[k] ||= []).push({ type: 'looks-right' }); S.walked[k] = true; S.noteType = null; toast('Marked walked: looks right'); }
    render(); if (S.noteType) $('#ntext')?.focus(); return; }
  if (d.del !== undefined) { const k = key(S.journey, S.step); S.notes[k].splice(+d.del, 1); if (!S.notes[k].some(n => n.type === 'looks-right')) delete S.walked[k]; return render(); }
  if (d.cv) { const [c, v] = d.cv.split(':'); S.claimVerdict[c] = v; return render(); }
  switch (d.act) {
    case 'addnote': { const k = key(S.journey, S.step); const text = $('#ntext').value.trim(); if (!text) { $('#ntext').focus(); toast('Write the note first'); return; }
      (S.notes[k] ||= []).push({ type: S.noteType, text, layer: S.noteType === 'change' ? $('#nlayer').value : null }); S.walked[k] = true; S.noteType = null; return render(); }
    case 'cancelnote': S.noteType = null; return render();
    case 'next': return selectStep(S.step + 1);
    case 'prev': return selectStep(S.step - 1);
    case 'nextclaim': S.claim = S.claim === 'c1' ? 'c2' : 'c2'; S.walkingReg = false; S.journey = 'invite'; S.step = 0; S.screen = {}; return render();
    case 'restart-step': delete S.screen[d.side]; render(); return toast(`New one-use link: entered as ${S.anon ? 'signed out' : step().persona} at the step's start`);
    case 'restart': S.scn.preview = 'running'; return render();
    case 'anon': S.anon = true; return render();
    case 'shot': return openShot();
    case 'newtab': return toast('Opens the same one-use link in a new tab');
    case 'walk-note': S.walkingReg = true; S.journey = 'note'; S.step = 0; S.screen = {}; return render();
    case 'walk-invite0': S.walkingReg = true; S.journey = 'invite'; S.step = 0; S.screen = {}; return render();
    case 'see-inbox': S.claim = 'c1'; S.journey = 'invite'; S.step = 3; S.screen = {}; render(); return toast('Step 4 starts in the preview inbox');
    case 'refresh': S.scn.stale = false; render(); return toast('Rebuilt against the latest accepted head; tests passed again');
    case 'accept': S.accepted = 'accept'; return render();
    case 'reject': S.accepted = 'reject'; return render();
    case 'scenarios': $('#questions').classList.remove('open'); $('#scenarios').classList.add('open'); return $('#scenarios input')?.focus();
    case 'questions': renderQuestions(); $('#scenarios').classList.remove('open'); $('#questions').classList.add('open'); return $('#questions textarea')?.focus();
    case 'close-drawer': return document.querySelectorAll('.drawer').forEach(x => x.classList.remove('open'));
    case 'reset': Object.assign(S, { claim: 'c1', journey: 'invite', step: 1, view: 'proposed', screen: {}, walked: {}, notes: {}, noteType: null, anon: false, claimVerdict: {}, accepted: null, walkingReg: false }); render(); return toast('Walk reset; your review answers are kept');
    case 'copy': { const a = store.get('answers', {}); const txt = QUESTIONS.map(([id]) => `${id}: ${a[id] || ''}`).join('\n'); navigator.clipboard?.writeText(txt).then(() => toast('Copied'), () => toast('Copy failed; select the text instead')); return; }
    case 'close-lb': $('#lightbox').classList.remove('open'); return document.querySelector('[data-act="shot"]')?.focus();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.closest('#scenarios')) { S.scn[t.name] = t.type === 'checkbox' ? t.checked : t.value; S.accepted = null; render(); }
});
document.addEventListener('input', e => { if (e.target.dataset.ans) { const a = store.get('answers', {}); a[e.target.dataset.ans] = e.target.value; store.set('answers', a); } });
document.addEventListener('toggle', e => { if (e.target.classList?.contains('hood')) S.hood = e.target.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#lightbox').classList.remove('open'); document.querySelectorAll('.drawer').forEach(x => x.classList.remove('open')); } });
function openShot() {
  const s = step(); const t = testOf(S.journey, s);
  $('#lightbox').innerHTML = `<div class="lb"><div class="lbh"><b>${esc(s.name)}</b><span class="tiny muted">test screenshot · ${TEST[t.status][1].toLowerCase()} · ${COMMIT.proposed.slice(0, 7)}</span><button type="button" class="btn ghost sm push" data-act="close-lb">${icon('close')}Close</button></div><div class="lbb" inert>${app(t.status === 'failed' ? 'settings-error' : s.end, 'lightbox', s.persona)}</div></div>`;
  $('#lightbox').classList.add('open'); $('#lightbox [data-act="close-lb"]').focus();
}
render();
</script>
</body>
</html>
