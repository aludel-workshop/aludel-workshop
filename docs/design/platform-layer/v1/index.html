<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aludel Code and Deploy</title>
<!-- PLATFORM-UX-01 prototype v1 (ledger C1-C9 in ../work-record.md). Static; illustrative Tool Share data at a later stage than today's scaffold; nothing is saved or sent. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<style>
:root{
  --bg:#fbfbfd;--surface:#fff;--rail:#f3f5f9;--panel:#f4f6fa;--hover:#e9edf5;--line:#dfe3ec;--line-strong:#c8cfdc;--ink:#1b1f2a;--muted:#5d6679;--faint:#8a93a6;
  --accent:#3047b9;--accent-bg:#e3e8ff;
  --ok:#146446;--ok-bg:#d9f3e7;--bad:#a1231f;--bad-bg:#fce1e0;--warn:#8a5a00;--warn-bg:#fff0cc;--info:#1a5fb4;--info-bg:#e2ecfb;
  --shadow:0 18px 50px #1c2a5a2e;
  --c-vision:#b93c0a;--b-vision:#ffeddc;--c-design:#8a6100;--b-design:#fff3cc;--c-pages:#2a7230;--b-pages:#e2f4e3;--c-data:#00766c;--b-data:#d6f3ee;
  --c-code:#1a5fb4;--b-code:#e2ecfb;--c-deploy:#2f3a9e;--b-deploy:#e4e7f8;--c-work:#5b3cc4;--b-work:#ece7fd;
  --lc:var(--c-code);--lb:var(--b-code);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Roboto,system-ui,sans-serif;font-size:14.5px;line-height:1.45;color:var(--ink);background:var(--bg)}
body.deploy{--lc:var(--c-deploy);--lb:var(--b-deploy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.icon{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;display:inline-block;vertical-align:middle;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;flex:none;font-variation-settings:'FILL' 0,'wght' 400}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono,code{font-family:"Roboto Mono",ui-monospace,monospace;font-size:.88em}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}.push{margin-left:auto}.wrap{flex-wrap:wrap}.col{display:grid;gap:12px;align-content:start}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Shell: matches the built portal and the Pages v2 prototype */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;padding:2px 8px 12px}
.brand .icon{color:var(--accent);font-size:26px}
.proj{display:flex;align-items:center;gap:9px;padding:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.proj .mk{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#2e7d5b;color:#fff;font-weight:700;font-size:12px}
.proj small{display:block;color:var(--muted);font-size:11.5px}
.nav a{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 6px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:color-mix(in srgb,var(--nb) 70%,transparent)}
.nav a.active{background:var(--nb);font-weight:700}
.nav a .new{margin-left:auto;font-size:10px;font-weight:700;color:var(--nc);letter-spacing:.5px}
.tile{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--nb);color:var(--nc)}
.tile .icon{font-size:19px}
.nav a.active .tile{background:var(--nc);color:#fff}
.rail .sp{flex:1}
.n-home{--nc:#c62828;--nb:#fde8e8}.n-vision{--nc:#b93c0a;--nb:#ffeddc}.n-design{--nc:#8a6100;--nb:#fff3cc}.n-pages{--nc:#2a7230;--nb:#e2f4e3}.n-data{--nc:#00766c;--nb:#d6f3ee}.n-code{--nc:#1a5fb4;--nb:#e2ecfb}.n-deploy{--nc:#2f3a9e;--nb:#e4e7f8}.n-work{--nc:#5b3cc4;--nb:#ece7fd}.n-library{--nc:#9c27b0;--nb:#f5e2f8}.n-settings{--nc:#4a5568;--nb:#e8ebf0}
.top{display:flex;align-items:center;gap:14px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.search{position:relative;flex:1;max-width:480px}.search input{width:100%;padding:8px 14px 8px 38px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search .icon{position:absolute;left:11px;top:8px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--hover)}.btn .icon{font-size:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:#2539a0}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:3px 9px;font-size:12.5px}.btn.sm .icon{font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
.main{padding:14px 24px 24px;min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--lc);font-weight:700;margin:0 0 2px}
.eyebrow .icon{font-size:16px}
h1{font-size:24px;line-height:1.2;margin:0 0 8px}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.lead{color:var(--muted);margin:-2px 0 12px;max-width:900px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
.tabs a{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none}
.tabs a .icon{font-size:18px;color:var(--lc)}
.tabs a[aria-current=page]{color:var(--ink);border-color:var(--lc)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:18px;background:var(--panel);color:var(--muted);text-decoration:none;border:0}
.chip .icon{font-size:14px}
button.chip,a.chip{cursor:pointer}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--info-bg);color:var(--info)}
.chip.vision{background:var(--b-vision);color:var(--c-vision)}.chip.design{background:var(--b-design);color:var(--c-design)}.chip.pages{background:var(--b-pages);color:var(--c-pages)}.chip.data{background:var(--b-data);color:var(--c-data)}.chip.code{background:var(--b-code);color:var(--c-code)}.chip.deploy{background:var(--b-deploy);color:var(--c-deploy)}.chip.work{background:var(--b-work);color:var(--c-work)}
.chip.dash{background:none;box-shadow:inset 0 0 0 1px var(--line-strong)}
.chip.on{background:var(--lc);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px;color:var(--muted);white-space:nowrap}
.seg button .icon{font-size:16px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.card>.row{flex-wrap:wrap}
.card.quiet{background:var(--panel);border-style:dashed}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.side{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.rel-side{grid-template-columns:320px minmax(0,1fr)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;font-size:13.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--panel)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.list{list-style:none;margin:0;padding:0}
.li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.li:first-child{border-top:0}
.li .icon{color:var(--lc)}
.src-note{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.src-note code{background:var(--panel);padding:0 5px;border-radius:5px}
.bar{height:8px;border-radius:99px;background:var(--panel);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.note{background:var(--info-bg);color:#133c73;border-radius:12px;padding:9px 12px;font-size:13px}
.note.warn{background:var(--warn-bg);color:#5b3c00}

/* Explorer: tree | detail */
.ex{display:grid;grid-template-columns:320px minmax(0,1fr);border:1px solid var(--line);border-radius:16px;background:var(--surface);height:calc(100vh - 186px);min-height:600px;overflow:hidden}
.tree{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fcfcfe}
.tree-head{padding:10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.tree-head input{width:100%;padding:6px 10px 6px 32px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px}
.tree-head .search .icon{top:6px;left:8px;font-size:18px}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.tree-body{overflow:auto;padding:6px 4px 20px;flex:1}
.tn{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 0;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:13.5px;min-width:0;border:0;background:none;width:100%;text-align:left}
.tn:hover{background:var(--hover)}
.tn.sel{background:var(--lb);font-weight:600}
.tn .tw-ch{width:18px;display:inline-grid;place-items:center;color:var(--faint);flex:none}
.tn .tw-ch .icon{font-size:18px;transition:transform .12s}
.tn[aria-expanded=false] .tw-ch .icon{transform:rotate(-90deg)}
.tn .ki{font-size:17px;color:var(--muted)}
.tn .ki.k-container,.tn .ki.k-system{color:var(--lc)}
.tn .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tn .meta{margin-left:auto;display:flex;gap:4px;align-items:center;padding-left:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-healthy{background:#2e9d6b}.d-suspect{background:#e39b00}.d-untraced{background:#9aa3b5}.d-dead{background:#c0392b}
.cnt{font-size:11px;color:var(--faint);font-weight:500}
.tn.dim{opacity:.4}
.detail{overflow:auto;min-width:0;display:flex;flex-direction:column}
.dhead{padding:14px 18px 10px;border-bottom:1px solid var(--line);display:grid;gap:6px;position:sticky;top:0;background:var(--surface);z-index:2}
.crumbs{font-size:12.5px;color:var(--muted);display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px}
.dtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dtitle h2{margin:0;font-size:20px}
.dbody{padding:14px 18px 24px;display:grid;gap:14px}
.unitview{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.links .li{align-items:center}
.links .li .lt{flex:1;min-width:0}
.links small{display:block;color:var(--muted);font-size:12px}
.relgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel a,.rel button.lk{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:13px;border:0;background:none;color:var(--accent);text-align:left;cursor:pointer}
.rel a .icon,.rel button.lk .icon{font-size:17px;color:var(--muted)}

/* Source viewer (read-only) */
.srcwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fbfcfe}
.srcbar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12.5px}
.src{font-family:"Roboto Mono",ui-monospace,monospace;font-size:12.5px;line-height:20px;overflow:auto;max-height:560px}
.src table{border-collapse:collapse;width:100%}
.src td{padding:0;white-space:pre;vertical-align:top}
.src .ln{width:1%;text-align:right;color:var(--faint);padding:0 10px 0 8px;user-select:none}
.src .mk{width:6px;padding:0}
.src .mk i{display:block;width:4px;height:20px;border-radius:2px}
.src tr.hl td{background:#fff7e0}
.src tr.hl td.ln{color:var(--warn)}
.src .cd{padding-right:16px}
.tk-k{color:#7a3db8}.tk-s{color:#1f7a3a}.tk-c{color:#8a93a6;font-style:italic}.tk-n{color:#b35c00}.tk-f{color:#1a5fb4}
.outline{font-size:13px}
.outline button{display:flex;gap:6px;align-items:center;width:100%;border:0;background:none;padding:3px 4px;border-radius:6px;text-align:left}
.outline button:hover{background:var(--hover)}
.outline button.sel{background:var(--lb);font-weight:600}
.readonly{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}

/* C4 diagram */
.c4{width:100%;height:auto;display:block}
.c4 .box{cursor:pointer}
.c4 .box rect{transition:filter .1s}
.c4 .box:hover rect{filter:brightness(.96)}
.c4 text{font-family:Roboto,sans-serif}
.stack{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.stk{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.stk h4{margin:0 0 6px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint)}
.stk .it{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:2px 0}
.stk .it code{color:var(--muted)}
.langbar{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:6px 0}
.adr{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.adr:first-child{border-top:0}
.adr .num{font:600 12px "Roboto Mono",monospace;color:var(--muted);padding-top:2px}

/* Deploy pipeline */
.pipe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.stage{background:var(--panel);border-radius:16px;padding:10px;display:grid;gap:10px;align-content:start;min-height:260px}
.stage-h{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:2px 4px}
.stage-h .icon{font-size:18px}
.env{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:6px;cursor:pointer}
.env:hover{box-shadow:0 0 0 2px var(--lb)}
.env .nm{font-weight:700;display:flex;align-items:center;gap:6px}
.env .ln2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.env.dashed{border-style:dashed;background:#fbfcfe;cursor:default}
.pend{display:flex;align-items:center;gap:8px;background:var(--warn-bg);color:#5b3c00;border-radius:10px;padding:6px 8px;font-size:12.5px}
.dora{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.dora .card{padding:10px 14px}
.dora b{font-size:20px;display:block}
.dora small{color:var(--muted)}
.applybar{display:flex;align-items:center;gap:10px;background:#1b1f2a;color:#fff;border-radius:12px;padding:8px 10px 8px 14px;font-size:13.5px}
.applybar .btn{border-color:#ffffff40;background:#ffffff14;color:#fff}
.applybar .btn.primary{background:#fff;color:var(--ink)}
.meter{display:grid;gap:3px;font-size:12.5px}
.meter .bar{height:7px}
.logs{background:#12151f;color:#d6dbea;border-radius:12px;padding:10px 12px;font:12px/19px "Roboto Mono",monospace;overflow:auto;max-height:420px;white-space:pre}
.logs .t{color:#7f89a6}.logs .w{color:#ffcf66}.logs .e{color:#ff8a80}
.var-in{border:1px solid var(--line);border-radius:8px;padding:3px 7px;font:12.5px "Roboto Mono",monospace;width:100%;min-width:120px;background:var(--surface)}
.var-in.changed{border-color:#e39b00;background:#fffaf0}
.matrix td.c{text-align:center}

/* Drawers */
.scrim{position:fixed;inset:0;background:#0f172a38;z-index:79}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:80;overflow:auto;padding:18px 20px 40px;display:grid;align-content:start;gap:12px}
.drawer h2{margin:0;font-size:20px}
.drawer textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:13.5px;z-index:90;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:92vw}
.toast button{background:#ffffff26;border:0;color:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px}
.notes table{border-collapse:collapse;font-size:13px;width:100%}.notes td{border-top:1px solid var(--line);padding:6px 6px;vertical-align:top}.notes td:first-child{font-weight:700;white-space:nowrap}
.hovercard{position:fixed;z-index:95;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;font-size:12.5px;max-width:320px;pointer-events:none}

@media (max-width:1250px){.unitview{grid-template-columns:minmax(0,1fr)}.side{grid-template-columns:minmax(0,1fr)}.pipe{grid-template-columns:minmax(0,1fr)}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}.rail{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px}.rail .brand,.rail .proj,.rail .sp{display:none}.rail .nav{display:flex;gap:2px}.nav a{padding:4px}.nav a span:not(.tile){display:none}
  .top{padding:8px 16px}.main{padding:12px 16px}
  .ex{grid-template-columns:minmax(0,1fr);height:auto}.tree{border-right:0;border-bottom:1px solid var(--line);max-height:320px}
  .grid2,.grid3,.dora{grid-template-columns:minmax(0,1fr)}.relgrid{grid-template-columns:minmax(0,1fr)}
  .src{max-height:400px}
}
</style>
<body>
<div class="shell">
  <nav class="rail" aria-label="Project">
    <div class="brand"><span class="icon">science</span>Aludel</div>
    <div class="proj"><span class="mk">TS</span><div><b>Tool Share</b><small>Beta phase</small></div></div>
    <div class="nav">
      <a href="#" class="n-home"><span class="tile"><span class="icon">home</span></span><span>Home</span></a>
      <a href="#" class="n-vision"><span class="tile"><span class="icon">flag</span></span><span>Vision</span></a>
      <a href="#" class="n-design"><span class="tile"><span class="icon">palette</span></span><span>Design</span></a>
      <a href="#" class="n-pages"><span class="tile"><span class="icon">web</span></span><span>Pages</span></a>
      <a href="#" class="n-data"><span class="tile"><span class="icon">schema</span></span><span>Data</span></a>
      <a href="#code/overview" class="n-code" id="nav-code"><span class="tile"><span class="icon">code</span></span><span>Code</span></a>
      <a href="#deploy/pipeline" class="n-deploy" id="nav-deploy"><span class="tile"><span class="icon">rocket_launch</span></span><span>Deploy</span><span class="new">NEW</span></a>
      <a href="#" class="n-work"><span class="tile"><span class="icon">task_alt</span></span><span>Work</span></a>
      <a href="#" class="n-library"><span class="tile"><span class="icon">local_library</span></span><span>Library</span></a>

import { requireSession } from '../auth.mjs';
import { db } from '../db.mjs';
import { json, readBody } from '../http.mjs';

export async function createRequest(req, res) {
  const account = requireSession(req, res); if (!account) return;
  const { toolId, from, until, message } = await readBody(req);
  const tool = db.prepare('SELECT id, owner FROM tools WHERE id = ?').get(toolId);
  if (!tool) return json(res, 404, { error: 'No such tool' });
  if (tool.owner === account.email) return json(res, 409, { error: 'You own this tool' });
  const id = crypto.randomUUID();
  db.prepare(\`INSERT INTO borrow_requests (id, tool_id, borrower, from_date, until_date, message, state, created_at)
    VALUES (?, ?, ?, ?, ?, ?, 'asked', datetime('now'))\`).run(id, toolId, account.email, from, until, message ?? '');
  return json(res, 201, { id, state: 'asked' });
}

// Only the lender decides. TS-06 revision 4 adds "decline with a reason": not built yet (W-231, PR #14).

export async function approveRequest(req, res, { id }) {
  const account = requireSession(req, res); if (!account) return;
  const request = db.prepare(\`SELECT r.id, r.state, t.owner FROM borrow_requests r
    JOIN tools t ON t.id = r.tool_id WHERE r.id = ?\`).get(id);
  if (!request) return json(res, 404, { error: 'No such request' });
  if (request.owner !== account.email) return json(res, 403, { error: 'Only the lender can approve' });
  if (request.state !== 'asked') return json(res, 409, { error: \`Already \${request.state}\` });
  db.prepare("UPDATE borrow_requests SET state = 'approved', decided_at = datetime('now') WHERE id = ?").run(id);
  return json(res, 200, { id, state: 'approved' });
}

// Either side can mark it returned once the loan has started.

export async function returnTool(req, res, { id }) {
  const account = requireSession(req, res); if (!account) return;
  const request = db.prepare(\`SELECT r.id, r.state, r.borrower, t.owner FROM borrow_requests r
    JOIN tools t ON t.id = r.tool_id WHERE r.id = ?\`).get(id);
  if (!request) return json(res, 404, { error: 'No such request' });
  if (![request.owner, request.borrower].includes(account.email)) return json(res, 403, { error: 'Not your loan' });
  if (request.state !== 'approved') return json(res, 409, { error: 'Not on loan' });
  db.prepare("UPDATE borrow_requests SET state = 'returned', returned_at = datetime('now') WHERE id = ?").run(id);
  return json(res, 200, { id, state: 'returned' });
}

Status: accepted · 2026-08-30 · Implements: TS-01

## Context
Tool Share is small, and the owner wants no paid services and an app that runs anywhere with docker compose.

## Decision
Each environment keeps one SQLite file on its data volume (DATA_DIR). Numbered migrations in db/migrations
run at start-up. Backups are file copies taken before every promotion.

## Consequences
- One server process per environment writes to the database; no horizontal scaling.
- Moving to PostgreSQL later means a new ADR, a driver change in server/db.mjs, and a data export.

function highlight(line) {

  return escd.replace(/('[^']*'|"[^"]*"|`[^`]*`)/g, '<span class="tk-s">$1</span>')
    .replace(/\b(import|from|export|async|await|function|return|const|if|readonly|class|new|for|of|FROM|RUN|COPY|WORKDIR|ENV|USER|EXPOSE|CMD|HEALTHCHECK|AS|CREATE|TABLE|INDEX|ON|TEXT|NOT|NULL|PRIMARY|KEY|REFERENCES|DEFAULT|CHECK|IN)\b(?![^<]*>)/g, '<span class="tk-k">$1</span>')

function sourceView(path, focus) {

  $('#overlay').innerHTML = `<div class="scrim" data-close></div><aside class="drawer notes" role="dialog" aria-modal="true" aria-label="Review notes">
    <div class="row"><h2>Review notes · v1</h2><button class="btn ghost sm push" data-close>${icon('close')}</button></div>
    <p class="small muted" style="margin:0">Illustrative Tool Share data at a later stage than today's scaffold. Nothing is saved. Ledger rows C1–C9 are in the work record.</p>
    <table><tbody>${rows.map(([id, ask, ...links]) => `<tr><td>${id}</td><td>${esc(ask)}<br>${links.map(([h, l]) => `<a href="${h}" data-close>${esc(l)}</a>`).join(' · ')}</td></tr>`).join('')}</tbody></table>
    <h3>Things to try</h3><ul class="small" style="margin:0;padding-left:18px">
      <li>Explorer: open Borrowing › <b>POST /api/requests/:id/approve</b>. The source is highlighted, the gutter shows which piece each line belongs to, and the story that changed is flagged.</li>
      <li>Filter the tree to <b>Suspect</b>, then switch to <b>Files</b>.</li>
      <li>Type <code>docker</code> or <code>slug</code> in "Go to file or symbol".</li>
      <li>Deploy › Production › Variables: change <code>MAIL_FROM</code> and see the apply bar.</li>
      <li>Pipeline: promote v0.5.0, then see it in History with a rollback.</li></ul>
    <h3>Open questions</h3><ol class="small" style="margin:0;padding-left:18px"><li>Is the split right, with Releases in Code and promotion in Deploy?</li><li>Structure as the Explorer default, or Files?</li><li>A new Operator role for Deploy?</li><li>ADRs in the app repository (<code>docs/adr/</code>)?</li><li>Where the app declares its environments: <code>deploy/environments.yaml</code> is invented here.</li></ol></aside>`;
}

// ---------------------------------------------------------------- router and events
function render() {
  const [layer = 'code', tab = 'overview', a, b] = location.hash.slice(1).split('/');
  document.body.className = layer === 'deploy' ? 'deploy' : '';
  $('#nav-code').classList.toggle('active', layer === 'code'); $('#nav-deploy').classList.toggle('active', layer === 'deploy');
  let html = '';
  if (layer === 'code') {
    html = `<p class="eyebrow">${icon('code')}Code · what's built and how</p><h1>${{ overview: 'How Tool Share is built', explorer: 'Explorer', dependencies: 'Dependencies', changes: 'Changes', releases: 'Releases' }[tab] || ''}</h1>` +
      tabs('Code', [['overview', 'Overview', 'dashboard'], ['explorer', 'Explorer', 'account_tree'], ['dependencies', 'Dependencies', 'inventory_2'], ['changes', 'Changes', 'call_split'], ['releases', 'Releases', 'new_label']], tab) +
      ({ overview: codeOverview, explorer: codeExplorer, dependencies: codeDeps, changes: codeChanges, releases: codeReleases }[tab] || codeOverview)();
  } else {
    if (tab === 'env') { state.env = ENVS[a] ? a : 'production'; state.envTab = b || 'overview'; }
    const t = tab === 'env' ? 'environments' : tab;
    html = `<p class="eyebrow">${icon('rocket_launch')}Deploy · where it runs</p><h1>${{ pipeline: 'Pipeline', environments: ENVS[state.env].name, database: 'Database', domains: 'Domains', monitoring: 'Monitoring' }[t] || ''}</h1>` +
      tabs('Deploy', [['pipeline', 'Pipeline', 'view_column'], ['env/production', 'Environments', 'dns'], ['database', 'Database', 'database'], ['domains', 'Domains', 'language'], ['monitoring', 'Monitoring', 'monitor_heart']], t === 'environments' ? 'env/production' : t) +
      ({ pipeline: deployPipeline, environments: deployEnv, database: deployDatabase, domains: deployDomains, monitoring: deployMonitoring }[t] || deployPipeline)();
  }
  $('#main').innerHTML = html;
  const focus = $('#focus-line'); if (focus) focus.closest('.src').scrollTop = Math.max(0, focus.offsetTop - 60);
  const q = $('#tq'); if (q && state.refocus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); state.refocus = false; }
}
function select(id) { state.sel = id; let at = id.startsWith('u:') ? Object.values(NODES).find(n => (n.units || []).includes(id.slice(2)))?.id : id.startsWith('f:') ? null : PARENT[id]; while (at) { state.open.add(at); at = PARENT[at]; } if (!id.startsWith('u:') && !id.startsWith('f:')) state.open.add(id); }
function goExplorer(id) { select(id); if (location.hash !== '#code/explorer') location.hash = '#code/explorer'; else render(); }
document.addEventListener('click', event => {
  const t = event.target.closest('[data-node],[data-unit],[data-file],[data-dir],[data-sel],[data-f],[data-view],[data-act],[data-close],[data-rel],[data-env],[data-log],[data-goto],[data-unit-go],[data-unit-mark],[data-filter]');
  if (!t) return;
  if (t.dataset.close !== undefined) { $('#overlay').innerHTML = ''; if (t.tagName !== 'A') return; else return; }
  if (t.dataset.filter) { state.filter = t.dataset.filter; state.structure = 'structure'; return; }
  if (t.dataset.node) { const id = t.dataset.node; if (state.sel === id && t.hasAttribute('aria-expanded')) { state.open.has(id) ? state.open.delete(id) : state.open.add(id); } else { state.sel = id; state.open.add(id); } render(); return; }
  if (t.dataset.dir) { state.open.has(t.dataset.dir) ? state.open.delete(t.dataset.dir) : state.open.add(t.dataset.dir); render(); return; }
  if (t.dataset.unit || t.dataset.unitGo || t.dataset.unitMark) { event.preventDefault(); goExplorer('u:' + (t.dataset.unit || t.dataset.unitGo || t.dataset.unitMark)); return; }
  if (t.dataset.file) { event.preventDefault(); goExplorer('f:' + t.dataset.file); return; }
  if (t.dataset.sel) { event.preventDefault(); if (t.dataset.sel === 'svc-mail') { location.hash = '#code/dependencies'; return; } goExplorer(t.dataset.sel); return; }
  if (t.dataset.goto) { goExplorer(t.dataset.goto); return; }
  if (t.dataset.f) { state.filter = t.dataset.f; render(); return; }
  if (t.dataset.view) { state.structure = t.dataset.view; if (t.dataset.view === 'files') for (const d of ['d:server/', 'd:server/routes/', 'd:src/', 'd:src/pages/']) state.open.add(d); render(); return; }
  if (t.dataset.rel) { state.release = t.dataset.rel; render(); return; }
  if (t.dataset.env) { location.hash = '#deploy/env/' + t.dataset.env; return; }
  if (t.dataset.log) { state.logKind = t.dataset.log; render(); return; }
  const act = t.dataset.act;
  if (act === 'notes') notes();
  if (act === 'change') requestChange();
  if (act === 'send-change') { $('#overlay').innerHTML = ''; toast('Added W-240 to Work › Items for the Engineer, with this code, its stories and your note.', 'Open'); }
  if (act === 'update') toast('Added W-241 "Update 4 packages" for the Engineer. It opens one pull request and runs every check.');
  if (act === 'cut') toast('Release v0.6.0 would start from main at e9f4c02 once PR #14 merges. Nothing new to ship yet.');
  if (act === 'promote') promote();
  if (act === 'do-promote') { state.promoted = true; state.applied = true; $('#overlay').innerHTML = ''; ENVS.staging.release = 'v0.5.0'; render(); toast('Production runs v0.5.0. Backup before-v0.5.0 kept; roll back from History.'); }
  if (act === 'apply') { state.applied = true; state.varEdits = {}; render(); toast('Applied. Production restarted in 3 s and is healthy.'); }
  if (act === 'details') toast('MAIL_FROM: hello@toolshare.app → hello@tool-share.app');
  if (act === 'rollback') toast('This would run that release again in this environment, after a backup. It needs a lead\'s approval here.');
  if (act === 'secret') toast('Secrets are typed once, stored on this server only, and never shown again.');
});
document.addEventListener('input', event => {
  if (event.target.id === 'tq') { state.query = event.target.value; state.refocus = true; render(); }
  if (event.target.dataset.var) { const k = event.target.dataset.var; state.varEdits[k] = event.target.value; state.applied = false; event.target.classList.add('changed'); const bar = $('.applybar'); if (!bar) { const pos = event.target.selectionStart; render(); const again = document.querySelector(`[data-var="${k}"]`); again.focus(); again.setSelectionRange(pos, pos); } }
});
document.addEventListener('change', event => {
  if (event.target.id === 'envpick') location.hash = '#deploy/env/' + event.target.value + '/' + state.envTab;
  if (event.target.id === 'dbenv') { state.dbEnv = event.target.value; render(); }
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') $('#overlay').innerHTML = '';
  if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.env[data-env], .c4 .box')) { event.preventDefault(); event.target.click(); }
  if (event.target.matches('.tn') && ['ArrowDown', 'ArrowUp'].includes(event.key)) { event.preventDefault(); const all = [...document.querySelectorAll('.tree-body .tn')]; const i = all.indexOf(event.target); all[Math.max(0, Math.min(all.length - 1, i + (event.key === 'ArrowDown' ? 1 : -1)))]?.focus(); }
});
let hc; document.addEventListener('mouseover', event => {
  const t = event.target.closest('[data-hover]'); hc?.remove(); hc = null; if (!t) return;
  hc = document.createElement('div'); hc.className = 'hovercard'; hc.textContent = t.dataset.hover; document.body.append(hc);
  const r = t.getBoundingClientRect(); hc.style.left = Math.min(innerWidth - 330, r.left) + 'px'; hc.style.top = (r.bottom + 6) + 'px';
});
window.addEventListener('hashchange', () => { $('#overlay').innerHTML = ''; render(); window.scrollTo(0, 0); });
if (!location.hash) history.replaceState(null, '', '#code/explorer');
render();
</script>
