   <div class="row" style="margin-top:10px">${pinned?`<button class="btn sm" data-act="unpin" data-pal="${pk}" data-tone="${t}"><span class="icon">restart_alt</span>Unpin</button>`:''}${!isKey?`<button class="btn sm" data-act="makekey" data-pal="${pk}" data-tone="${t}"><span class="icon">key</span>Make key colour</button>`:''}</div>`);
  return pop;}
function aliasPop(el,roleId){const r=S.roles.find(x=>x.id===roleId);const[a,t]=alias(r);
  const rows=Object.entries(S.palettes).map(([k,p])=>{const tones=[...STD,...tonesFor(k)].filter((v,i,arr)=>arr.indexOf(v)===i).sort((x,y)=>x-y);return `<div class="pickrow"><span class="lbl">${p.name}</span><span class="bx">${tones.map(tt=>`<button class="${k===a&&tt===t?'cur':''}" style="background:${tone(k,tt)}" title="${p.name} ${tt}" data-act="setalias" data-role="${roleId}" data-pal="${k}" data-tone="${tt}"></button>`).join('')}</span></div>`}).join('');
  popAt(el,`<button class="btn sm ghost close" data-act="closepop" aria-label="Close"><span class="icon">close</span></button><h4>color.${roleId} · ${S.mode}</h4><div class="small muted" style="margin-bottom:8px">Points at <b>${S.palettes[a].name} ${t}</b>. Pick another tone. Switch the preview to ${S.mode==='light'?'dark':'light'} to set that mode.</div>${rows}`);}
function facePop(el,typeId){const t=S.type.find(x=>x.id===typeId);popAt(el,`<h4>type.${typeId}</h4><div class="small muted" style="margin-bottom:8px">Which type face it uses. Size and weight are edited on the Type page.</div>${['brand','plain'].map(f=>`<button class="btn sm" style="margin:2px" data-act="setface" data-type="${typeId}" data-v="${f}" ${t.face===f?'aria-pressed="true"':''}>${f==='brand'?'Brand':'Plain'} · ${S.faces[f]}</button>`).join('')}`);}

/* ================= Events ================= */
function goPage(i,keep){S.page=clamp(i,0,PAGES.length-1);S.edit=null;S.tryRole=null;if(keep)S.sel=keep;render();}
function selectTok(tok,page){
  // Type page: clicking a type role places it in the selected slot.
  if(tok.startsWith('type.')&&PAGES[S.page].id==='type'){S.typeSlots[S.activeSlot]=tok.slice(5);S.tryRole=null;S.sel=tok;render();return;}
  S.sel=S.sel===tok?null:tok;
  if(S.sel){applyVars();const canvas=document.getElementById('canvas');const set=expand(tok);const here=canvas&&[...canvas.querySelectorAll('[data-t]')].some(e=>e.dataset.t.split(' ').some(t=>set.has(t)));
    if(!here){const u=usage(tok).sort((a,b)=>b.n-a.n);const target=u.length?u[0].i:pageIdx(page);if(target>=0&&target!==S.page){S.page=target;S.edit=null;}}}
  render();
}
function wireTokens(){
  const tb=document.getElementById('treebody');if(!tb)return;
  tb.querySelectorAll('.tok').forEach(el=>{
    el.addEventListener('mouseenter',()=>{S.hover=el.dataset.tok;el.classList.add('hov');
      if(el.dataset.tok.startsWith('type.')&&PAGES[S.page].id==='type'){S.tryRole=el.dataset.tok.slice(5);updateTrySlot();}
      refreshHl();});
    el.addEventListener('mouseleave',()=>{S.hover=null;el.classList.remove('hov');if(S.tryRole){S.tryRole=null;updateTrySlot();}refreshHl();});
  });
  tb.querySelectorAll('details.grp').forEach(d=>d.addEventListener('toggle',()=>{if(treeFilter)return;openGroups[d.dataset.key]=d.open;localStorageSet('dl-open',JSON.stringify(openGroups));}));
  const f=document.getElementById('tfind');if(f)f.addEventListener('input',()=>{treeFilter=f.value.trim().toLowerCase();const pos=f.selectionStart;render();const nf=document.getElementById('tfind');nf.focus();nf.setSelectionRange(pos,pos);});
  // ladder rows: hover tries the role in the selected slot
  document.querySelectorAll('.lrow').forEach(el=>{el.addEventListener('mouseenter',()=>{S.tryRole=el.dataset.type;updateTrySlot();});el.addEventListener('mouseleave',()=>{S.tryRole=null;updateTrySlot();});});
  wireBezier();wireDnd();
}
function updateTrySlot(){const k=S.activeSlot;const el=document.querySelector(`.slot[data-slot="${k}"]`);if(!el)return;const role=S.tryRole||S.typeSlots[k];const inner=el.lastElementChild;inner.style.font=`var(--ty-${role})`;inner.style.letterSpacing=`var(--ls-${role})`;el.classList.toggle('trying',!!S.tryRole);el.querySelector('.schip').textContent=`${k} · ${typeName(role)}${S.tryRole?' (trying)':''}`;}
function wireBezier(){document.querySelectorAll('svg[data-bez]').forEach(svg=>{const k=svg.dataset.bez;svg.querySelectorAll('circle[data-h]').forEach(c=>{c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);const h=+c.dataset.h;
  const move=ev=>{const r=svg.getBoundingClientRect();const sx=160/r.width,sy=120/r.height;const x=clamp(((ev.clientX-r.left)*sx-14)/132,0,1);const y=clamp((120-14-(ev.clientY-r.top)*sy)/92,-.5,1.5);const a=S.easing[k];a[h*2]=+x.toFixed(2);a[h*2+1]=+y.toFixed(2);
    const p=bezPath(a);svg.querySelector('path').setAttribute('d',p.d);c.setAttribute('cx',p.x(a[h*2]));c.setAttribute('cy',p.y(a[h*2+1]));const ln=svg.querySelectorAll('line')[h];ln.setAttribute('x2',p.x(a[h*2]));ln.setAttribute('y2',p.y(a[h*2+1]));document.querySelector(`[data-out="bez:${k}"]`).textContent=`cubic-bezier(${a.join(', ')})`;applyVars();};
  const up=()=>{c.removeEventListener('pointermove',move);c.removeEventListener('pointerup',up);render();};c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);});});});}
function play(){const e=document.getElementById('dotE'),s=document.getElementById('dotS');if(!e)return;const lane=e.parentElement;const dist=lane.clientWidth-44;
  e.style.transition='none';e.style.transform='translateX(0)';void e.offsetWidth;e.style.transition=`transform ${S.durations[S.durPick]}ms ${bez(S.easing[S.motionPick])}`;e.style.transform=`translateX(${dist}px)`;
  const sp=springPts();const t0=performance.now();const dur=sp.Tm*1000;const step=now=>{const t=Math.min((now-t0)/1000,sp.Tm);s.style.transform=`translateX(${sp.f(t)*dist}px)`;if(t<sp.Tm)requestAnimationFrame(step);};requestAnimationFrame(step);}
/* Drag and drop demo: pointer and keyboard */
function announce(t){const l=document.getElementById('live');l.textContent='';setTimeout(()=>l.textContent=t,30);}
let kb=null;
function wireDnd(){const list=document.getElementById('dnd');if(!list)return;
  list.querySelectorAll('.ditem').forEach(el=>{
    el.addEventListener('pointerdown',e=>{if(e.button!==0)return;const delay=e.pointerType==='touch'?S.drag.delay:0;let timer=setTimeout(()=>start(e),delay);const cancel=()=>{clearTimeout(timer);el.removeEventListener('pointerup',cancel);};el.addEventListener('pointerup',cancel);
      function start(ev){el.removeEventListener('pointerup',cancel);const lr=list.getBoundingClientRect(),r=el.getBoundingClientRect();const off=ev.clientY-r.top;const ph=document.createElement('div');ph.className='dph'+(S.drag.indicator==='line'?' line':'');el.after(ph);
        el.classList.add('lifted');el.style.top=(r.top-lr.top)+'px';el.style.boxShadow=`var(--el${S.drag.lift})`;el.style.transform=`scale(${S.drag.scale})`;el.setPointerCapture(ev.pointerId);announce(`Picked up ${el.textContent}.`);
        const mv=m=>{el.style.top=(m.clientY-lr.top-off)+'px';const others=[...list.querySelectorAll('.ditem:not(.lifted)')];let placed=false;for(const o of others){const orr=o.getBoundingClientRect();if(m.clientY<orr.top+orr.height/2){o.before(ph);placed=true;break;}}if(!placed)list.appendChild(ph);};
        const upH=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',upH);const order=[...list.children].filter(c=>c!==el).map(c=>c===ph?el:c).filter(c=>c.classList&&c.classList.contains('ditem'));S.dndItems=order.map(o=>S.dndItems[+o.dataset.di]);announce(`Dropped. Position ${order.indexOf(el)+1} of ${order.length}.`);render();};
        el.addEventListener('pointermove',mv);el.addEventListener('pointerup',upH);}
    });
    el.addEventListener('keydown',e=>{const i=+el.dataset.di;
      if(e.key===' '){e.preventDefault();if(kb===null){kb={from:i,orig:[...S.dndItems]};el.classList.add('kb');el.style.boxShadow=`var(--el${S.drag.lift})`;announce(`Picked up ${S.dndItems[i]}. Position ${i+1} of ${S.dndItems.length}. Arrows to move, Space to drop, Escape to cancel.`);}else{const name=S.dndItems[i];kb=null;render();focusDi(S.dndItems.indexOf(name));announce(`Dropped ${name}. Position ${S.dndItems.indexOf(name)+1}.`);}}
      else if(kb!==null&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const j=clamp(i+(e.key==='ArrowDown'?1:-1),0,S.dndItems.length-1);if(j===i)return;const it=S.dndItems.splice(i,1)[0];S.dndItems.splice(j,0,it);render();focusDi(j,true);announce(`${it}. Position ${j+1} of ${S.dndItems.length}.`);}
      else if(kb!==null&&e.key==='Escape'){S.dndItems=kb.orig;kb=null;render();announce('Cancelled. Back where it was.');}
    });
  });
  function focusDi(j,held){const el=document.querySelector(`#dnd .ditem[data-di="${j}"]`);if(el){el.focus();if(held){el.classList.add('kb');el.style.boxShadow=`var(--el${S.drag.lift})`;}}}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(!e.target.closest('.pop,.menu'))closePop();return;}
  const a=t.dataset.act,d=t.dataset;
  if(a!=='box'&&!t.closest('.pop,.menu'))closePop();
  switch(a){
    case'tab':S.tab=d.v;S.hover=null;render();break;
    case'mode':S.mode=d.v;render();break;
    case'width':S.width=d.v;render();break;
    case'page':goPage(+d.i,d.keep);break;
    case'prev':goPage(S.page-1);break;
    case'next':goPage(S.page+1);break;
    case'box':{e.stopPropagation();boxPop(t,d.pal,+d.tone);break;}
    case'closepop':closePop();break;
    case'unpin':delete S.palettes[d.pal].pins[+d.tone];closePop();render();break;
    case'makekey':{const p=S.palettes[d.pal];p.key=tone(d.pal,+d.tone);delete p.pins[+d.tone];p.keyTone=+d.tone;closePop();render();break;}
    case'alias':e.stopPropagation();aliasPop(t,d.role);break;
    case'roletile':S.sel='color.'+d.role;render();{const el=document.querySelector(`.tok[data-tok="color.${d.role}"] .alias`);if(el){el.scrollIntoView({block:'nearest'});aliasPop(el,d.role);}}break;
    case'setalias':{const r=S.roles.find(x=>x.id===d.role);r[S.mode==='dark'?'dark':'light']=[d.pal,+d.tone];closePop();render();break;}
    case'facepick':e.stopPropagation();facePop(t,d.type);break;
    case'setface':S.type.find(x=>x.id===d.type).face=d.v;closePop();render();break;
    case'typerow':S.edit=S.edit&&S.edit.kind==='type'&&S.edit.id===d.type?null:{kind:'type',id:d.type};render();break;
    case'slot':S.activeSlot=d.slot;S.tryRole=null;render();break;
    case'corner':S.edit=S.edit&&S.edit.id===d.corner?null:{kind:'corner',id:d.corner};render();break;
    case'elev':S.edit=S.edit&&S.edit.kind==='elev'&&S.edit.id===d.level?null:{kind:'elev',id:d.level};render();break;
    case'elevfill':{e.stopPropagation();const lv=+d.level;popAt(t,`<h4>Level ${lv} fill</h4><div class="small muted" style="margin-bottom:6px">A surface role.</div>${S.roles.filter(r=>r.id.startsWith('surface')).map(r=>`<button class="btn sm" style="margin:2px" data-act="setfill" data-level="${lv}" data-v="${r.id}"><span class="sw" style="background:${roleHex(r.id)}"></span>${r.id.replace('surface-container','container')}</button>`).join('')}`);break;}
    case'setfill':S.elevation[+d.level].fill=d.v;closePop();render();break;
    case'mpick':S.motionPick=d.k;render();break;
    case'dpick':S.durPick=d.k;render();break;
    case'play':play();break;
    case'history':openDrawer(`<div class="row"><h2>Token history</h2><button class="btn sm ghost push" data-act="closedrawer" aria-label="Close"><span class="icon">close</span></button></div><p class="small muted">Every change to the token set is a revision, like any other record. Components record which token revision they were checked against.</p>${[['r14','Tertiary key to amber #c77d12; brand face Fraunces','Owner · 2026-09-23',1],['r13','Elevation shadows softened (opacity −0.04)','Design lead · 2026-09-19'],['r12','Surface containers remapped for dark mode','Design lead · 2026-09-14'],['r11','Drag and drop: lift to level 3, 250ms touch hold','Design lead · 2026-09-10'],['r10','Adopted Material 3 baseline','Aludel template · 2026-08-12']].map(([r,w,who,cur])=>`<div class="rev ${cur?'cur':''}"><span class="r">${r}</span><span>${w}${cur?' <span class="chip design">current</span>':' <button class="btn sm ghost">Compare</button>'}<small>${who}</small></span></div>`).join('')}`);break;
    case'closedrawer':closeDrawer();break;
    case'comp':S.comp=d.id;S.child=null;S.cstate='enabled';render();break;
    case'child':e.stopPropagation();S.child=+d.i<0?null:+d.i;render();break;
    case'prop':{const v=d.v==='true'?true:d.v==='false'?false:d.v;setProp(d.path,d.key,v);render();break;}
    case'cstate':S.cstate=d.v;render();break;
    case'cmode':S.cmode=d.v;render();break;
    case'additem':if(NAVITEMS.length<7){NAVITEMS.push({label:'Saved',icon:'favorite',badge:'',selected:false});S.child=NAVITEMS.length-1;}render();break;
    case'addcomp':{e.stopPropagation();popAt(t,`<h4>Add a component</h4><div class="small muted" style="margin-bottom:8px">A name is enough. It starts as <b>needed</b>; specify and build it later.</div><div class="row"><input type="text" id="newc" placeholder="e.g. Rating stars" style="width:170px;font-family:inherit"><button class="btn sm primary" data-act="createcomp">Add</button></div>`);setTimeout(()=>document.getElementById('newc').focus(),0);break;}
    case'createcomp':{const n=document.getElementById('newc').value.trim()||'New component';const id='c'+Date.now();C[id]={name:n,group:'Containment',status:'needed',purpose:'Added just now.',note:'',props:{},spec:[],anatomy:[],a11y:[],refs:[],revs:[['r1','Added as needed','You · just now',1]],built:null};S.comp=id;S.child=null;closePop();render();break;}
    case'asset':S.brandOpen=d.id;openDrawer(brandDrawer(BRAND.find(x=>x.id===d.id)));break;
    case'tplmenu':{e.stopPropagation();const m=popAt(t,[['mail','Email header','600×200 banner with the logo and tagline'],['campaign','Social banner','1500×500, for profiles'],['phone_iphone','App store screenshots','Five frames from your sample screens'],['badge','Business card','Print, 85×55 mm']].map(([i,n,s])=>`<button data-act="closepop"><span class="icon">${i}</span><span><b>${n}</b><small>${s}. Adds stock assets you can change or remove.</small></span></button>`).join(''),'menu');break;}
    case'doc':{const doc=DOCS.find(x=>x.id===d.id);openDrawer(`<div class="row"><span class="chip lib"><span class="icon">local_library</span>Library document</span><button class="btn sm ghost push" data-act="closedrawer" aria-label="Close"><span class="icon">close</span></button></div><h2>${doc.title}</h2><div class="row wrap tiny muted">${doc.agents?'<span class="chip info"><span class="icon">smart_toy</span>Agents read</span>':''}Shows in ${doc.shows.join(', ')} · updated ${doc.updated}</div><div class="docbody">${doc.body}</div>`);break;}
    case'notes':openDrawer(notesHTML());break;
    case'goto':{closeDrawer();const [tab,x]=d.v.split(':');S.tab=tab;if(tab==='tokens'&&x)S.page=pageIdx(x);if(tab==='components'&&x){S.comp=x;S.child=null;}render();break;}
  }
});
function setProp(path,key,v){if(path==='comp')C[S.comp].props[key]=v;else{const[kind,i]=path.split(':');if(kind==='nav'){if(key==='selected'&&v)NAVITEMS.forEach(n=>n.selected=false);NAVITEMS[+i][key]=v;}else if(kind==='cardact')CARDACTS[+i][key]=v;}}
document.addEventListener('input',e=>{const t=e.target;const d=t.dataset;if(!d.in)return;const v=t.value;
  switch(d.in){
    case'boxcolor':case'boxhex':{if(!/^#[0-9a-f]{6}$/i.test(v))return;const p=S.palettes[d.pal];const tt=+d.tone;if(tt===p.keyTone)p.key=v;else p.pins[tt]=v;applyVars();
      const pop=t.closest('.pop');pop.querySelector(d.in==='boxcolor'?'[data-in=boxhex]':'[data-in=boxcolor]').value=v;pop.querySelector('[data-out=crw]').textContent=contrast(v,'#ffffff').toFixed(1)+':1';pop.querySelector('[data-out=crb]').textContent=contrast(v,'#000000').toFixed(1)+':1';
      document.querySelectorAll(`.box[data-pal="${d.pal}"]`).forEach(b=>{const h=tone(d.pal,+b.dataset.tone);b.style.background=h;b.style.color=readable(h);});break;}
    case'tsize':case'tline':case'tweight':case'ttrack':{const ty=S.type.find(x=>x.id===d.id);ty[{tsize:'size',tline:'line',tweight:'weight',ttrack:'track'}[d.in]]=+v;applyVars();const o=document.querySelector(`[data-out="${d.in}:${d.id}"]`);if(o)o.textContent=v+(d.in==='tweight'?'':'px');break;}
    case'corner':S.corners[d.id]=d.id==='full'&&+v>=20?999:+v;applyVars();{const o=document.querySelector(`[data-out="corner:${d.id}"]`);if(o)o.textContent=v+'px';}break;
    case'ey':case'eb':case'ea':S.elevation[+d.id][{ey:'y',eb:'blur',ea:'a'}[d.in]]=+v;applyVars();document.querySelectorAll('.ecard').forEach(c=>c.style.boxShadow=elevShadow(+c.dataset.level,S.elevBase));{const o=document.querySelector(`[data-out="${d.in}:${d.id}"]`);if(o)o.textContent=v+(d.in==='ea'?'':'px');}break;
    case'sl':S.stateLayers[d.id]=+v;applyVars();document.querySelector(`[data-out="sl:${d.id}"]`).textContent=v;break;
    case'icon':S.icons[d.id]=+v;applyVars();document.querySelector(`[data-out="icon:${d.id}"]`).textContent=v;break;
    case'stiff':S.spring.stiffness=+v;break;
    case'damp':S.spring.damping=+v;break;
    case'dscale':S.drag.scale=+v;break;
    case'ddelay':S.drag.delay=+v;break;
    case'prop':if(t.tagName==='INPUT'){setProp(d.path,d.key,v);const cc=document.getElementById('ccanvas');if(cc)cc.innerHTML=stageHTML(S.comp);}break;
  }});
document.addEventListener('change',e=>{const t=e.target;const d=t.dataset;if(!d.in)return;const v=t.value;
  switch(d.in){
    case'face':S.faces[d.face]=v;break;
    case'tface':S.type.find(x=>x.id===d.type).face=v;break;
    case'ebase':S.elevBase=+v;break;
    case'erule':S.elevRule=v;break;
    case'dlift':S.drag.lift=+v;break;
    case'dind':S.drag.indicator=v;break;
    case'prop':setProp(d.path,d.key,v);break;
    case'boxcolor':case'boxhex':return;
  }
  render();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closePop();closeDrawer();}
  const tok=e.target.closest&&e.target.closest('.tok');
  if(tok&&(e.key==='Enter'||e.key===' ')&&!e.target.closest('.alias')){e.preventDefault();selectTok(tok.dataset.tok,tok.dataset.page);}
  if(e.target.closest&&e.target.closest('.box')&&['ArrowLeft','ArrowRight'].includes(e.key)){const b=e.target.closest('.box');const n=e.key==='ArrowRight'?b.nextElementSibling:b.previousElementSibling;if(n)n.focus();}
  if(S.tab==='tokens'&&!e.target.closest('input,select,textarea,.ditem,.box')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.target.closest('.tok')){goPage(S.page+(e.key==='ArrowRight'?1:-1));}
  const ci=e.target.closest&&e.target.closest('.ci,.doc');if(ci&&(e.key==='Enter'||e.key===' ')){e.preventDefault();ci.click();}
});
document.addEventListener('click',e=>{const tok=e.target.closest('.tok');if(tok&&!e.target.closest('.alias'))selectTok(tok.dataset.tok,tok.dataset.page);},true);

function notesHTML(){const rows=[
  ['D1','Three tiers in W3C tokens; Material 3 is the starting set','tokens:palettes'],['D2','Brand assets','brand'],['D3','Interactive components with a variant panel','components:button'],['D4','Tree and live preview','tokens:roles'],
  ['D5','Contract in Design, binding in Platform ("Built with")','components:card'],['D6','No code in the editing surface','tokens:shape'],['D7','Two panes on Tokens, no inspector','tokens:palettes'],['D8','Hover a token: outlines and labels; "isn\'t on this page" note','tokens:sample-browse'],
