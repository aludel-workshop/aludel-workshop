    const list = arr => arr.length ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="muted small">None</p>';

      <h3>Problem</h3><p>${esc(spec.problem)}</p><h3>Appetite</h3><p>${esc(spec.appetite)}</p><h3>Solution sketch</h3><p>${esc(spec.solution)}</p><h3>Rabbit holes</h3>${list(spec.rabbit)}<h3>No-gos</h3>${list(spec.nogos)}
      <h3>Requirements</h3>${spec.reqs.map(r => `<p><span class="req">${esc(r.slice(0, 6))}</span> ${esc(r.slice(7))}</p>`).join('')}<h3>Key entities</h3>${list(spec.entities)}<h3>Success criteria</h3>${list(spec.success)}<h3>Assumptions</h3>${list(spec.assumptions)}
      ${spec.clar.length ? `<h3>Clarifications</h3>${spec.clar.map(c => `<p class="clar">${esc(c)} <a href="#/work/item/W-13">Answer</a></p>`).join('')}` : ''}</article>
      <aside class="card side connected" aria-labelledby="spc"><h2 id="spc">Connected</h2><h3>Stories</h3>${spec.stories.map(sid => { const s = stories.find(x => x.id === sid); return `<a href="#/product/map/${sid}">${stepper(s.status)} ${esc(s.title)}</a>`; }).join('')}<h3>Next</h3><a href="#/work/item/W-15">${icon('architecture')}Technical plan (Platform)</a><h3>Format</h3><p class="small muted">Shape Up pitch (problem, appetite, solution, rabbit holes, no-gos) plus spec-driven requirements, entities and success criteria.</p></aside></div>`;
  }
  if (section === 'research') return head + `<p class="lead">Evidence behind needs and stories. Opportunities should come from real stories people tell, not guesses.</p><div class="grid g2">${research.map(r => `<section class="card"><h2>${esc(r.title)}</h2><p class="muted small">${r.date}</p><blockquote style="margin:0 0 10px;font-style:italic">${esc(r.note)}</blockquote><p class="small">${icon('link')} Supports <a href="#/product/vision">${esc(r.supports)}</a></p></section>`).join('')}<section class="card quiet"><h2>${icon('add')} Add research</h2><p class="muted small">Interview notes, observations, competitor notes, analytics excerpts.</p></section></div>`;

  return head + `<div class="grid g2">
    <section class="card wide" aria-labelledby="vs"><h2 id="vs">Vision</h2><p style="font-size:20px;margin:0">Every street has the tools it needs, shared between neighbours instead of bought and forgotten.</p><p class="muted small">From your pitch during onboarding · rev 2</p></section>

    <section class="card" aria-labelledby="nd"><h2 id="nd">Needs and opportunities</h2><ul><li>Use a tool once without buying it <span class="small muted">· 1 interview</span></li><li>Lenders feel safe: know who has it and that it comes back <span class="small muted">· 1 interview</span></li></ul></section>
    <section class="card" aria-labelledby="sc"><h2 id="sc">Standout capabilities</h2><ol><li>Find a tool within walking distance</li><li>Ask and arrange in one place</li><li>Built-in trust between neighbours</li></ol></section>

  </div>`;

function storyMap(selected) {
  const columns = activities.flatMap(a => a.steps.map((step, index) => ({ activity: a.id, step: index, label: step })));
  const colOf = (activity, step) => columns.findIndex(c => c.activity === activity && c.step === step) + 1;
  let html = `<div class="personas" aria-label="Users">${personas.map(p => `<span class="persona"><span class="avatar" aria-hidden="true">${p.name[0]}</span><span><strong>${p.name}</strong><small>${p.role}</small></span></span>`).join('')}<span class="small muted" style="align-self:center">Story packs you picked in onboarding are marked; their stories are yours to change.</span></div>`;
  html += `<div class="map-wrap" tabindex="0" role="region" aria-label="Story map"><div class="storymap" style="grid-template-columns:repeat(${columns.length}, 210px)">`;
  let start = 1;
  for (const a of activities) { html += `<div class="activity" style="grid-column:${start} / span ${a.steps.length}"><span>${esc(a.title)} <small>· ${esc(a.persona)}</small></span>${a.pack ? `<span class="pack">${esc(a.pack)} pack</span>` : ''}</div>`; start += a.steps.length; }
  columns.forEach(c => { html += `<div class="step">${esc(c.label)}</div>`; });
  for (const phase of phases) {
    const list = stories.filter(s => s.phase === phase.id);
    html += `<div class="band ${phase.current ? 'current' : ''}"><strong>${phase.label}</strong> ${esc(phase.goal)}</div>`;
    columns.forEach((c, index) => {
      const cellStories = list.filter(s => s.activity === c.activity && s.step === c.step);
      html += `<div class="cell" style="grid-column:${index + 1}">${cellStories.map(s => `<a class="card-story ${s.status === 'built' ? 'built' : ''} ${s.id === selected ? 'active' : ''}" href="#/product/map/${s.id}">${esc(s.title)}<span class="meta"><span class="dot" style="background:${statusColor[s.status]}"></span>${statusLabel[s.status]}${s.template ? ' · template' : ''}${s.clarifications.length ? ` · ${icon('help')}` : ''}</span></a>`).join('')}</div>`;
    });
  }
  html += `</div></div><div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn ghost small">${icon('add')}Add activity</button><button class="btn ghost small">${icon('add')}Add story</button><button class="btn ghost small">${icon('inventory_2')}Add a story pack</button><span class="small muted">Dreamer: the Product lead drafts new stories from a sentence; you review.</span></div>`;
  return html;
}

    <p class="origin">Origin: ${esc(s.origin)}${s.template ? ' · built by the Aludel template; change it like any other story' : ''}</p>

    <h3>Pages</h3>${s.pages.length ? s.pages.map(pid => { const p = pages.find(x => x.id === pid); return `<a href="#/pages/tree/${pid}">${icon(p.icon)}${esc(p.label)} <span class="small muted">${esc(p.status)}</span></a>`; }).join('') : '<p class="small muted">No page yet</p>'}

    <h3>Data</h3>${[...objects.filter(o => o.stories.includes(s.id)).map(o => `<a href="#/data/objects/${o.id}">${icon('schema')}${o.name} ${dataChip(o.status)}</a>`), ...ops.filter(o => o.stories.includes(s.id)).map(o => `<a href="#/data/api/${o.id}"><span class="method m-${o.method}">${o.method}</span>${o.id}</a>`)].join('') || '<p class="small muted">No data yet</p>'}
    <h3>Work</h3>${s.work.length ? s.work.map(wid => { const w = work.find(x => x.id === wid); return w ? `<a href="#/work/item/${wid}">${esc(w.title)} <span class="chip ${stateChip[w.state]}">${stateLabel[w.state]}</span></a>` : ''; }).join('') : '<p class="small muted">None</p>'}
    <h3>Built by</h3>${builtBy(s.id)}
    <h3>Why it is this way</h3>${s.history.length ? `<div class="history">${s.history.map(h => `<p>${esc(h.text)}<br><small>${h.date} · from <a href="#/work/item/${h.source}">${h.source}</a></small></p>`).join('')}</div>` : '<p class="small muted">No decisions yet.</p>'}</div></aside>`;
}

function design([section = 'foundations']) {
  const head = `<p class="eyebrow">Design · the design system</p><h1>Tool Share's design system</h1>` + tabs('design', [['foundations', 'Foundations'], ['components', 'Components'], ['patterns', 'Patterns'], ['guidelines', 'Guidelines'], ['sources', 'Sources & changes']], section);
  if (section === 'components') return head + `<div class="table-wrap" tabindex="0" role="region" aria-label="Components"><table><thead><tr><th>Component</th><th>Maturity</th><th>Used on</th></tr></thead><tbody>${components.map(([n, m, u]) => `<tr><td><strong>${n}</strong></td><td><span class="chip ${m.startsWith('Stable') ? 's-ok' : m.startsWith('Proposed') ? 's-warn' : 's-plain'}">${m}</span></td><td>${u}</td></tr>`).join('')}</tbody></table></div><p class="small muted">Each component has a contract: purpose, anatomy, variants, states, accessibility. Proposed → incubating → stable → deprecated.</p>`;
  if (section === 'patterns') return head + `<div class="grid g2"><section class="card"><h2>Page types</h2><p class="small muted">Archetypes the page tree and the scaffold both use.</p><ul class="list">${[['Feed', 'Stream of posts or updates'], ['Gallery', 'Image-led cards to browse'], ['Detail', 'Everything about one thing'], ['Messages', 'Conversations and a thread'], ['Form', 'Collect information'], ['Dashboard', 'Numbers and activity at a glance']].map(([n, d]) => `<li class="item"><span class="body"><span class="title">${n}</span><small>${d}</small></span></li>`).join('')}</ul></section><section class="card"><h2>Interaction rules</h2><ul><li>Primary actions sit in the thumb zone on phones.</li><li>Destructive actions confirm in place, never in a modal chain.</li><li>Lists open details as a page on phones, a side panel on desktop.</li><li>Navigation: bottom tabs (≤5) on phones, top bar on desktop.</li></ul></section></div>`;
  if (section === 'guidelines') return head + `<div class="grid g2"><section class="card"><h2>Voice</h2><p>Neighbourly and plain. “Ask Priya” rather than “Submit request”.</p></section><section class="card"><h2>Accessibility baseline</h2><ul><li>WCAG 2.2 AA; text contrast 4.5:1 (the primary colour is derived to meet it)</li><li>Every action reachable by keyboard</li><li>Touch targets at least 44px</li></ul></section><section class="card quiet"><h2>${icon('add')} Add guidance</h2><p class="small muted">Free-form pages for anything else: photography, illustration, motion.</p></section></div>`;
  if (section === 'sources') return head + `<div class="grid g2"><section class="card"><h2>Sources</h2><dl class="kv"><dt>Base system</dt><dd>Material Design 3 via Angular Material 22</dd><dt>Starting feel</dt><dd>Aludel “Mobile-first social” (onboarding)</dd><dt>Token format</dt><dd>DTCG 2025.10</dd></dl></section><section class="card"><h2>Deviations</h2><table><thead><tr><th>Change</th><th>Why</th></tr></thead><tbody><tr><td>Primary derived from accent</td><td>Keep brand pink while meeting 4.5:1</td></tr><tr><td>Card radius 22px</td><td>Feel: rounded, friendly</td></tr></tbody></table></section><section class="card"><h2>Changes</h2><ul class="list"><li class="item"><span class="body"><span class="title">Tool card</span><small>Proposed Sep 21 from W-08 · incubating</small></span></li><li class="item"><span class="body"><span class="title">Date range picker</span><small>Needed by SPEC-01 · proposed</small></span></li></ul></section></div>`;
  return head + `<div class="grid g2"><section class="card"><h2>Principles</h2><ol><li>Warm and neighbourly, never corporate.</li><li>Photos first: tools are recognised by sight.</li><li>One-handed on phones.</li></ol></section><section class="card"><h2>Colour</h2><div class="swatches">${[['#e0457b', 'Accent'], ['#ca3e6f', 'Primary'], ['#fff7fa', 'Surface'], ['#170f13', 'Surface dark'], ['#fbdbe6', 'Container']].map(([h, l]) => `<div class="swatch"><i style="background:${h}"></i><span><strong>${h}</strong><br>${l}</span></div>`).join('')}</div></section>
    <section class="card wide"><h2>Tokens</h2><div class="table-wrap" tabindex="0" role="region" aria-label="Tokens"><table><thead><tr><th>Token</th><th>$type</th><th>$value</th><th>Note</th></tr></thead><tbody>${tokens.map(([n, t, v, d]) => `<tr><td><code>${n}</code></td><td>${t}</td><td>${t === 'color' && v.startsWith('#') ? `<span class="token-swatch" style="background:${v.slice(0, 7)}"></span>` : ''}<code>${esc(v)}</code></td><td class="small">${d}</td></tr>`).join('')}</tbody></table></div><p class="small muted">Stored in the W3C Design Tokens format, so they move to and from Figma, Penpot or Tokens Studio.</p></section></div>`;
}

function phoneMock(kind, active) {
  const rows = n => Array.from({ length: n }, () => '<div class="rowish"><span class="dot"></span><div style="flex:1;display:grid;gap:4px"><div class="bar"></div><div class="bar w4"></div></div></div>').join('');
  const body = kind === 'Gallery' ? '<div class="pill"></div><div class="tiles"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>' : kind === 'map' ? `<div class="pill"></div><div class="map"></div>${rows(3)}` : kind === 'Detail' ? '<div class="tile" style="height:110px"></div><div class="bar w6"></div><div class="bar"></div><div class="bar w4"></div>' : kind === 'Form' ? '<div class="bar w6"></div><div class="pill"></div><div class="pill"></div><div class="pill"></div><div class="tile" style="height:30px;width:50%"></div>' : kind === 'Messages' ? `${rows(4)}` : `<div class="tile" style="height:70px"></div>${rows(3)}`;
  return `<div class="phone" aria-hidden="true"><header><b>TS</b>Tool Share</header><main>${body}</main><footer>${['Home', 'Browse', 'Messages', 'Profile'].map(l => `<span class="${l === active ? 'on' : ''}">${l}</span>`).join('')}</footer></div>`;
}

function pagesLayer([section = 'tree', id = 'browse']) {
  const head = `<p class="eyebrow">Pages · where the product happens</p><h1>Tool Share's pages</h1>` + tabs('pages', [['tree', 'Page tree'], ['flows', 'Flows']], section);
  if (section === 'flows') return head + `<p class="lead">One flow per story-map activity: the path someone takes across pages.</p>${[['Find a tool', ['browse', 'tool']], ['Borrow', ['browse', 'tool', 'messages']], ['Talk it over', ['tool', 'thread', 'messages']], ['Lend my tools', ['profile', 'list']], ['Join', ['signin', 'home']]].map(([t, ids]) => `<section class="card" style="margin-bottom:12px"><h2 style="font-size:18px">${t}</h2><div class="flow">${ids.map((pid, i) => { const p = pages.find(x => x.id === pid); return `${i ? icon('arrow_forward') : ''}<a href="#/pages/tree/${pid}">${esc(p.label)}</a>`; }).join('')}</div></section>`).join('')}`;
  const page = pages.find(p => p.id === id) || pages[1];
  const tree = list => `<ul class="tree">${list.map(p => `<li><a href="#/pages/tree/${p.id}" class="${p.id === page.id ? 'active' : ''} ${p.gap ? 'gap' : ''}" ${p.id === page.id ? 'aria-current="page"' : ''}>${icon(p.icon)}${esc(p.label)}${p.gap ? '<span class="small" style="margin-left:auto">gap</span>' : ''}</a>${p.children ? tree(p.children) : ''}</li>`).join('')}</ul>`;
  const question = page.id === 'browse' ? `<div class="question"><h2>${icon('help')} Choose a layout for search results</h2><p class="small muted">Asked in <a href="#/work/item/W-14">W-14</a>. Your answer becomes the next revision of this page, with your reason.</p><div class="canvas">${[['Gallery', 'A · Card grid'], ['map', 'B · Map above a list']].map(([k, l]) => `<figure class="option" style="margin:0">${phoneMock(k, 'Browse')}<figcaption>${l}</figcaption></figure>`).join('')}</div><div class="choices"><a class="btn" href="#/work/item/W-14">Answer in W-14</a></div></div>` : '';
  const canvas = page.gap ? `<div class="card quiet"><h2>${esc(page.label)} isn't designed yet</h2><p class="muted">Realises ${page.stories.map(sid => esc(stories.find(s => s.id === sid).title)).join('; ')}.</p><div class="row"><a class="btn" href="#/work/queue">Start now</a><a class="btn ghost" href="#/work/queue">Add to Work</a></div></div>` : `<div class="canvas">${phoneMock(page.type, ['Home', 'Browse', 'Messages', 'Profile'].includes(page.label) ? page.label : '')}</div>`;
  return head + `<div class="design-grid"><nav aria-label="Page tree" class="card" style="padding:12px">${tree(pageTree)}<a class="btn ghost small" href="#/work/queue" style="margin:10px 0 0 6px">${icon('add')}Add page</a></nav>
    <section aria-labelledby="pg"><div class="row"><h2 id="pg" style="margin:0;font-size:26px">${esc(page.label)}</h2><span class="chip l-pages">${esc(page.type)}</span></div><p class="muted small">${esc(page.status)} · origin: ${esc(page.origin)}</p>${question}${canvas}</section>
    <aside class="card connected" aria-labelledby="pa"><h2 id="pa">About this page</h2>${page.origin.endsWith('pack') ? `<p class="note">Added by the ${esc(page.origin)}. Rename it, move it or merge it like any page; if you delete it, Aludel asks which page takes its stories.</p>` : ''}
      <h3>Stories it realises</h3>${page.stories.length ? page.stories.map(sid => { const s = stories.find(x => x.id === sid); return `<a href="#/product/map/${sid}">${stepper(s.status)} ${esc(s.title)}</a>`; }).join('') : '<p class="small muted">None linked</p>'}
      <h3>Uses</h3><a href="#/design/components">${icon('widgets')}${page.type === 'Messages' ? 'Message bubble · Tab bar' : 'Tool card · Tab bar'}</a>
      <h3>Work on this page</h3>${work.filter(w => w.targets.some(t => t[0] === 'pages' && t[1] === page.id)).map(w => `<a href="#/work/item/${w.id}">${esc(w.title)} <span class="chip ${stateChip[w.state]}">${stateLabel[w.state]}</span></a>`).join('') || '<p class="small muted">None</p>'}
      <h3>Built by</h3>${builtBy(page.id)}
      <h3>States</h3><p class="small muted">Empty · loading · error · signed out</p></aside></div>`;
}

function dataLayer([section = 'objects', id]) {
  const head = `<p class="eyebrow">Data · objects and contracts</p><h1>What Tool Share knows, and how it's asked for</h1><p class="lead">Written so any stack could build it. Objects are JSON Schema; operations are OpenAPI 3.1. How they're built lives in Platform.</p>` + tabs('data', [['objects', 'Objects'], ['api', 'API'], ['access', 'Access'], ['events', 'Events']], section);
  if (section === 'api') return head + apiView(id);
  if (section === 'access') return head + `<p class="small muted">Owner means the lender of a tool, the borrower of a request, or a participant in a conversation.</p><div class="table-wrap" tabindex="0" role="region" aria-label="Access rules"><table><thead><tr><th>Object</th><th>Action</th><th>Visitor</th><th>Member</th><th>Owner</th><th>Rule</th></tr></thead><tbody>${accessRows.map(([o, a, cells, rule]) => `<tr><td><a href="#/data/objects/${objects.find(x => x.name === o).id}">${o}</a></td><td>${a}</td>${cells.map(c => `<td>${effect[c][0] ? `<span class="chip ${effect[c][0]}">${effect[c][1]}</span>` : effect[c][1]}</td>`).join('')}<td class="small">${esc(rule)}</td></tr>`).join('')}</tbody></table></div><p class="small muted">Each rule is a record with a revision; agents read these sentences, and the Reviewer checks builds against them.</p>`;
  if (section === 'events') return head + `<section class="card quiet"><h2>${icon('bolt')} Events come later</h2><p class="muted">Things that happen, which notifications and integrations react to. They appear here once a spec needs one. Likely first:</p><ul class="small"><li><code>BorrowRequest.approved</code>: tell Sam and block the dates (S9)</li><li><code>Message.sent</code>: notify the other person (S14, MVP)</li></ul></section>`;
  const object = objects.find(o => o.id === id) || objects.find(o => o.id === 'tool');
  const byId = Object.fromEntries(objects.map(o => [o.id, o]));
  const edges = [];

function unitView(u) {
  const st = unitState(u);
  const nameOf = ref => ref.startsWith('entry:') ? `${icon('login')}${esc(ref.slice(6))} (entry point)` : (() => { const x = units.find(y => y.id === ref); return `<a href="#/platform/code/${x.id}">${icon(unitIcon[x.kind])}<code>${esc(x.symbol)}</code></a>`; })();
  const explain = { healthy: 'Reachable, and every reason it exists is current.', suspect: 'Something it was built for has changed since. It may need to change too.', untraced: 'Something uses it, but no story or contract says why. Usually glue, which is fine; if it grows, give it a reason.', dead: 'Nothing uses it and nothing needs it. Safe to remove.' };
  return `<p class="eyebrow"><a href="#/platform/code">Code</a> · ${esc(u.path)}</p><div class="row" style="flex-wrap:wrap"><h2 style="margin:0;font-size:26px"><code>${esc(u.symbol)}</code></h2><span class="chip ${unitStateChip[st][0]}">${unitStateChip[st][1]}</span></div><p class="muted">${u.kind} · last changed in <code>${u.commit}</code> · ${explain[st]}</p>
  <div class="grid g-side"><div>
    <section class="card" style="margin-bottom:18px"><h2>Why it exists</h2>${u.links.length ? `<ul class="list">${u.links.map(l => { const [label, href, layer] = recordRef(l[0]); const sus = isSuspect(l); return `<li class="item">${layerChip(layer)}<span class="body"><a href="${href}" class="title">${esc(label)}</a><small>${l[2]} · linked at revision ${l[1]} · from ${esc(l[3])}${sus ? ` · <strong>now revision ${currentRev[l[0]]}</strong>` : ''}</small></span><span class="chip ${sus ? 's-warn' : 's-ok'}">${sus ? 'Suspect' : 'Current'}</span></li>`; }).join('')}</ul>${u.links.some(isSuspect) ? `<p class="clar">Reconcile in <a href="#/work/item/W-17">W-17</a>: the Coding agent plans create / modify / remove, then relinks at the new revision.</p>` : ''}` : `<p class="muted">No links.</p>${st === 'dead' ? `<p class="clar">Suggested: remove it (<a href="#/work/item/W-S4">W-S4</a>). Added in <code>${u.commit}</code>, an abandoned try at ratings (S18, Later).</p>` : ''}`}</section>
    <section class="card"><h2>References</h2><div class="grid g2"><div class="connected"><h3>Calls</h3>${u.calls.map(nameOf).join('') || '<p class="small muted">Nothing</p>'}</div><div class="connected"><h3>Called by</h3>${calledBy(u).map(nameOf).join('') || '<p class="small muted">Nothing: unreachable</p>'}</div></div><p class="small muted">Read from the code after each commit. Nobody maintains these by hand.</p></section>
  </div><aside class="card side connected"><h2>Tests</h2>${units.filter(t => t.kind === 'Test' && t.calls.includes(u.id)).map(t => `<a href="#/platform/code/${t.id}">${icon('fact_check')}${esc(t.symbol)}</a>`).join('') || '<p class="small muted">No test reaches it directly.</p>'}<h3>Work</h3>${work.filter(w => w.targets.some(t => t[1] === u.id)).map(w => `<a href="#/work/item/${w.id}">${esc(w.title)} <span class="chip ${stateChip[w.state]}">${stateLabel[w.state]}</span></a>`).join('') || '<p class="small muted">None</p>'}</aside></div>`;
}

function agentsTab(id) {

    <div class="grid g-side"><div>
      <section class="card" style="margin-bottom:18px"><h2>Instructions</h2><p class="small muted">Read in this order. Each layer is a revisioned record; a work item remembers exactly which revisions it ran with.</p>
        <ol class="bundle"><li><strong>Product principles</strong> <span class="citation">· Product › Vision · every profile</span></li><li><strong>Project instructions</strong> <span class="citation">· Agents › Project · exported to AGENTS.md</span></li><li><strong>Role instructions</strong> <span class="citation">· this profile · rev ${profile.rev}</span><ul class="small">${profile.instructions.map(i => `<li>${esc(i)}</li>`).join('')}</ul></li><li><strong>Work-type guidance</strong> <span class="citation">· ${profile.types.join(', ')}</span></li></ol>

      <section class="card"><h2>Recent work</h2><ul class="list">${mine.map(w => `<li><a class="item" href="#/work/item/${w.id}"><span class="body"><span class="title">${esc(w.title)}</span><small>${w.id} · ${esc(w.type)}</small></span><span class="chip ${stateChip[w.state]}">${stateLabel[w.state]}</span></a></li>`).join('') || '<li class="item muted">None yet</li>'}</ul></section>
    </div><aside class="card side"><h2>Setup</h2><dl class="kv" style="grid-template-columns:110px 1fr"><dt>Account</dt><dd>${account ? `${esc(account.name)} <span class="chip ${account.chip[0]}">${account.chip[1]}</span>` : '<span class="chip s-warn">None</span>'}</dd><dt>Model</dt><dd>${esc(profile.model)}</dd><dt>Takes</dt><dd>${profile.types.join(', ')} work</dd><dt>May write</dt><dd>${profile.writes.map(l => layerChip(l)).join(' ')}</dd><dt>Asks you first</dt><dd class="small">${profile.approval.join('; ') || '—'}</dd><dt>Budget</dt><dd>$0 · spending off</dd></dl>${profile.note ? `<p class="note">${esc(profile.note)}</p>` : ''}<p class="small muted">Anything outside its layers, and any cost, external account or deployment, always comes to you.</p></aside></div>`;
  }
  return `<div class="grid g2"><section class="card"><h2>Accounts</h2><p class="small muted">Connections to AI providers. Profiles pick one; swapping providers never rewrites instructions.</p><ul class="list">${agentAccounts.map(a => `<li class="item">${icon(a.id === 'codex' ? 'terminal' : 'key')}<span class="body"><span class="title">${a.name}</span><small>${a.kind} · ${a.note}</small></span><span class="chip ${a.chip[0]}">${a.chip[1]}</span></li>`).join('')}</ul><button class="btn ghost small">${icon('add')}Connect an account</button></section>
    <section class="card"><h2>Project instructions</h2><p class="small">Tool Share is neighbourly, never transactional. Keep to the principles in Product › Vision; ask before anything costs money.</p><p class="small muted">Every profile reads these after the product principles. Exported to <code>AGENTS.md</code> in the repository on the next commit, so any coding tool reads the same rules.</p><button class="btn ghost small">${icon('edit')}Edit</button></section>
    <section class="card wide"><h2>Profiles</h2><p class="small muted">One per role, each with its own model, instructions and permissions. Working style decides which work each one picks up.</p><div class="table-wrap" tabindex="0" role="region" aria-label="Profiles"><table><thead><tr><th>Profile</th><th>Takes</th><th>Account and model</th><th>May write</th></tr></thead><tbody>${profiles.map(p => { const a = agentAccounts.find(x => x.id === p.account); return `<tr><td><a href="#/work/agents/${p.id}">${icon(p.icon)} ${p.name}</a></td><td class="small">${p.types.join(', ')}</td><td class="small">${a ? `${esc(a.name)} · ${esc(p.model)}` : '<span class="chip s-warn">Needs an account</span>'}</td><td>${p.writes.map(l => layerChip(l)).join(' ')}</td></tr>`; }).join('')}</tbody></table></div><button class="btn ghost small" style="margin-top:10px">${icon('add')}New profile</button></section></div>`;
}

function reconcileSection(item) {

  return `<section class="card" style="margin-bottom:18px" aria-labelledby="rc"><h2 id="rc">${icon('difference')} What changed</h2><p class="small muted">Created automatically when <a href="#/product/map/${s.id}">${s.id}</a> moved from revision ${r.from} to ${r.to} (<a href="#/work/item/W-18">W-18</a>).</p><div class="gwt diff"><b>Then</b> ${r.before.map(([t, k]) => k === 'del' ? `<del>${esc(t)}</del>` : k === 'ins' ? `<ins>${esc(t)}</ins>` : esc(t)).join('')}</div>

    <h3 style="margin-top:14px">Blast radius</h3><p class="small">${icon('code')} ${units.filter(u => u.links.some(l => l[0] === s.id)).length} units linked to ${s.id}, plus ${[...new Set(units.filter(u => u.links.some(l => l[0] === s.id)).flatMap(u => u.calls))].length} they call. <a href="#/platform/code/for/${s.id}">See them in Platform › Code</a></p></section>`;
}

function workLayer([section = 'queue', id]) {
  if (section === 'item') return workItem(id);
  const head = `<p class="eyebrow">Work · the shared bench</p><h1>Everything to do, from every layer</h1><p class="lead">Agents, templates and people pick up items the same way. Questions stay on the item; answers land in the layer they change.</p>` + tabs('work', [['queue', 'Queue'], ['agents', 'Agents'], ['routines', 'Routines'], ['style', 'Working style']], section);
  if (section === 'agents') return head + agentsTab(id);
  if (section === 'routines') return head + `<div class="table-wrap" tabindex="0" role="region" aria-label="Routines"><table><thead><tr><th>Routine</th><th>Layer</th><th>Runs</th><th>Next</th><th>Creates</th></tr></thead><tbody>${[['Product drift check', 'product', 'Weekly', 'Sep 29', 'Define items when built behaviour and stories disagree'], ['Accessibility sweep', 'pages', 'Weekly', 'Sep 26', 'Design items for contrast or focus problems'], ['Dependency updates', 'platform', 'Monthly', 'Oct 1', 'Implement items with previews'], ['Security audit', 'platform', 'Before each release', 'First release', 'Implement items for findings']].map(([t, l, r, n, c]) => `<tr><td><strong>${t}</strong></td><td>${layerChip(l)}</td><td>${r}</td><td>${n}</td><td class="small">${c}</td></tr>`).join('')}</tbody></table></div>`;
  if (section === 'style') return head + `<div class="table-wrap" tabindex="0" role="region" aria-label="Automation by working style"><table><thead><tr><th>Work type</th><th>Dreamer (current)</th><th>Planner</th><th>Tinkerer</th></tr></thead><tbody>${[['Vision and roadmap', 'Agent asks a few questions, then drafts', 'You', 'You'], ['Stories and acceptance', 'Agent drafts · you review', 'You', 'You'], ['Specs', 'Agent drafts · asks only blockers', 'Agent drafts · you review', 'You'], ['Technical plans', 'Agent', 'Agent', 'You'], ['Page designs', 'Agent · asks when options differ', 'Agent · you choose', 'You'], ['Reconcile code after a change', 'Coding agent · you review the plan', 'Coding agent · you review the plan', 'You'], ['Implementation', 'Template if possible, else agent · you review', 'Template if possible, else agent · you review', 'Template if possible, else you'], ['Platform configuration', 'Agent · you approve effects', 'Agent · you approve effects', 'You']].map(r => `<tr>${r.map((c, i) => `<td>${i === 1 ? `<strong>${c}</strong>` : c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:12px">“Agent” means the profile for that work type. Models, instructions and permissions live in <a href="#/work/agents">Agents</a>.</p>`;
  const row = item => `<li><a class="item" href="#/work/item/${item.id}">${layerChip(item.layer)}<span class="body"><span class="title">${esc(item.title)}</span><small>${esc(item.type)} · ${item.targets.map(t => esc(t[2])).join(' · ')}</small></span><span class="who">${whoLabel(item)}</span><span class="chip ${stateChip[item.state]}">${stateLabel[item.state]}</span></a></li>`;
  const group = (states, title, quiet) => { const list = work.filter(w => states.includes(w.state)); if (!list.length) return ''; const inner = `<ul class="list card" style="padding:4px 16px">${list.map(row).join('')}</ul>`; return quiet ? `<details class="quiet"><summary>${title} · ${list.length}</summary>${inner}</details>` : `<div class="section-title"><h2>${title}</h2><span class="count">${list.length}</span></div>${inner}`; };
  return head + group(['needs-input'], 'Needs you') + group(['review'], 'In review') + group(['claimed'], 'In progress') + group(['ready'], 'Ready to pick up') + group(['suggested'], 'Suggested by the layers (not queued yet)', true) + group(['done'], 'Done recently (including template work)', true);
}

function workItem(id) {
  const item = work.find(w => w.id === id) || work[0];
  const story = item.targets.map(t => stories.find(s => s.id === t[1])).find(Boolean);
  const targetPages = [...new Set([...item.targets.filter(t => t[0] === 'pages').map(t => t[1]), ...(story?.pages || [])])].map(pid => pages.find(p => p.id === pid)).filter(Boolean);
  const spec = specs.find(sp => item.targets.some(t => t[1] === sp.id) || (story && sp.stories.includes(story.id)));
  const decisions = item.targets.flatMap(t => stories.find(s => s.id === t[1])?.history || []);
  const bundle = [
    ['Goal', item.title, item.id], story ? ['Story', `${story.title}`, story.id] : null,
    story?.acceptance.length ? ['Acceptance', `${story.acceptance.length} Given/When/Then scenario(s)`, story.id] : null,
    ['Principles', 'Neighbourly, never transactional; rough distance only; one-handed', 'Product › Vision'],
    // Only what this item touches: its pages' components, its spec's entities, its stories' decisions.
    targetPages.length ? ['Design', `Mobile-first social tokens; ${targetPages.map(p => p.type === 'Messages' ? 'Message bubble' : p.type === 'Form' ? 'Form fields' : 'Tool card').filter((v, i, a) => a.indexOf(v) === i).join(', ')}; Tab bar`, `Pages › ${targetPages.map(p => p.label).join(', ')}`] : null,
    ['Technical context', `aludel-web-v1${spec ? `; ${spec.entities.map(e => e.split(' (')[0]).join(', ')}` : ''}`, spec ? `Platform › Architecture, ${spec.id}` : 'Platform › Architecture'],
    decisions.length ? ['Decisions so far', decisions.map(d => d.text).join(' '), decisions.map(d => d.source).join(', ')] : null,
    ['Will document', item.documents.join('; ') || 'Set when staged', 'This item']
  ].filter(Boolean);
  const who = item.who;
  return `<p class="eyebrow"><a href="#/work/queue">Work</a> · ${item.id}</p><div class="row" style="flex-wrap:wrap"><h1 style="margin:0">${esc(item.title)}</h1>${layerChip(item.layer)}<span class="chip ${stateChip[item.state]}">${stateLabel[item.state]}</span></div><p class="muted">${esc(item.type)} work from the ${layerName[item.layer]} layer</p>
  <div class="grid g-side"><div>
    ${item.question ? `<section class="question" aria-labelledby="qq"><h2 id="qq">${icon('help')} ${esc(item.question)}</h2>${item.id === 'W-14' ? `<div class="canvas" style="margin:10px 0">${[['Gallery', 'A · Card grid'], ['map', 'B · Map above a list']].map(([k, l]) => `<figure class="option" style="margin:0">${phoneMock(k, 'Browse')}<figcaption>${l}</figcaption></figure>`).join('')}</div>` : ''}<div class="choices">${item.options.map(o => `<button class="btn ghost">${esc(o)}</button>`).join('')}</div><label class="small" style="display:block;margin-top:10px">Why (saved with the decision)<br><textarea rows="2" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px"></textarea></label></section>` : ''}
    ${item.state === 'review' ? `<section class="question"><h2>${icon('preview')} Review preview build 7c1e2a4</h2><p class="small">Accepting makes S4 Built.</p><div class="choices"><a class="btn" href="#/platform/environments">Open preview</a><button class="btn ghost">Accept</button><button class="btn ghost">Ask for changes</button></div></section>` : ''}
    ${item.reconcile ? reconcileSection(item) : ''}
    <section class="card" aria-labelledby="cb"><h2 id="cb">Context</h2><p class="small muted">Compiled like a story file: a small set of facts, each citing its source record. Agents fetch more from the layers when they need it; you can read exactly the same.</p><ol class="bundle">${bundle.map(([k, v, src]) => `<li><strong>${k}:</strong> ${esc(v)} <span class="citation">· ${esc(src)}</span></li>`).join('')}</ol>
      <div class="connected">${item.targets.map(t => `<a href="${hrefFor(t)}">${layerChip(t[0])} ${esc(t[2])}</a>`).join('')}</div></section>
  </div>
  <aside class="card side" aria-labelledby="wo"><h2 id="wo">Who's on it</h2>${item.state === 'suggested' ? '<p class="muted">Not queued yet.</p><div class="row"><button class="btn">Start now</button><button class="btn ghost">Add to queue</button></div>' : who === 'template' ? `<p>${icon('auto_fix_high')} Built by the Aludel template during onboarding.</p><p class="small muted">It's your code and your stories now. Change the story or page and new work is created like for anything else.</p>` : `<div class="toggle" role="group" aria-label="Assignee"><button class="${who === 'agent' ? 'on' : ''}" aria-pressed="${who === 'agent'}">${icon('smart_toy')} Agent</button><button class="${who === 'person' ? 'on' : ''}" aria-pressed="${who === 'person'}">${icon('person')} Me</button></div><p class="small muted" style="margin-top:10px">The <a href="#/work/agents/${profileByAgent[item.agent]}">${esc(item.agent)}</a> profile picked this up because Dreamer hands ${esc(item.type.toLowerCase())} work to it.</p>`}</aside></div>`;
}

function settings() { return `<p class="eyebrow">Settings</p><h1>Tool Share settings</h1><div class="grid g2"><section class="card"><h2>Project</h2><dl class="kv"><dt>Name</dt><dd>Tool Share</dd><dt>Address</dt><dd>tool-share.localhost</dd><dt>Members</dt><dd>Ada (owner)</dd></dl></section><section class="card"><h2>Working style</h2><p>Dreamer · <a href="#/work/style">see what it automates</a></p></section><section class="card wide"><h2>All connections</h2><p class="small muted">Read-only audit. Each connection is managed where it is used.</p><ul class="list">${[['smart_toy', 'Codex on this machine', 'Connected', 's-ok', '#/work/agents', 'Work › Agents'], ['code', 'GitHub', 'Not connected', 's-plain', '#/platform/repository', 'Platform › Repository'], ['mail', 'Email delivery', 'Not chosen', 's-warn', '#/platform/architecture', 'Platform › Architecture'], ['cloud', 'Hosting', 'Not set up', 's-plain', '#/platform/environments', 'Platform › Environments'], ['language', 'Domains', 'Not set up', 's-plain', '#/platform/domains', 'Platform › Domains']].map(([i, t, st, c, h, where]) => `<li class="item">${icon(i)}<span class="body"><span class="title">${t}</span><small>Managed in <a href="${h}">${where}</a></small></span><span class="chip ${c}">${st}</span></li>`).join('')}</ul></section></div>`; }
function account() { return `<p class="eyebrow">Account</p><h1>Ada Lovelace</h1><div class="grid g2"><section class="card"><h2>Sign-in</h2><dl class="kv"><dt>Email</dt><dd>ada@example.com</dd><dt>GitHub</dt><dd>Not connected</dd></dl></section><section class="card"><h2>Your apps</h2><ul class="list"><li class="item"><span class="body"><span class="title">Tool Share</span><small>Owner</small></span></li></ul></section></div>`; }

// Global search across every layer.
const index = [
  ...stories.map(s => ({ layer: 'Story map', text: s.title, sub: `${activities.find(a => a.id === s.activity).title} · ${statusLabel[s.status]}`, href: `#/product/map/${s.id}` })),

const q = document.getElementById('q'); const results = document.getElementById('results');
q.addEventListener('input', () => {
  const term = q.value.trim().toLowerCase();
  if (!term) { results.hidden = true; return; }
  const hits = index.filter(e => `${e.text} ${e.sub}`.toLowerCase().includes(term));
  const groups = [...new Set(hits.map(h => h.layer))];
  results.innerHTML = hits.length ? groups.map(g => `<h3>${g}</h3>${hits.filter(h => h.layer === g).slice(0, 5).map(h => `<a href="${h.href}"><span>${esc(h.text)}</span><small>${esc(h.sub)}</small></a>`).join('')}`).join('') : '<p class="muted small" style="padding:8px 10px">Nothing matches.</p>';
  results.hidden = false;
});
results.addEventListener('click', () => { results.hidden = true; q.value = ''; });
const accountButton = document.getElementById('account'); const accountMenu = document.getElementById('account-menu');
accountButton.addEventListener('click', () => { const open = accountMenu.hidden; accountMenu.hidden = !open; accountButton.setAttribute('aria-expanded', String(open)); });
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') { results.hidden = true; accountMenu.hidden = true; accountButton.setAttribute('aria-expanded', 'false'); if (document.querySelector('.drawer')) location.hash = '#/product/map'; }
  if (event.key === '/' && document.activeElement !== q) { event.preventDefault(); q.focus(); }
});
render();
</script>
</body>
</html>
