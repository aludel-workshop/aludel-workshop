<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aludel · Layers prototype v2 · Tool Share</title>
<!-- LAY-02 prototype (DEC-036, DEC-037): the researched knowledge structures with illustrative Tool Share data. Stylesheet base carried over from v1. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<style>
:root{--bg:#fafbff;--rail:#f0f4fc;--panel:#f3f6fd;--line:#dce2ef;--ink:#141727;--muted:#52617d;--primary:#3047b9;--on-primary:#fff;--container:#dfe5ff;--on-container:#163698;--radius:12px;
  --product:#6b35c9;--product-bg:#efe7ff;--design:#b3245f;--design-bg:#ffe4ee;--platform:#0f7465;--platform-bg:#d9f3ec;--work:#8a5300;--work-bg:#fff0d4;
  --ok:#146446;--ok-bg:#d9f3e7;--warn:#6b4b00;--warn-bg:#fff0c9;--bad:#842321;--bad-bg:#fce1e0}
*{box-sizing:border-box}body{margin:0;font-family:Roboto,system-ui,Arial,sans-serif;font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg)}
a{color:var(--primary)}button{font:inherit}
.icon{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;display:inline-block;vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.proto-banner{position:fixed;right:14px;bottom:12px;z-index:50;font-size:12px;background:#141727;color:#fff;padding:6px 12px;border-radius:999px;opacity:.85}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;padding:4px 10px 12px;color:var(--ink);text-decoration:none}.brand .icon{color:var(--primary);font-size:30px}
.project{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:10px}
.project .mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#ca3e6f;color:#fff;font-weight:700;font-size:13px}.project small{display:block;color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:#e3e9f7}.nav a.active{background:var(--container);color:var(--on-container);font-weight:700}
.nav .badge{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--primary);color:#fff;font-size:12px;display:grid;place-items:center}
.nav .role{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
.nav a.active .role{color:var(--on-container)}
.rail .spacer{flex:1}.rail .settings{display:flex;align-items:center;gap:12px;padding:10px 12px;color:var(--muted);text-decoration:none;border-radius:999px}
.main{min-width:0}main:focus{outline:none}.shell{background:linear-gradient(90deg,var(--rail) 240px,transparent 240px)}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10}
.search{position:relative;flex:1;max-width:560px}.search input{width:100%;padding:10px 14px 10px 42px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:15px}
.search .icon{position:absolute;left:12px;top:9px;color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px #1c2a5a26;padding:8px;max-height:60vh;overflow:auto}
.results h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:10px 10px 4px}
.results a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none}.results a:hover,.results a:focus{background:var(--panel)}
.results small{color:var(--muted)}
.content{padding:28px 32px 64px;max-width:1280px}
.eyebrow{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1{font-size:34px;line-height:1.15;margin:0 0 6px}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0 0 6px}
.lead{color:var(--muted);font-size:18px;margin:0 0 22px;max-width:760px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 24px}.tabs a{padding:10px 16px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.active{color:var(--ink);border-color:var(--primary)}
.grid{display:grid;gap:18px}.grid>*{min-width:0}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-side{grid-template-columns:minmax(0,1fr) 380px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.card.wide{grid-column:span 2}.table-wrap{overflow-x:auto}.card.quiet{background:var(--panel);border-style:dashed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.l-product{background:var(--product-bg);color:var(--product)}.l-design{background:var(--design-bg);color:var(--design)}.l-platform{background:var(--platform-bg);color:var(--platform)}.l-work{background:var(--work-bg);color:var(--work)}
.s-ok{background:var(--ok-bg);color:var(--ok)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-bad{background:var(--bad-bg);color:var(--bad)}.s-plain{background:var(--panel);color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}.muted{color:var(--muted)}.small{font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:500;cursor:pointer;text-decoration:none;font-size:14px}
.btn.ghost{background:transparent;color:var(--primary)}.btn.small{padding:4px 12px;font-size:13px}
.stat{display:flex;flex-direction:column}.stat strong{font-size:30px;line-height:1.1}
.progress{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--panel);margin:10px 0 6px}.progress span{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.list{list-style:none;margin:0;padding:0}.list li{border-top:1px solid var(--line)}.list li:first-child{border-top:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;color:var(--ink);text-decoration:none}.item:hover{background:var(--panel)}
.item .body{flex:1;min-width:0}.item .title{font-weight:500}.item small{display:block;color:var(--muted);font-size:13.5px}
.who{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);white-space:nowrap}
.stepper{display:flex;gap:3px;align-items:center}.stepper i{width:26px;height:6px;border-radius:3px;background:var(--line)}.stepper i.on{background:var(--primary)}
.feature{margin-bottom:18px}.feature header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.story{display:grid;grid-template-columns:minmax(0,1fr) 90px 150px 110px;gap:14px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none}
.story:hover{background:var(--panel)}.story.active{background:var(--container)}
.phase{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--panel);color:var(--muted);text-align:center}.phase.current{background:var(--container);color:var(--on-container)}
.side{position:sticky;top:84px;align-self:start}
.connected h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:16px 0 6px}
.connected a{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14.5px}.connected a:hover{background:var(--panel)}
.history{border-left:2px solid var(--line);padding-left:14px;margin:8px 0}.history p{margin:0 0 10px;font-size:14.5px}.history small{color:var(--muted)}
.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.column{background:var(--panel);border-radius:18px;padding:14px}.column.current{background:#e9edfb;outline:2px solid var(--container)}
.scard{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;color:var(--ink);text-decoration:none;font-size:14.5px}.scard:hover{border-color:var(--primary)}
.tree{list-style:none;margin:0;padding:0}.tree ul{list-style:none;margin:0 0 0 18px;padding:0;border-left:1px solid var(--line)}
.tree a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px}.tree a:hover{background:var(--panel)}.tree a.active{background:var(--design-bg);color:var(--design);font-weight:700}
.tree .gap{color:var(--muted);font-style:italic}
.design-grid{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:18px;align-items:start}
.canvas{background:linear-gradient(160deg,#e7e3ee,#f3eef3);border-radius:18px;padding:22px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.phone{width:240px;background:#fff7fa;border:8px solid #1b1d24;border-radius:30px;overflow:hidden;font-size:11px;color:#171a24;display:flex;flex-direction:column}
.phone header{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #0001;font-weight:700}.phone header b{display:grid;place-items:center;width:20px;height:20px;border-radius:7px;background:#ca3e6f;color:#fff;font-size:9px}
.phone main{padding:10px;display:grid;gap:8px;min-height:300px;align-content:start}.phone footer{display:flex;justify-content:space-around;padding:6px;border-top:1px solid #0001;background:#f5eef2}
.phone footer span{font-size:10px;text-align:center;color:#3a3d46}.phone footer span.on{color:#8f2349;font-weight:700}
.bar{height:8px;border-radius:5px;background:#0000001a}.bar.w6{width:60%}.bar.w4{width:40%}.tile{height:62px;border-radius:12px;background:#0000001f}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pill{height:24px;border-radius:999px;background:#0000001a}.map{height:90px;border-radius:12px;background:repeating-linear-gradient(45deg,#dce8e3,#dce8e3 8px,#cfdfd9 8px,#cfdfd9 16px)}
.rowish{display:flex;gap:6px;align-items:center}.dot{width:22px;height:22px;border-radius:50%;background:#0000001f;flex:none}
.option{text-align:center}.option .phone{width:190px}.option .phone main{min-height:250px}.option figcaption{margin-top:8px;font-weight:700;font-size:14px}
.question{border:2px solid var(--warn-bg);background:#fffaf0;border-radius:16px;padding:16px;margin:0 0 18px}
.question h2{font-size:18px}.choices{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:110px;border-radius:12px;overflow:hidden;border:1px solid var(--line);font-size:12.5px}.swatch i{display:block;height:54px}.swatch span{display:block;padding:6px 8px}
.kv{display:grid;grid-template-columns:160px minmax(0,1fr);gap:8px 16px;font-size:15px}.kv dt{color:var(--muted)}.kv dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:14.5px}th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-top:0}
.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 6px}.section-title h2{margin:0;font-size:17px}.count{font-size:13px;color:var(--muted)}
details.quiet summary{cursor:pointer;color:var(--muted);font-weight:500;padding:8px 0}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.toggle button{border:0;background:#fff;padding:6px 14px;cursor:pointer;font-size:14px}.toggle button.on{background:var(--container);color:var(--on-container);font-weight:700}
.note{font-size:14.5px;background:var(--panel);border-radius:12px;padding:12px 14px;margin:0 0 10px}
@media(max-width:1100px){.design-grid{grid-template-columns:200px minmax(0,1fr)}.design-grid>aside:last-child{grid-column:1/-1}.g-side{grid-template-columns:1fr}.side{position:static}}
@media(max-width:800px){.shell{background:none}.card.wide{grid-column:auto}.row{flex-wrap:wrap}.item{flex-wrap:wrap}.shell{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.rail .spacer,.project,.nav .role{display:none}.nav{display:flex;flex-wrap:wrap;gap:2px}
  .content,.topbar{padding-left:16px;padding-right:16px}.g2,.g3,.columns,.design-grid{grid-template-columns:1fr}.story{grid-template-columns:1fr 70px}.story .hide-narrow{display:none}}
/* v2 additions */
.tabs{overflow-x:auto;scrollbar-width:thin}.tabs a{flex:none;white-space:nowrap}
.l-pages{background:#e6eefe;color:#1f4fb8}
.account{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:999px;background:none;cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.account:hover{background:#e3e9f7}.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#2f3a57;color:#fff;font-size:13px;font-weight:700;flex:none}
.account small{display:block;color:var(--muted);font-size:12px}
.account-menu{margin:4px 0 0;padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #1c2a5a1f}
.account-menu a,.account-menu button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px;cursor:pointer}
.account-menu a:hover,.account-menu button:hover{background:var(--panel)}
.map-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:#fff;padding:14px}
.storymap{display:grid;gap:8px;min-width:max-content}
.personas{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}.persona{display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:14px;background:var(--product-bg);color:#3b1f78}
.persona .avatar{background:var(--product)}.persona small{display:block;font-size:12.5px;color:#5b4a86}
.activity{padding:10px 12px;border-radius:12px;background:#2f2356;color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.activity small{font-weight:400;opacity:.8}
.pack{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:#ffe9b3;color:#5b3b00;white-space:nowrap}
.activity .pack{margin-left:auto}
.step{padding:8px 10px;border-radius:10px;background:#e8e2f7;color:#2f2356;font-weight:500;font-size:14px}
.band{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:6px;padding-top:8px;border-top:2px dashed #b9c3de;color:var(--muted);font-size:13px}
.band>*{position:sticky;left:0}.band strong{color:var(--ink)}.band.current strong{color:var(--on-container)}
.cell{display:flex;flex-direction:column;gap:6px;min-height:40px}
.card-story{display:block;width:210px;padding:8px 10px;border-radius:10px;background:#fffdf3;border:1px solid #eadfb4;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35;box-shadow:0 1px 0 #0000000d}
.card-story:hover{border-color:var(--primary)}.card-story.active{outline:3px solid var(--primary)}
.card-story .meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.card-story.built{background:#eef8f2;border-color:#b9dfc9}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;border-left:1px solid var(--line);box-shadow:-20px 0 60px #1c2a5a26;overflow:auto;padding:22px 24px 40px;z-index:30}
.drawer:focus{outline:none}.drawer .close{position:absolute;top:14px;right:14px;border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:50%}.drawer .close:hover{background:var(--panel)}
.gwt{margin:8px 0;padding:10px 12px;border-radius:10px;background:var(--panel);font-size:14px}.gwt b{display:inline-block;min-width:48px;color:var(--product)}
.clar{border-left:4px solid #e0a100;background:#fff8e1;padding:8px 12px;border-radius:0 10px 10px 0;font-size:14px;margin:8px 0}
.spec h3{margin-top:18px}.req{font-family:ui-monospace,monospace;font-size:13.5px;background:var(--panel);padding:2px 6px;border-radius:6px}
.doclist a{display:flex;gap:12px;align-items:center;padding:12px 6px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}.doclist a:first-child{border-top:0}.doclist a:hover{background:var(--panel)}
.templates{display:flex;gap:8px;flex-wrap:wrap}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 16px}.flow a{padding:8px 12px;border-radius:10px;background:#e6eefe;color:#1f4fb8;text-decoration:none;font-weight:500;font-size:14px}
.flow .icon{color:var(--muted);font-size:18px}
.token-swatch{display:inline-block;width:18px;height:18px;border-radius:5px;vertical-align:middle;margin-right:8px;border:1px solid #0002}
.citation{font-size:12.5px;color:var(--muted)}.bundle li{margin:6px 0}
.origin{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#/home"><span class="icon" aria-hidden="true">deployed_code</span>Aludel</a>
    <div class="project"><span class="mark" aria-hidden="true">TS</span><div><strong>Tool Share</strong><small>Dreamer · Demo phase</small></div></div>
    <nav class="nav" aria-label="Layers" id="nav"></nav>
    <div class="spacer"></div>
    <a class="settings" href="#/settings"><span class="icon" aria-hidden="true">settings</span>Settings</a>
    <div>
      <button class="account" id="account" aria-expanded="false" aria-controls="account-menu"><span class="avatar" aria-hidden="true">AL</span><span><strong>Ada Lovelace</strong><small>ada@example.com</small></span></button>
      <div class="account-menu" id="account-menu" hidden><a href="#/account"><span class="icon" aria-hidden="true">person</span>Account</a><a href="#/settings"><span class="icon" aria-hidden="true">swap_horiz</span>Switch project</a><button type="button"><span class="icon" aria-hidden="true">logout</span>Sign out</button></div>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="search" role="search">
        <span class="icon" aria-hidden="true">search</span>
        <label for="q" style="position:absolute;left:-999px">Search every layer</label>
        <input id="q" type="search" placeholder="Search stories, specs, pages, work, decisions…" autocomplete="off">
        <div class="results" id="results" hidden></div>
      </div>
      <span class="muted small">Prototype v2 · illustrative data</span>
    </div>
    <main class="content" id="main" tabindex="-1"></main>
  </div>
</div>
<div id="drawer-root"></div>
<div class="proto-banner">LAY-02 prototype · not the real app</div>
<script>
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const icon = name => `<span class="icon" aria-hidden="true">${name}</span>`;
const layerName = { product: 'Product', design: 'Design', pages: 'Pages', platform: 'Platform', work: 'Work' };
const layerChip = layer => `<span class="chip l-${layer}">${layerName[layer]}</span>`;

// ---------- Product ----------
const phases = [
  { id: 'demo', label: 'Demo', goal: 'Someone can find a nearby tool, ask to borrow it and talk it over, all with sample data.', appetite: '1 week', exit: 'The whole borrow flow is clickable end to end', current: true },
  { id: 'mvp', label: 'MVP', goal: 'Twenty neighbours on one street really lend and return tools.', appetite: '3 weeks', exit: '10 completed loans with real accounts' },
  { id: 'later', label: 'Later', goal: 'Trust and scale across neighbourhoods.', appetite: 'Not set', exit: 'Decided after MVP' }
];
const statuses = ['proposed', 'defined', 'designed', 'built', 'shipped'];
const statusLabel = { proposed: 'Proposed', defined: 'Defined', designed: 'Designed', built: 'Built', shipped: 'Shipped' };
const statusColor = { proposed: '#c1c8d8', defined: '#8e9ad0', designed: '#e07aa2', built: '#3047b9', shipped: '#146446' };
const personas = [{ id: 'sam', name: 'Sam', role: 'Borrower', note: 'Needs a tool once, hates buying it' }, { id: 'priya', name: 'Priya', role: 'Lender', note: 'Shed full of tools, wants them back' }];
const activities = [
  { id: 'join', title: 'Join', persona: 'Everyone', pack: 'Accounts', steps: ['Sign up', 'Sign in and out', 'Recover'] },
  { id: 'find', title: 'Find a tool', persona: 'Sam', steps: ['Browse nearby', 'Search', 'See details'] },
  { id: 'borrow', title: 'Borrow', persona: 'Sam', steps: ['Request', 'Get an answer'] },
  { id: 'talk', title: 'Talk it over', persona: 'Sam and Priya', pack: 'Messaging', steps: ['Start', 'Read and reply', 'Stay informed'] },

function storyMap(selected) {
  const columns = activities.flatMap(a => a.steps.map((step, index) => ({ activity: a.id, step: index, label: step })));
  const colOf = (activity, step) => columns.findIndex(c => c.activity === activity && c.step === step) + 1;
  let html = `<div class="personas" aria-label="Users">${personas.map(p => `<span class="persona"><span class="avatar" aria-hidden="true">${p.name[0]}</span><span><strong>${p.name}</strong><small>${p.role}</small></span></span>`).join('')}<span class="small muted" style="align-self:center">Story packs you picked in onboarding are marked; their stories are yours to change.</span></div>`;
  html += `<div class="map-wrap" tabindex="0" role="region" aria-label="Story map"><div class="storymap" style="grid-template-columns:repeat(${columns.length}, 210px)">`;
  let start = 1;
  for (const a of activities) { html += `<div class="activity" style="grid-column:${start} / span ${a.steps.length}"><span>${esc(a.title)} <small>· ${esc(a.persona)}</small></span>${a.pack ? `<span class="pack">${esc(a.pack)} pack</span>` : ''}</div>`; start += a.steps.length; }
  columns.forEach(c => { html += `<div class="step">${esc(c.label)}</div>`; });
  for (const phase of phases) {
    const list = stories.filter(s => s.phase === phase.id);
    html += `<div class="band ${phase.current ? 'current' : ''}"><strong>${phase.label}</strong> ${esc(phase.goal)}</div>`;
    columns.forEach((c, index) => {
      const cellStories = list.filter(s => s.activity === c.activity && s.step === c.step);
      html += `<div class="cell" style="grid-column:${index + 1}">${cellStories.map(s => `<a class="card-story ${s.status === 'built' ? 'built' : ''} ${s.id === selected ? 'active' : ''}" href="#/product/map/${s.id}">${esc(s.title)}<span class="meta"><span class="dot" style="background:${statusColor[s.status]}"></span>${statusLabel[s.status]}${s.template ? ' · template' : ''}${s.clarifications.length ? ` · ${icon('help')}` : ''}</span></a>`).join('')}</div>`;
    });
  }
  html += `</div></div><div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn ghost small">${icon('add')}Add activity</button><button class="btn ghost small">${icon('add')}Add story</button><button class="btn ghost small">${icon('inventory_2')}Add a story pack</button><span class="small muted">Dreamer: the Product agent drafts new stories from a sentence; you review.</span></div>`;
  return html;
}

  const head = `<p class="eyebrow">Work · the shared bench</p><h1>Everything to do, from every layer</h1><p class="lead">Agents, templates and people pick up items the same way. Questions stay on the item; answers land in the layer they change.</p>` + tabs('work', [['queue', 'Queue'], ['routines', 'Routines'], ['style', 'Working style']], section);
  if (section === 'routines') return head + `<div class="table-wrap" tabindex="0" role="region" aria-label="Routines"><table><thead><tr><th>Routine</th><th>Layer</th><th>Runs</th><th>Next</th><th>Creates</th></tr></thead><tbody>${[['Product drift check', 'product', 'Weekly', 'Sep 29', 'Define items when built behaviour and stories disagree'], ['Accessibility sweep', 'pages', 'Weekly', 'Sep 26', 'Design items for contrast or focus problems'], ['Dependency updates', 'platform', 'Monthly', 'Oct 1', 'Implement items with previews'], ['Security audit', 'platform', 'Before each release', 'First release', 'Implement items for findings']].map(([t, l, r, n, c]) => `<tr><td><strong>${t}</strong></td><td>${layerChip(l)}</td><td>${r}</td><td>${n}</td><td class="small">${c}</td></tr>`).join('')}</tbody></table></div>`;
  if (section === 'style') return head + `<div class="table-wrap" tabindex="0" role="region" aria-label="Automation by working style"><table><thead><tr><th>Work type</th><th>Dreamer (current)</th><th>Planner</th><th>Tinkerer</th></tr></thead><tbody>${[['Vision and roadmap', 'Agent asks a few questions, then drafts', 'You', 'You'], ['Stories and acceptance', 'Agent drafts · you review', 'You', 'You'], ['Specs', 'Agent drafts · asks only blockers', 'Agent drafts · you review', 'You'], ['Technical plans', 'Agent', 'Agent', 'You'], ['Page designs', 'Agent · asks when options differ', 'Agent · you choose', 'You'], ['Implementation', 'Template if possible, else agent · you review', 'Template if possible, else agent · you review', 'Template if possible, else you'], ['Platform configuration', 'Agent · you approve effects', 'Agent · you approve effects', 'You']].map(r => `<tr>${r.map((c, i) => `<td>${i === 1 ? `<strong>${c}</strong>` : c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><section class="card" style="margin-top:18px"><h2>Agent instructions</h2><p class="small muted">How agents approach each work type here, written as examples.</p><ul><li>Product agent: stories read “Someone can …”, with 1–3 Given/When/Then scenarios.</li><li>Design agent: offer at most two options; only system tokens and components.</li><li>Coding agent: one story per build; cite the spec requirement in each commit.</li></ul></section>`;
  const row = item => `<li><a class="item" href="#/work/item/${item.id}">${layerChip(item.layer)}<span class="body"><span class="title">${esc(item.title)}</span><small>${esc(item.type)} · ${item.targets.map(t => esc(t[2])).join(' · ')}</small></span><span class="who">${whoLabel(item)}</span><span class="chip ${stateChip[item.state]}">${stateLabel[item.state]}</span></a></li>`;
  const group = (states, title, quiet) => { const list = work.filter(w => states.includes(w.state)); if (!list.length) return ''; const inner = `<ul class="list card" style="padding:4px 16px">${list.map(row).join('')}</ul>`; return quiet ? `<details class="quiet"><summary>${title} · ${list.length}</summary>${inner}</details>` : `<div class="section-title"><h2>${title}</h2><span class="count">${list.length}</span></div>${inner}`; };
  return head + group(['needs-input'], 'Needs you') + group(['review'], 'In review') + group(['claimed'], 'In progress') + group(['ready'], 'Ready to pick up') + group(['suggested'], 'Suggested by the layers (not queued yet)', true) + group(['done'], 'Done recently (including template work)', true);
}

function workItem(id) {
  const item = work.find(w => w.id === id) || work[0];
  const story = item.targets.map(t => stories.find(s => s.id === t[1])).find(Boolean);
  const targetPages = [...new Set([...item.targets.filter(t => t[0] === 'pages').map(t => t[1]), ...(story?.pages || [])])].map(pid => pages.find(p => p.id === pid)).filter(Boolean);
  const spec = specs.find(sp => item.targets.some(t => t[1] === sp.id) || (story && sp.stories.includes(story.id)));
  const decisions = item.targets.flatMap(t => stories.find(s => s.id === t[1])?.history || []);
  const bundle = [
    ['Goal', item.title, item.id], story ? ['Story', `${story.title}`, story.id] : null,
    story?.acceptance.length ? ['Acceptance', `${story.acceptance.length} Given/When/Then scenario(s)`, story.id] : null,
    ['Principles', 'Neighbourly, never transactional; rough distance only; one-handed', 'Product › Vision'],
    // Only what this item touches: its pages' components, its spec's entities, its stories' decisions.
    targetPages.length ? ['Design', `Mobile-first social tokens; ${targetPages.map(p => p.type === 'Messages' ? 'Message bubble' : p.type === 'Form' ? 'Form fields' : 'Tool card').filter((v, i, a) => a.indexOf(v) === i).join(', ')}; Tab bar`, `Pages › ${targetPages.map(p => p.label).join(', ')}`] : null,
    ['Technical context', `aludel-web-v1${spec ? `; ${spec.entities.map(e => e.split(' (')[0]).join(', ')}` : ''}`, spec ? `Platform › Architecture, ${spec.id}` : 'Platform › Architecture'],
    decisions.length ? ['Decisions so far', decisions.map(d => d.text).join(' '), decisions.map(d => d.source).join(', ')] : null,
    ['Will document', item.documents.join('; ') || 'Set when staged', 'This item']
  ].filter(Boolean);
  const who = item.who;
  return `<p class="eyebrow"><a href="#/work/queue">Work</a> · ${item.id}</p><div class="row" style="flex-wrap:wrap"><h1 style="margin:0">${esc(item.title)}</h1>${layerChip(item.layer)}<span class="chip ${stateChip[item.state]}">${stateLabel[item.state]}</span></div><p class="muted">${esc(item.type)} work from the ${layerName[item.layer]} layer</p>
  <div class="grid g-side"><div>
    ${item.question ? `<section class="question" aria-labelledby="qq"><h2 id="qq">${icon('help')} ${esc(item.question)}</h2>${item.id === 'W-14' ? `<div class="canvas" style="margin:10px 0">${[['Gallery', 'A · Card grid'], ['map', 'B · Map above a list']].map(([k, l]) => `<figure class="option" style="margin:0">${phoneMock(k, 'Browse')}<figcaption>${l}</figcaption></figure>`).join('')}</div>` : ''}<div class="choices">${item.options.map(o => `<button class="btn ghost">${esc(o)}</button>`).join('')}</div><label class="small" style="display:block;margin-top:10px">Why (saved with the decision)<br><textarea rows="2" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px"></textarea></label></section>` : ''}
    ${item.state === 'review' ? `<section class="question"><h2>${icon('preview')} Review preview build 7c1e2a4</h2><p class="small">Accepting makes S4 Built.</p><div class="choices"><a class="btn" href="#/platform/environments">Open preview</a><button class="btn ghost">Accept</button><button class="btn ghost">Ask for changes</button></div></section>` : ''}
    <section class="card" aria-labelledby="cb"><h2 id="cb">Context</h2><p class="small muted">Compiled like a story file: a small set of facts, each citing its source record. Agents fetch more from the layers when they need it; you can read exactly the same.</p><ol class="bundle">${bundle.map(([k, v, src]) => `<li><strong>${k}:</strong> ${esc(v)} <span class="citation">· ${esc(src)}</span></li>`).join('')}</ol>
      <div class="connected">${item.targets.map(t => `<a href="${hrefFor(t)}">${layerChip(t[0])} ${esc(t[2])}</a>`).join('')}</div></section>
  </div>
  <aside class="card side" aria-labelledby="wo"><h2 id="wo">Who's on it</h2>${item.state === 'suggested' ? '<p class="muted">Not queued yet.</p><div class="row"><button class="btn">Start now</button><button class="btn ghost">Add to queue</button></div>' : who === 'template' ? `<p>${icon('auto_fix_high')} Built by the Aludel template during onboarding.</p><p class="small muted">It's your code and your stories now. Change the story or page and new work is created like for anything else.</p>` : `<div class="toggle" role="group" aria-label="Assignee"><button class="${who === 'agent' ? 'on' : ''}" aria-pressed="${who === 'agent'}">${icon('smart_toy')} Agent</button><button class="${who === 'person' ? 'on' : ''}" aria-pressed="${who === 'person'}">${icon('person')} Me</button></div><p class="small muted" style="margin-top:10px">${esc(item.agent)} picked this up because Dreamer hands ${esc(item.type.toLowerCase())} work to agents.</p>`}</aside></div>`;
}

function settings() { return `<p class="eyebrow">Settings</p><h1>Tool Share settings</h1><div class="grid g2"><section class="card"><h2>Project</h2><dl class="kv"><dt>Name</dt><dd>Tool Share</dd><dt>Address</dt><dd>tool-share.localhost</dd><dt>Members</dt><dd>Ada (owner)</dd></dl></section><section class="card"><h2>Working style</h2><p>Dreamer · <a href="#/work/style">see what it automates</a></p></section></div>`; }
function account() { return `<p class="eyebrow">Account</p><h1>Ada Lovelace</h1><div class="grid g2"><section class="card"><h2>Sign-in</h2><dl class="kv"><dt>Email</dt><dd>ada@example.com</dd><dt>GitHub</dt><dd>Not connected</dd></dl></section><section class="card"><h2>Your apps</h2><ul class="list"><li class="item"><span class="body"><span class="title">Tool Share</span><small>Owner</small></span></li></ul></section></div>`; }

// Global search across every layer.
const index = [
  ...stories.map(s => ({ layer: 'Story map', text: s.title, sub: `${activities.find(a => a.id === s.activity).title} · ${statusLabel[s.status]}`, href: `#/product/map/${s.id}` })),
  ...specs.map(s => ({ layer: 'Specs', text: `${s.id} ${s.title}`, sub: s.status, href: `#/product/specs/${s.id}` })),
  ...docs.map(d => ({ layer: 'Docs', text: d.title, sub: d.template, href: '#/product/docs' })),
  ...pages.map(p => ({ layer: 'Pages', text: `${p.label} page`, sub: p.status, href: `#/pages/tree/${p.id}` })),
  ...components.map(([n, m]) => ({ layer: 'Design', text: n, sub: m, href: '#/design/components' })),
  ...work.map(w => ({ layer: 'Work', text: w.title, sub: `${w.id} · ${stateLabel[w.state]}`, href: `#/work/item/${w.id}` }))
];
const q = document.getElementById('q'); const results = document.getElementById('results');
q.addEventListener('input', () => {
  const term = q.value.trim().toLowerCase();
  if (!term) { results.hidden = true; return; }
  const hits = index.filter(e => `${e.text} ${e.sub}`.toLowerCase().includes(term));
  const groups = [...new Set(hits.map(h => h.layer))];
  results.innerHTML = hits.length ? groups.map(g => `<h3>${g}</h3>${hits.filter(h => h.layer === g).slice(0, 5).map(h => `<a href="${h.href}"><span>${esc(h.text)}</span><small>${esc(h.sub)}</small></a>`).join('')}`).join('') : '<p class="muted small" style="padding:8px 10px">Nothing matches.</p>';
  results.hidden = false;
});
results.addEventListener('click', () => { results.hidden = true; q.value = ''; });
const accountButton = document.getElementById('account'); const accountMenu = document.getElementById('account-menu');
accountButton.addEventListener('click', () => { const open = accountMenu.hidden; accountMenu.hidden = !open; accountButton.setAttribute('aria-expanded', String(open)); });
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') { results.hidden = true; accountMenu.hidden = true; accountButton.setAttribute('aria-expanded', 'false'); if (document.querySelector('.drawer')) location.hash = '#/product/map'; }
  if (event.key === '/' && document.activeElement !== q) { event.preventDefault(); q.focus(); }
});
render();
</script>
</body>
</html>
