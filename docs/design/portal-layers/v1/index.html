<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aludel · Layers prototype v1 · Tool Share</title>
<!-- LAY-01 structure prototype (DEC-036). Illustrative Tool Share data; no backend. Fonts load from Google Fonts when online. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<style>
:root{--bg:#fafbff;--rail:#f0f4fc;--panel:#f3f6fd;--line:#dce2ef;--ink:#141727;--muted:#52617d;--primary:#3047b9;--on-primary:#fff;--container:#dfe5ff;--on-container:#163698;--radius:12px;
  --product:#6b35c9;--product-bg:#efe7ff;--design:#b3245f;--design-bg:#ffe4ee;--platform:#0f7465;--platform-bg:#d9f3ec;--work:#8a5300;--work-bg:#fff0d4;
  --ok:#146446;--ok-bg:#d9f3e7;--warn:#6b4b00;--warn-bg:#fff0c9;--bad:#842321;--bad-bg:#fce1e0}
*{box-sizing:border-box}body{margin:0;font-family:Roboto,system-ui,Arial,sans-serif;font-size:16px;line-height:1.5;color:var(--ink);background:var(--bg)}
a{color:var(--primary)}button{font:inherit}
.icon{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;display:inline-block;vertical-align:middle;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.proto-banner{position:fixed;right:14px;bottom:12px;z-index:50;font-size:12px;background:#141727;color:#fff;padding:6px 12px;border-radius:999px;opacity:.85}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;padding:4px 10px 12px;color:var(--ink);text-decoration:none}.brand .icon{color:var(--primary);font-size:30px}
.project{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:10px}
.project .mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#ca3e6f;color:#fff;font-weight:700;font-size:13px}.project small{display:block;color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:#e3e9f7}.nav a.active{background:var(--container);color:var(--on-container);font-weight:700}
.nav .badge{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--primary);color:#fff;font-size:12px;display:grid;place-items:center}
.nav .role{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
.nav a.active .role{color:var(--on-container)}
.rail .spacer{flex:1}.rail .settings{display:flex;align-items:center;gap:12px;padding:10px 12px;color:var(--muted);text-decoration:none;border-radius:999px}
.main{min-width:0}main:focus{outline:none}.shell{background:linear-gradient(90deg,var(--rail) 240px,transparent 240px)}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10}
.search{position:relative;flex:1;max-width:560px}.search input{width:100%;padding:10px 14px 10px 42px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:15px}
.search .icon{position:absolute;left:12px;top:9px;color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px #1c2a5a26;padding:8px;max-height:60vh;overflow:auto}
.results h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:10px 10px 4px}
.results a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none}.results a:hover,.results a:focus{background:var(--panel)}
.results small{color:var(--muted)}
.content{padding:28px 32px 64px;max-width:1280px}
.eyebrow{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1{font-size:34px;line-height:1.15;margin:0 0 6px}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0 0 6px}
.lead{color:var(--muted);font-size:18px;margin:0 0 22px;max-width:760px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 24px}.tabs a{padding:10px 16px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.active{color:var(--ink);border-color:var(--primary)}
.grid{display:grid;gap:18px}.grid>*{min-width:0}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g-side{grid-template-columns:minmax(0,1fr) 380px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.card.wide{grid-column:span 2}.table-wrap{overflow-x:auto}.card.quiet{background:var(--panel);border-style:dashed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.l-product{background:var(--product-bg);color:var(--product)}.l-design{background:var(--design-bg);color:var(--design)}.l-platform{background:var(--platform-bg);color:var(--platform)}.l-work{background:var(--work-bg);color:var(--work)}
.s-ok{background:var(--ok-bg);color:var(--ok)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-bad{background:var(--bad-bg);color:var(--bad)}.s-plain{background:var(--panel);color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}.muted{color:var(--muted)}.small{font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:500;cursor:pointer;text-decoration:none;font-size:14px}
.btn.ghost{background:transparent;color:var(--primary)}.btn.small{padding:4px 12px;font-size:13px}
.stat{display:flex;flex-direction:column}.stat strong{font-size:30px;line-height:1.1}
.progress{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--panel);margin:10px 0 6px}.progress span{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.list{list-style:none;margin:0;padding:0}.list li{border-top:1px solid var(--line)}.list li:first-child{border-top:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;color:var(--ink);text-decoration:none}.item:hover{background:var(--panel)}
.item .body{flex:1;min-width:0}.item .title{font-weight:500}.item small{display:block;color:var(--muted);font-size:13.5px}
.who{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);white-space:nowrap}
.stepper{display:flex;gap:3px;align-items:center}.stepper i{width:26px;height:6px;border-radius:3px;background:var(--line)}.stepper i.on{background:var(--primary)}
.feature{margin-bottom:18px}.feature header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.story{display:grid;grid-template-columns:minmax(0,1fr) 90px 150px 110px;gap:14px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none}
.story:hover{background:var(--panel)}.story.active{background:var(--container)}
.phase{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--panel);color:var(--muted);text-align:center}.phase.current{background:var(--container);color:var(--on-container)}
.side{position:sticky;top:84px;align-self:start}
.connected h3{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:16px 0 6px}
.connected a{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14.5px}.connected a:hover{background:var(--panel)}
.history{border-left:2px solid var(--line);padding-left:14px;margin:8px 0}.history p{margin:0 0 10px;font-size:14.5px}.history small{color:var(--muted)}
.columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.column{background:var(--panel);border-radius:18px;padding:14px}.column.current{background:#e9edfb;outline:2px solid var(--container)}
.scard{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;color:var(--ink);text-decoration:none;font-size:14.5px}.scard:hover{border-color:var(--primary)}
.tree{list-style:none;margin:0;padding:0}.tree ul{list-style:none;margin:0 0 0 18px;padding:0;border-left:1px solid var(--line)}
.tree a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px}.tree a:hover{background:var(--panel)}.tree a.active{background:var(--design-bg);color:var(--design);font-weight:700}
.tree .gap{color:var(--muted);font-style:italic}
.design-grid{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:18px;align-items:start}
.canvas{background:linear-gradient(160deg,#e7e3ee,#f3eef3);border-radius:18px;padding:22px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.phone{width:240px;background:#fff7fa;border:8px solid #1b1d24;border-radius:30px;overflow:hidden;font-size:11px;color:#171a24;display:flex;flex-direction:column}
.phone header{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #0001;font-weight:700}.phone header b{display:grid;place-items:center;width:20px;height:20px;border-radius:7px;background:#ca3e6f;color:#fff;font-size:9px}
.phone main{padding:10px;display:grid;gap:8px;min-height:300px;align-content:start}.phone footer{display:flex;justify-content:space-around;padding:6px;border-top:1px solid #0001;background:#f5eef2}
.phone footer span{font-size:10px;text-align:center;color:#3a3d46}.phone footer span.on{color:#8f2349;font-weight:700}
.bar{height:8px;border-radius:5px;background:#0000001a}.bar.w6{width:60%}.bar.w4{width:40%}.tile{height:62px;border-radius:12px;background:#0000001f}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pill{height:24px;border-radius:999px;background:#0000001a}.map{height:90px;border-radius:12px;background:repeating-linear-gradient(45deg,#dce8e3,#dce8e3 8px,#cfdfd9 8px,#cfdfd9 16px)}
.rowish{display:flex;gap:6px;align-items:center}.dot{width:22px;height:22px;border-radius:50%;background:#0000001f;flex:none}
.option{text-align:center}.option .phone{width:190px}.option .phone main{min-height:250px}.option figcaption{margin-top:8px;font-weight:700;font-size:14px}
.question{border:2px solid var(--warn-bg);background:#fffaf0;border-radius:16px;padding:16px;margin:0 0 18px}
.question h2{font-size:18px}.choices{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:110px;border-radius:12px;overflow:hidden;border:1px solid var(--line);font-size:12.5px}.swatch i{display:block;height:54px}.swatch span{display:block;padding:6px 8px}
.kv{display:grid;grid-template-columns:160px minmax(0,1fr);gap:8px 16px;font-size:15px}.kv dt{color:var(--muted)}.kv dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:14.5px}th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-top:0}
.section-title{display:flex;align-items:center;gap:10px;margin:22px 0 6px}.section-title h2{margin:0;font-size:17px}.count{font-size:13px;color:var(--muted)}
details.quiet summary{cursor:pointer;color:var(--muted);font-weight:500;padding:8px 0}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.toggle button{border:0;background:#fff;padding:6px 14px;cursor:pointer;font-size:14px}.toggle button.on{background:var(--container);color:var(--on-container);font-weight:700}
.note{font-size:14.5px;background:var(--panel);border-radius:12px;padding:12px 14px;margin:0 0 10px}
@media(max-width:1100px){.design-grid{grid-template-columns:200px minmax(0,1fr)}.design-grid>aside:last-child{grid-column:1/-1}.g-side{grid-template-columns:1fr}.side{position:static}}
@media(max-width:800px){.shell{background:none}.card.wide{grid-column:auto}.row{flex-wrap:wrap}.item{flex-wrap:wrap}.shell{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.rail .spacer,.project,.nav .role{display:none}.nav{display:flex;flex-wrap:wrap;gap:2px}
  .content,.topbar{padding-left:16px;padding-right:16px}.g2,.g3,.columns,.design-grid{grid-template-columns:1fr}.story{grid-template-columns:1fr 70px}.story .hide-narrow{display:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#/home"><span class="icon" aria-hidden="true">deployed_code</span>Aludel</a>
    <div class="project"><span class="mark" aria-hidden="true">TS</span><div><strong>Tool Share</strong><small>Dreamer · Demo phase</small></div></div>
    <nav class="nav" aria-label="Layers" id="nav"></nav>
    <div class="spacer"></div>
    <a class="settings" href="#/settings"><span class="icon" aria-hidden="true">settings</span>Settings</a>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="search" role="search">
        <span class="icon" aria-hidden="true">search</span>
        <label class="visually-hidden" for="q" style="position:absolute;left:-999px">Search every layer</label>
        <input id="q" type="search" placeholder="Search stories, pages, work, decisions…" autocomplete="off">
        <div class="results" id="results" hidden></div>
      </div>
      <span class="muted small">Prototype · illustrative data</span>
    </div>
    <main class="content" id="main" tabindex="-1"></main>
  </div>
</div>
<div class="proto-banner">LAY-01 prototype · not the real app</div>
<script>
const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const icon = (name, label) => `<span class="icon" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'}>${name}</span>`;
const layerChip = layer => `<span class="chip l-${layer}">${{ product: 'Product', design: 'Design', platform: 'Platform', work: 'Work' }[layer]}</span>`;

// ---- Tool Share, as onboarding left it plus a few days of work (illustrative) ----
const phases = [{ id: 'demo', label: 'Demo', note: 'Clickable core flow with sample data', current: true }, { id: 'mvp', label: 'MVP', note: 'Real accounts and data; testers invited' }, { id: 'later', label: 'Later', note: 'Polish and growth' }];
const statuses = ['proposed', 'defined', 'designed', 'built', 'shipped'];
const statusLabel = { proposed: 'Proposed', defined: 'Defined', designed: 'Designed', built: 'Built', shipped: 'Shipped' };
const statusColor = { proposed: '#c9cfdd', defined: '#9aa7d8', designed: '#e07aa2', built: '#3047b9', shipped: '#146446' };
const features = [
  { id: 'borrowing', title: 'Borrowing', summary: 'Neighbours find a tool nearby, ask to borrow it, and give it back.', stories: [
    { id: 'S1', title: 'Browse tools available nearby', phase: 'demo', status: 'designed', pages: ['browse'], work: ['W-09'], acceptance: ['Shows tools within 2 km, closest first', 'Each card shows photo, name, lender and distance'], history: [{ text: 'Cards rather than a table: photos drive the choice.', source: 'W-08', date: 'Sep 21' }] },
    { id: 'S2', title: 'Request to borrow a tool', phase: 'demo', status: 'defined', pages: ['tool'], work: ['W-13', 'W-10'], acceptance: ['A request names the dates needed', 'The lender is notified'], history: [] },
    { id: 'S3', title: 'Lender approves or declines a request', phase: 'mvp', status: 'defined', pages: [], work: [], acceptance: ['Approve or decline with an optional note'], history: [] },
    { id: 'S4', title: 'Return reminders', phase: 'mvp', status: 'proposed', pages: [], work: ['W-S2'], acceptance: [], history: [] }] },
  { id: 'messaging', title: 'Messaging', summary: 'Borrowers and lenders talk about a tool and arrange pick-up.', stories: [
    { id: 'S5', title: 'Message a lender about a tool', phase: 'demo', status: 'defined', pages: ['messages'], work: ['W-S1'], acceptance: ['Starts from the tool page', 'Thread shows the tool it is about'], history: [] },
    { id: 'S6', title: 'Get notified of replies', phase: 'mvp', status: 'proposed', pages: [], work: ['W-11'], acceptance: [], history: [] },
    { id: 'S7', title: 'Street-wide group threads', phase: 'later', status: 'proposed', pages: [], work: [], acceptance: [], history: [] }] },
  { id: 'accounts', title: 'Accounts and profiles', summary: 'People sign up, sign in and show what they lend.', stories: [
    { id: 'S8', title: 'Sign up and sign in', phase: 'demo', status: 'built', pages: ['profile'], work: ['W-12'], acceptance: ['Email and password', 'Signed-in name in the header'], history: [{ text: 'Email and password for Demo; social sign-in deferred to MVP.', source: 'W-07', date: 'Sep 20' }] },
    { id: 'S9', title: 'Profile shows the tools I lend', phase: 'mvp', status: 'proposed', pages: ['profile'], work: [], acceptance: [], history: [] }] },
  { id: 'search', title: 'Search', summary: 'Find a specific tool quickly.', stories: [
    { id: 'S10', title: 'Search tools by name and distance', phase: 'demo', status: 'defined', pages: ['browse'], work: ['W-14'], acceptance: ['Matches tool names and categories', 'Can narrow by distance'], history: [] }] }
];
const stories = features.flatMap(feature => feature.stories.map(story => ({ ...story, feature })));
const pageTree = [
  { id: 'home', label: 'Home', type: 'Feed', icon: 'home', status: 'Accepted · rev 1', stories: [], notes: 'Recent tools shared nearby, then requests waiting for you.' },
  { id: 'browse', label: 'Browse', type: 'Gallery', icon: 'explore', status: 'Accepted · rev 2 · options open for search results', stories: ['S1', 'S10'], notes: 'Photo-led cards; search pinned to the top. Hero image from onboarding used as the empty state.', children: [
    { id: 'tool', label: 'Tool detail', type: 'Detail', icon: 'build', status: 'Not designed yet', stories: ['S2'], gap: true, notes: '' }] },
  { id: 'messages', label: 'Messages', type: 'Messages', icon: 'chat', status: 'Not designed yet', stories: ['S5'], gap: true, notes: '', children: [
    { id: 'thread', label: 'Conversation', type: 'Messages', icon: 'forum', status: 'Not designed yet', stories: ['S5'], gap: true, notes: '' }] },
  { id: 'profile', label: 'Profile', type: 'Detail', icon: 'person', status: 'Accepted · rev 1', stories: ['S8', 'S9'], notes: 'Name, neighbourhood and the tools this person lends.' }
];
const pages = pageTree.flatMap(page => [page, ...(page.children || [])]);
const work = [
  { id: 'W-14', state: 'needs-input', layer: 'design', type: 'Design', title: 'Search results layout for Browse', who: 'agent', agent: 'Design agent', targets: [['design', 'browse', 'Browse page'], ['product', 'S10', 'S10 Search tools by name and distance']],
    question: { text: 'Which layout should search results use?', why: 'Distance matters as much as the tool itself (S10 acceptance). Both layouts use the system tokens and the gallery page type.', options: ['A · Card grid, distance on each card', 'B · Map above a compact list'] },
    documents: ['Design › Browse page, new revision with the chosen layout and why', 'Product › S10 status becomes Designed'], log: ['Claimed by Design agent (policy: Dreamer automates design)', 'Drafted two options from S10 and the Mobile-first social feel', 'Asked: which layout?'] },
  { id: 'W-13', state: 'needs-input', layer: 'product', type: 'Define', title: 'Acceptance for “Request to borrow a tool”', who: 'agent', agent: 'Product agent', targets: [['product', 'S2', 'S2 Request to borrow a tool']],
    question: { text: 'Can people ask to borrow for specific dates, or only “as soon as possible”?', why: 'Dates change the page (a date picker) and later the data model.', options: ['Specific dates', 'As soon as possible', 'Both'] },
    documents: ['Product › S2 acceptance examples (new revision)'], log: ['Claimed by Product agent', 'Drafted acceptance from the pitch and Messaging stories', 'Asked about dates'] },
  { id: 'W-12', state: 'review', layer: 'product', type: 'Implement', title: 'Build “Sign up and sign in”', who: 'agent', agent: 'Coding agent', targets: [['product', 'S8', 'S8 Sign up and sign in'], ['design', 'profile', 'Profile page']],
    documents: ['Product › S8 status becomes Built once accepted', 'Platform › Preview build 7c1e2a4'], log: ['Claimed by Coding agent', 'Preview build 7c1e2a4 ready', 'Checks: 14 passed'] },
  { id: 'W-11', state: 'claimed', layer: 'product', type: 'Define', title: 'Draft stories for reply notifications', who: 'agent', agent: 'Product agent', targets: [['product', 'S6', 'S6 Get notified of replies']], documents: ['Product › Messaging stories'], log: ['Claimed by Product agent'] },
  { id: 'W-10', state: 'ready', layer: 'design', type: 'Design', title: 'Design the Tool detail page', who: 'agent', agent: 'Design agent', targets: [['design', 'tool', 'Tool detail page'], ['product', 'S2', 'S2 Request to borrow']], documents: ['Design › Tool detail page (first revision)'], log: ['Staged from the page tree gap'] },
  { id: 'W-09', state: 'ready', layer: 'product', type: 'Implement', title: 'Build “Browse tools available nearby”', who: 'person', agent: 'You', targets: [['product', 'S1', 'S1 Browse tools nearby'], ['design', 'browse', 'Browse page']], documents: ['Product › S1 status becomes Built once accepted'], log: ['Staged when S1 became Designed', 'Assigned to you (you picked this one up yourself)'] },
  { id: 'W-S1', state: 'suggested', layer: 'design', type: 'Design', title: 'Messages page is not designed yet', targets: [['design', 'messages', 'Messages page'], ['product', 'S5', 'S5 Message a lender']], documents: [], log: [] },
  { id: 'W-S2', state: 'suggested', layer: 'product', type: 'Define', title: 'Define “Return reminders”', targets: [['product', 'S4', 'S4 Return reminders']], documents: [], log: [] },
  { id: 'W-S3', state: 'suggested', layer: 'platform', type: 'Configure', title: 'Set up a production environment', targets: [['platform', 'environments', 'Environments']], documents: [], log: [] },

function render() {
  const [layer = 'home', ...rest] = location.hash.replace(/^#\/?/, '').split('/');

  main.innerHTML = (routes[layer] || home)(rest);
  document.title = `${(nav.find(entry => entry[0] === layer) || ['', '', 'Home'])[2]} · Tool Share · Aludel prototype`;
  main.focus({ preventScroll: true }); window.scrollTo(0, 0);
}

function tabs(base, items, active) {

}

  const head = `<p class="eyebrow">Work · the shared bench</p><h1>Everything to do, from every layer</h1><p class="lead">Agents and people pick up items the same way. Questions stay on the item that raised them; answers land in the layer they change.</p>` + tabs('work', [['queue', 'Queue'], ['routines', 'Routines'], ['style', 'Working style']], section);
  if (section === 'routines') return head + `<div class="table-wrap" tabindex="0" role="region" aria-label="Routines"><table><thead><tr><th>Routine</th><th>Layer</th><th>Runs</th><th>Last run</th><th>Next</th><th>Creates</th></tr></thead><tbody>${routines.map(r => `<tr><td><strong>${r.title}</strong></td><td>${layerChip(r.layer)}</td><td>${r.every}</td><td>${r.last}</td><td>${r.next}</td><td class="small">${r.creates}</td></tr>`).join('')}</tbody></table></div><a class="btn ghost small" href="#/work/routines" style="margin-top:14px">${icon('add')}Add routine</a>`;
  if (section === 'style') return head + `<div class="row" style="margin-bottom:12px"><span>Working style for Tool Share:</span><div class="toggle" role="group" aria-label="Working style"><button class="on" aria-pressed="true">Dreamer</button><button aria-pressed="false">Planner</button><button aria-pressed="false">Tinkerer</button></div></div>
    <p class="muted">The style decides which kinds of work are staged and handed to agents automatically. It isn't stored on a task; you can reassign any single item.</p>
    <div class="table-wrap" tabindex="0" role="region" aria-label="Automation by working style"><table><thead><tr><th>Work type</th><th>Layer</th><th>Dreamer (current)</th><th>Planner</th><th>Tinkerer</th></tr></thead><tbody>${policy.map(row => `<tr>${row.map((cell, i) => `<td>${i === 2 ? `<strong>${cell}</strong>` : cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <section class="card" style="margin-top:18px" aria-labelledby="ins-h"><h2 id="ins-h">Agent instructions</h2><p class="muted small">Work's own documentation: how agents approach each work type in this project. Versioned like any record.</p><ul class="list">${['Product agent: draft stories as “someone can…” with 2–4 acceptance examples', 'Design agent: offer at most two options; always use system tokens', 'Coding agent: one story per build; keep page-blocks until a page is real'].map(line => `<li class="item"><span class="body">${line}</span></li>`).join('')}</ul></section>`;
  const group = (states, title, quiet) => { const list = work.filter(w => states.includes(w.state)); if (!list.length) return ''; const inner = `<ul class="list card" style="padding:4px 16px">${list.map(workRow).join('')}</ul>`; return quiet ? `<details class="quiet"><summary>${title} · ${list.length}</summary>${inner}</details>` : `<div class="section-title"><h2>${title}</h2><span class="count">${list.length}</span></div>${inner}`; };
  return head + `<div class="row" style="gap:6px;flex-wrap:wrap"><span class="small muted">Show:</span>${['All', 'Product', 'Design', 'Platform'].map((label, i) => `<button class="btn ${i ? 'ghost' : ''} small" aria-pressed="${i === 0}">${label}</button>`).join('')}</div>
    ${group(['needs-input'], 'Needs you')}${group(['review'], 'In review')}${group(['claimed'], 'In progress')}${group(['ready'], 'Ready to pick up')}${group(['suggested'], 'Suggested by the layers (not queued yet)', true)}${group(['done'], 'Done recently', true)}`;
}

function workItem(id) {
  const item = work.find(w => w.id === id) || work[0];
  const who = item.who === 'agent' ? 'agent' : item.who === 'person' ? 'person' : '';
  return `<p class="eyebrow"><a href="#/work/queue">Work</a> · ${item.id}</p><div class="row" style="flex-wrap:wrap"><h1 style="margin:0">${esc(item.title)}</h1>${layerChip(item.layer)}<span class="chip ${stateChip[item.state]}">${stateLabel[item.state]}</span></div><p class="muted">${esc(item.type)} work from the ${item.layer.charAt(0).toUpperCase() + item.layer.slice(1)} layer</p>
  <div class="grid g-side"><div>
    ${item.question ? `<section class="question" aria-labelledby="qq"><h2 id="qq">${icon('help')} ${esc(item.question.text)}</h2><p class="small">${esc(item.question.why)}</p>${item.id === 'W-14' ? `<div class="canvas" style="margin:10px 0">${[['grid', 'A · Card grid'], ['map', 'B · Map above a list']].map(([kind, label]) => `<figure class="option" style="margin:0">${phoneMock(kind)}<figcaption>${label}</figcaption></figure>`).join('')}</div>` : ''}
      <div class="choices">${item.question.options.map(option => `<button class="btn ghost">${esc(option)}</button>`).join('')}</div><label class="small" style="display:block;margin-top:10px">Why (saved with the decision)<br><textarea rows="2" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px"></textarea></label></section>` : ''}
    ${item.state === 'review' ? `<section class="question" aria-labelledby="rv"><h2 id="rv">${icon('preview')} Review preview build 7c1e2a4</h2><p class="small">Try it on the preview, then accept it or ask for changes. Accepting makes S8 Built.</p><div class="choices"><a class="btn" href="#/platform">Open preview</a><button class="btn ghost">Accept</button><button class="btn ghost">Ask for changes</button></div></section>` : ''}
    <section class="card" aria-labelledby="ctx"><h2 id="ctx">What this work needs</h2><p class="muted small">The same context an agent receives. Everything links back to its layer.</p><div class="connected">${item.targets.map(t => `<a href="${targetHref(t)}">${layerChip(t[0])} ${esc(t[2])}</a>`).join('')}<a href="#/design/system">${layerChip('design')} Design system · Mobile-first social</a><a href="#/product/vision">${layerChip('product')} Vision and outcomes</a><a href="#/work/style">${layerChip('work')} Agent instructions</a></div></section>
    <section class="card" style="margin-top:18px" aria-labelledby="docs"><h2 id="docs">Will document</h2><p class="muted small">Closing this item means these records were created or revised. The log below is not documentation.</p>${item.documents.length ? `<ul>${item.documents.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : '<p class="note">Decided when the item is staged.</p>'}</section>
    ${item.log.length ? `<details class="quiet" style="margin-top:14px"><summary>Activity log · ${item.log.length}</summary><ol class="small">${item.log.map(l => `<li>${esc(l)}</li>`).join('')}</ol></details>` : ''}
  </div>
  <aside class="card side" aria-labelledby="who-h"><h2 id="who-h">Who's on it</h2>${item.state === 'suggested' ? `<p class="muted">Not queued yet.</p><div class="row"><button class="btn">Start now</button><button class="btn ghost">Add to queue</button></div>` : `<div class="toggle" role="group" aria-label="Assignee"><button class="${who === 'agent' ? 'on' : ''}" aria-pressed="${who === 'agent'}">${icon('smart_toy')} Agent</button><button class="${who === 'person' ? 'on' : ''}" aria-pressed="${who === 'person'}">${icon('person')} Me</button></div><p class="small muted" style="margin-top:10px">${who === 'agent' ? `${esc(item.agent)} picked this up because Dreamer hands ${esc(item.type.toLowerCase())} work to agents. Take it over at any time.` : 'You picked this up. Hand it to an agent at any time; it gets exactly this page.'}</p>`}</aside></div>`;
}

function settings() {
  return `<p class="eyebrow">Settings</p><h1>Tool Share settings</h1><div class="grid g2"><section class="card"><h2>Project</h2><dl class="kv"><dt>Name</dt><dd>Tool Share</dd><dt>Address</dt><dd>tool-share.localhost</dd><dt>Members</dt><dd>You (owner)</dd></dl></section><section class="card"><h2>Working style</h2><p>Dreamer · <a href="#/work/style">change in Work</a></p></section></div>`;
}

// Global search across every layer's records.
const index = [
  ...stories.map(s => ({ layer: 'Product', text: `${s.title}`, sub: `${s.feature.title} · ${statusLabel[s.status]}`, href: `#/product/features/${s.id}` })),
  ...features.map(f => ({ layer: 'Product', text: f.title, sub: f.summary, href: `#/product/features/${f.stories[0].id}` })),
  ...pages.map(p => ({ layer: 'Design', text: `${p.label} page`, sub: p.status, href: `#/design/pages/${p.id}` })),
  ...work.map(w => ({ layer: 'Work', text: w.title, sub: `${w.id} · ${stateLabel[w.state]}`, href: `#/work/item/${w.id}` })),
  ...stories.flatMap(s => s.history.map(h => ({ layer: 'Decisions', text: h.text, sub: `${s.title} · ${h.date}`, href: `#/product/features/${s.id}` }))),
  { layer: 'Platform', text: 'Environments', sub: 'Preview running · production not set up', href: '#/platform' }
];
const q = document.getElementById('q'); const results = document.getElementById('results');
q.addEventListener('input', () => {
  const term = q.value.trim().toLowerCase();
  if (!term) { results.hidden = true; return; }
  const hits = index.filter(entry => `${entry.text} ${entry.sub}`.toLowerCase().includes(term));
  const groups = [...new Set(hits.map(hit => hit.layer))];
  results.innerHTML = hits.length ? groups.map(group => `<h3>${group}</h3>${hits.filter(h => h.layer === group).slice(0, 5).map(h => `<a href="${h.href}"><span>${esc(h.text)}</span><small>${esc(h.sub)}</small></a>`).join('')}`).join('') : '<p class="muted small" style="padding:8px 10px">Nothing matches.</p>';
  results.hidden = false;
});
results.addEventListener('click', () => { results.hidden = true; q.value = ''; });
document.addEventListener('keydown', event => { if (event.key === 'Escape') { results.hidden = true; } if (event.key === '/' && document.activeElement !== q) { event.preventDefault(); q.focus(); } });
render();
</script>
</body>
</html>
