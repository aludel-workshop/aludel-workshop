<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aludel Vision and Plan</title>
<!-- ROADMAP-01P prototype v3: owner review of v2 applied (W1-W10 in ../work-record.md). One colour per layer, universal record chips with quick views, Linear-style projects timeline and project page, Jira-style item side panel, Roles/Team with elevated actions. Static; illustrative Tool Share data. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<style>
:root{
  --bg:#fafbff;--surface:#ffffff;--rail:#f0f4fc;--panel:#f3f6fd;--hover:#e3e9f7;--line:#dce2ef;--line-strong:#c5cee2;--ink:#141727;--muted:#52617d;
  --primary:#3047b9;--on-primary:#ffffff;--container:#dfe5ff;--on-container:#163698;
  --product:#6b35c9;--product-bg:#efe7ff;--design:#b3245f;--design-bg:#ffe4ee;--pages:#1f4fb8;--pages-bg:#e6eefe;--data:#0b5d86;--data-bg:#dcf0fb;
  --platform:#0f7465;--platform-bg:#d9f3ec;--work:#8a5300;--work-bg:#fff0d4;
  --ok:#146446;--ok-bg:#d9f3e7;--warn:#6b4b00;--warn-bg:#fff0c9;--warn-line:#e0a100;--bad:#a1231f;--bad-bg:#fce1e0;
  --p-highest:#c9190b;--p-high:#e0531f;--p-medium:#b78103;--p-low:#2463d1;--p-lowest:#6b8fcf;
  --shadow:0 18px 50px #1c2a5a26;--shadow-card:0 1px 2px #1c2a5a12;--code-bg:#141727;--code-ink:#e8ebf7;--code-add:#1d4b35;--code-del:#5a2022;
  --person:#2f3a57;--mix:#ffffff;--shot-bg:#fff7fa;--shot-ink:#171a24;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10121a;--surface:#181b26;--rail:#141722;--panel:#1f2331;--hover:#262b3c;--line:#2b3144;--line-strong:#3a4259;--ink:#e6e9f5;--muted:#9da8c2;
  --primary:#a3b3ff;--on-primary:#0f1a55;--container:#2b3670;--on-container:#e0e6ff;
  --product:#cdb1ff;--product-bg:#2d2150;--design:#ffa3c6;--design-bg:#461a2e;--pages:#a6c2ff;--pages-bg:#1c2b52;--data:#8fd3f5;--data-bg:#10334a;
  --platform:#86e0cb;--platform-bg:#0f3932;--work:#ffc774;--work-bg:#3d2b0c;
  --ok:#94e2bc;--ok-bg:#12392a;--warn:#ffd680;--warn-bg:#3b2d0b;--warn-line:#b88400;--bad:#ffaca7;--bad-bg:#491a1a;
  --p-highest:#ff7b72;--p-high:#ff9a66;--p-medium:#f2c14e;--p-low:#7fb0ff;--p-lowest:#a7bfe6;
  --shadow:0 18px 50px #00000080;--shadow-card:0 1px 2px #00000060;--code-bg:#0b0d14;--code-ink:#dfe3f2;--code-add:#16402c;--code-del:#4d1b1d;
  --person:#4a5577;--mix:#11131a;--shot-bg:#fff7fa;--shot-ink:#171a24;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121a;--surface:#181b26;--rail:#141722;--panel:#1f2331;--hover:#262b3c;--line:#2b3144;--line-strong:#3a4259;--ink:#e6e9f5;--muted:#9da8c2;
  --primary:#a3b3ff;--on-primary:#0f1a55;--container:#2b3670;--on-container:#e0e6ff;
  --product:#cdb1ff;--product-bg:#2d2150;--design:#ffa3c6;--design-bg:#461a2e;--pages:#a6c2ff;--pages-bg:#1c2b52;--data:#8fd3f5;--data-bg:#10334a;
  --platform:#86e0cb;--platform-bg:#0f3932;--work:#ffc774;--work-bg:#3d2b0c;
  --ok:#94e2bc;--ok-bg:#12392a;--warn:#ffd680;--warn-bg:#3b2d0b;--warn-line:#b88400;--bad:#ffaca7;--bad-bg:#491a1a;
  --p-highest:#ff7b72;--p-high:#ff9a66;--p-medium:#f2c14e;--p-low:#7fb0ff;--p-lowest:#a7bfe6;
  --shadow:0 18px 50px #00000080;--shadow-card:0 1px 2px #00000060;--code-bg:#0b0d14;--code-ink:#dfe3f2;--code-add:#16402c;--code-del:#4d1b1d;
  --person:#4a5577;--mix:#11131a;--shot-bg:#fff7fa;--shot-ink:#171a24;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg)}
a{color:var(--primary)}button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.icon{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;display:inline-block;vertical-align:middle;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;flex:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code,.mono{font-family:"Roboto Mono",ui-monospace,monospace;font-size:.9em}
.tabular{font-variant-numeric:tabular-nums}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--rail) 232px,transparent 232px)}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;padding:4px 10px 12px;color:var(--ink);text-decoration:none}.brand .icon{color:var(--primary);font-size:28px}
.project{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;color:var(--ink);text-decoration:none}
.project .mark{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#ca3e6f;color:#fff;font-weight:700;font-size:13px}.project small{display:block;color:var(--muted);font-size:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--hover)}.nav a.active{background:var(--container);color:var(--on-container);font-weight:700}
.nav .badge{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-size:12px;display:grid;place-items:center}
.rail .spacer{flex:1}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 32px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.search{position:relative;flex:1;max-width:520px}.search input{width:100%;padding:9px 14px 9px 40px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search .icon{position:absolute;left:12px;top:9px;color:var(--muted)}
.content{padding:26px 32px 110px;max-width:1320px}
.eyebrow{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.eyebrow a{color:inherit;text-decoration:none}.eyebrow a:hover{color:var(--primary);text-decoration:underline}
h1{font-size:30px;line-height:1.15;margin:0 0 6px}h2{font-size:18px;margin:0}h3{font-size:15px;margin:0}
.lead{color:var(--muted);font-size:16px;margin:0 0 20px;max-width:720px}
.muted{color:var(--muted)}.small{font-size:13.5px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.push{margin-left:auto}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 22px;overflow-x:auto}
.tabs a{padding:10px 16px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.active{color:var(--ink);border-color:var(--primary)}
.subtabs{display:flex;gap:18px}
.subtabs button{border:0;background:none;padding:6px 0;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--primary)}
.subtabs .n{font-size:11.5px;min-width:20px;padding:0 6px;border-radius:999px;background:var(--panel);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;line-height:18px}
.chip .icon{font-size:15px}
.l-product{background:var(--product-bg);color:var(--product)}.l-design{background:var(--design-bg);color:var(--design)}.l-pages{background:var(--pages-bg);color:var(--pages)}
.l-data{background:var(--data-bg);color:var(--data)}.l-platform{background:var(--platform-bg);color:var(--platform)}.l-work{background:var(--work-bg);color:var(--work)}
.s-ok{background:var(--ok-bg);color:var(--ok)}.s-warn{background:var(--warn-bg);color:var(--warn)}.s-bad{background:var(--bad-bg);color:var(--bad)}.s-plain{background:var(--panel);color:var(--muted)}.s-info{background:var(--container);color:var(--on-container)}

/* Reference chips + hover cards (A3) */
.ref{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:1px 8px 1px 5px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;line-height:20px;vertical-align:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref .icon{font-size:15px}
.ref:hover,.ref:focus-visible{border-color:var(--primary);background:var(--panel)}
.ref.k-product .icon{color:var(--product)}.ref.k-design .icon{color:var(--design)}.ref.k-pages .icon{color:var(--pages)}.ref.k-data .icon{color:var(--data)}.ref.k-platform .icon{color:var(--platform)}.ref.k-work .icon{color:var(--work)}
.ref .rid{color:var(--muted);font-weight:700;font-size:12px}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.prose .ref{margin:0 1px}
.hovercard{position:fixed;z-index:60;width:320px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;font-size:13.5px}
.hovercard[hidden]{display:none}
.hc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.hc-head .rid{font-weight:700;color:var(--muted);font-size:12px}
.hovercard strong{display:block;font-size:14.5px;line-height:1.35;margin-bottom:4px}
.hovercard p{margin:0 0 8px;color:var(--muted)}
.hovercard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 8px}.hovercard dt{color:var(--muted)}.hovercard dd{margin:0}
.hc-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px;color:var(--muted);font-size:12.5px}
.hc-foot a{margin-left:auto;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:2px}

/* Avatars: people are initials; agents are seeded robots on a metal tile (B5) */
.avatar{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--person);color:#fff;font-size:10.5px;font-weight:700;flex:none;overflow:hidden}
.avatar.bot{border-radius:7px;background:linear-gradient(145deg,color-mix(in srgb,var(--metal) 18%,var(--mix)),color-mix(in srgb,var(--metal) 42%,var(--mix)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--metal) 70%,transparent);color:var(--metal)}
.avatar.bot img{width:88%;height:88%;display:block}
.avatar.bot .icon{font-size:16px}
.avatar.template{border-radius:7px;background:var(--work-bg);color:var(--work)}.avatar.template .icon{font-size:16px}
.avatar.lg{width:36px;height:36px;font-size:13px}.avatar.lg.bot{border-radius:10px}.avatar.lg .icon{font-size:22px}
.avatar.xl{width:84px;height:84px;border-radius:20px}
.metal-name{font-weight:500}

/* Split assignee chip */
.split{display:inline-flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);overflow:hidden;height:28px;vertical-align:middle;flex:none;max-width:100%}
.split.agent{border-color:color-mix(in srgb,var(--metal) 55%,var(--line-strong));background:linear-gradient(90deg,color-mix(in srgb,var(--metal) 10%,var(--surface)),var(--surface) 70%)}
.split button{border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.split .who{padding:0 10px 0 3px;font-size:13px;font-weight:500;min-width:0}
.split .who span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.split .drop{padding:0 6px;border-left:1px solid var(--line)}.split .drop .icon{font-size:18px;color:var(--muted)}
.split button:hover:not(:disabled){background:color-mix(in srgb,var(--panel) 70%,transparent)}
.split .drop:disabled{cursor:not-allowed}.split .drop:disabled .icon{opacity:.45}
.split.warn{border-color:var(--warn-line)}

/* Role · action chip (B6) */
.role{display:inline-flex;align-items:center;gap:5px;padding:2px 10px 2px 6px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;text-decoration:none;line-height:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.role .icon{font-size:15px}.role .act{font-weight:500;opacity:.9}

/* Priority (B13): Jira's five levels */
.prio{display:inline-grid;place-items:center;width:20px;height:20px;flex:none}
.prio .icon{font-size:20px}
.p-highest{color:var(--p-highest)}.p-high{color:var(--p-high)}.p-medium{color:var(--p-medium)}.p-low{color:var(--p-low)}.p-lowest{color:var(--p-lowest)}
.prio-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:2px 10px 2px 4px;cursor:pointer;font-size:13px}
.blocked{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--bad);white-space:nowrap}
.blocked .icon{font-size:16px}

/* Menus */
.menu{position:fixed;z-index:70;min-width:240px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.menu[hidden]{display:none}
.menu h4{margin:8px 10px 4px;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer;font-size:14px}
.menu button:hover:not(:disabled),.menu button:focus-visible{background:var(--panel)}
.menu button:disabled{cursor:not-allowed;opacity:.55}
.menu button small{display:block;color:var(--muted);font-size:12px}
.menu .check{margin-left:auto;color:var(--primary)}
.menu .note{margin:4px 10px 6px;font-size:12px;color:var(--muted)}
.menu .note.warn{color:var(--warn)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 15px;border-radius:999px;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:500;cursor:pointer;text-decoration:none;font-size:13.5px;white-space:nowrap}
.btn .icon{font-size:18px}
.btn.ghost{background:transparent;color:var(--primary)}.btn.small{padding:4px 12px;font-size:13px}.btn.small .icon{font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.quiet{border-color:var(--line-strong);color:var(--ink);background:var(--surface)}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.ok{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.linkbtn{border:0;background:none;color:var(--primary);cursor:pointer;padding:0;font-size:13px}

/* Board */
.section-head{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.section-head h2{font-size:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.panel h2{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.proto{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:8px;align-items:center;background:var(--code-bg);color:var(--code-ink);padding:6px 6px 6px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:12.5px;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.proto label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.proto input{accent-color:#a3b3ff}
.proto button{border:0;border-radius:999px;padding:5px 12px;background:#ffffff1f;color:inherit;cursor:pointer;font-size:12.5px}
.proto button:hover{background:#ffffff33}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:80;overflow:auto;padding:22px 22px calc(40px + env(safe-area-inset-bottom,0px))}
.drawer[hidden]{display:none}
.drawer h2{font-size:20px;margin:0 0 4px}
.drawer .x{position:absolute;right:14px;top:14px;border:0;background:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:50%}
.drawer .x:hover{background:var(--panel)}
.drawer h3{margin:18px 0 0;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.ledger{list-style:none;margin:8px 0 0;padding:0}
.ledger li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:10px 6px;border-top:1px solid var(--line);font-size:13.5px}
.ledger .n{font-weight:700;color:var(--muted)}
.ledger p{margin:0}.ledger .ans{color:var(--muted);margin-top:4px}
.ledger a{font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);max-width:min(560px,calc(100vw - 32px))}
.toast[hidden]{display:none}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--primary)}100%{box-shadow:0 0 0 3px transparent}}
/* ---------- ROADMAP-01P additions ---------- */
.shell>div{min-width:0}
.nav-sep{height:1px;background:var(--line);margin:8px 10px}
.nav small.new{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--primary)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.stackv{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-card)}
.card>h2{display:flex;align-items:center;gap:8px;margin:0 0 4px}
.card>.hint{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.sticky{position:sticky;top:76px}
.sec-num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--panel);color:var(--muted);font-size:12px;font-weight:700;flex:none}
.claims{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.claim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:10px}
.claim:hover{background:var(--panel)}
.claim p{margin:0}
.claim small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.conf{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:2px 6px;border-radius:999px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.conf .icon{font-size:16px}
.conf:hover{background:var(--hover)}
.conf.assumed{color:var(--muted)}
.conf.evidenced{color:var(--pages)}
.conf.validated{color:var(--ok)}
.conf.contradicted{color:var(--bad)}
.ev{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 8px 0 5px;font-size:12px;line-height:20px;color:var(--muted);cursor:pointer;white-space:nowrap}
.ev .icon{font-size:14px}
.ev:hover{border-color:var(--primary);color:var(--ink)}
.ev .against{color:var(--bad);font-weight:700}
.statement{font-size:20px;line-height:1.4;margin:4px 0 2px;font-weight:500}
.collapsed{border-style:dashed;background:transparent;box-shadow:none}
.risk{list-style:none;margin:0;padding:0;counter-reset:r}
.risk li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.risk li:first-child{border-top:0}
.risk li::before{counter-increment:r;content:counter(r);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:12px}
.risk p{margin:0 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin:0 0 16px}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend .icon{font-size:16px}

/* Opportunity tree */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:22px;padding-left:16px;border-left:2px solid var(--line)}
.node{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;margin:6px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.node .kind{font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;color:var(--muted);min-width:86px}
.node.outcome{background:var(--container);border-color:transparent}.node.outcome .kind{color:var(--on-container)}
.node.opp .kind{color:var(--product)}
.node.cap{background:var(--panel)}
.node .title{font-weight:500}
.node .who{font-size:12.5px;color:var(--muted)}
.node .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.node.focus{box-shadow:0 0 0 2px var(--primary)}
.twisty{border:0;background:none;cursor:pointer;padding:0;color:var(--muted);display:inline-grid}

/* Story map */
.map-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.smap{display:grid;gap:6px;padding:12px;min-width:900px}
.smap .act{background:var(--product-bg);color:var(--product);font-weight:700;border-radius:10px;padding:8px 10px;font-size:13.5px}
.smap .step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:500}
.smap .band{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:6px 10px;border-top:2px solid var(--line-strong);margin-top:6px;font-size:13px}
.smap .band.current{border-color:var(--primary)}
.smap .band strong{font-size:13.5px}
.smap .cell{display:grid;gap:6px;align-content:start;min-height:34px}
.scard{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px;cursor:pointer;box-shadow:var(--shadow-card)}
.scard:hover{border-color:var(--primary)}
.scard .meta{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--muted);font-size:11.5px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.st-proposed{background:var(--line-strong)}.st-defined{background:var(--p-medium)}.st-designed{background:var(--pages)}.st-built{background:var(--ok)}

/* Evidence drawer */
.insight{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:var(--surface)}
.insight.contra{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.insight header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.insight header .rid{font-size:12px;font-weight:700;color:var(--muted)}
.insight h4{margin:0;font-size:14.5px;flex-basis:100%}
.finding{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;padding:8px 0 0;font-size:13.5px}
.finding .icon{font-size:17px;color:var(--muted);margin-top:1px}
.finding q{font-style:italic}
.finding .src{display:block;color:var(--muted);font-size:12.5px}
.finding .src a{color:inherit}
.shot{border:1px solid var(--line);border-radius:10px;background:var(--shot-bg);color:var(--shot-ink);padding:10px;margin-top:6px;font-size:12px}
.shot .fake{display:grid;gap:5px}.shot .fake i{display:block;height:8px;border-radius:4px;background:#d9dbe6}.shot .fake i.hl{background:#ffd76a;outline:2px solid #c98f00}
.dirpick{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
.dirpick button{border:0;background:none;padding:3px 10px;font-size:12.5px;cursor:pointer}
.dirpick button[aria-pressed="true"]{background:var(--container);color:var(--on-container);font-weight:700}
.attach{border:1px dashed var(--line-strong);border-radius:14px;padding:12px 14px;margin-top:14px;display:grid;gap:8px}
.attach select{padding:6px 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);max-width:100%}

/* Chart (single series: one hue, direct labels, tooltip, table view) */
.chart{margin-top:8px}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;align-items:end;height:120px;border-bottom:1px solid var(--line-strong);padding:0 4px}
.bar-col{display:grid;justify-items:center;align-content:end;height:100%;position:relative}
.bar-col .v{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:2px}
.bar-col .b{width:62%;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px}
.bar-col:hover .b,.bar-col:focus-visible .b{background:var(--on-container)}
.bar-col .tip{position:absolute;bottom:calc(100% + 4px);background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;visibility:hidden}
.bar-col:hover .tip,.bar-col:focus-visible .tip{visibility:visible}
.bar-x{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;font-size:12px;color:var(--muted);text-align:center;padding:4px 4px 0}
.chart details{margin-top:6px;font-size:12.5px}
.chart table{border-collapse:collapse;margin-top:4px}.chart td,.chart th{padding:2px 10px 2px 0;text-align:left;font-weight:400}

/* Library */
.lib{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.ltree{list-style:none;margin:0;padding:0}
.ltree>li{border-top:1px solid var(--line);padding:10px 0}
.ltree>li:first-child{border-top:0}
.ltree .lh{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 6px}
.ltree ul{list-style:none;margin:0;padding:0 0 0 30px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.ltree ul li>.ref{min-width:0}
.ltree ul li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.srcrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.srcrow:first-child{border-top:0}
.srcrow .ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--panel);color:var(--muted)}
.srcrow button.t{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:500;color:var(--ink)}
.srcrow button.t:hover{color:var(--primary);text-decoration:underline}
.srcrow small{display:block;color:var(--muted);font-size:12.5px}

/* Plan */
.viewswitch{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface)}
.viewswitch a{padding:5px 14px;font-size:13px;text-decoration:none;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.viewswitch a .icon{font-size:17px}
.viewswitch a[aria-current="page"]{background:var(--container);color:var(--on-container);font-weight:700}
.ms{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:14px;margin:0 0 16px}
.ms.current{border-color:color-mix(in srgb,var(--primary) 50%,var(--line))}
.ms-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:0 0 4px}
.ms-head h2{font-size:18px}
.ms dl{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0 0 12px;font-size:13px;color:var(--muted)}.ms dt{display:inline;font-weight:700}.ms dd{display:inline;margin:0 0 0 4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.pcard{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow-card)}
.pcard:hover{border-color:var(--primary)}
.pcard .top{display:flex;gap:8px;align-items:center}
.pcard .rid{font-size:12px;font-weight:700;color:var(--muted)}
.pcard strong{font-size:14.5px;line-height:1.3}
.pcard .foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.pcard .foot .bad{color:var(--bad);font-weight:700;display:inline-flex;gap:3px;align-items:center}
.pcard .foot .icon{font-size:15px}
.lbar{display:flex;gap:2px;height:8px}
.lbar i{flex:1;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.lbar i b{position:absolute;inset:0 auto 0 0;border-radius:4px}
.lbar-legend{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;color:var(--muted)}
.lbar-legend span{display:inline-flex;align-items:center;gap:4px}
.st{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.st-shaping{background:var(--panel);color:var(--muted);border:1px dashed var(--line-strong)}
.st-ready{background:var(--warn-bg);color:var(--warn)}
.st-progress{background:var(--container);color:var(--on-container)}
.st-done{background:var(--ok-bg);color:var(--ok)}
.target{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ink);font-weight:500}.target .icon{font-size:15px;color:var(--muted)}

/* Timeline */
.tl-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.tl{position:relative;display:grid;min-width:980px}
.tl .axis{display:grid;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--panel)}
.tl .axis div{padding:8px 10px;border-left:1px solid var(--line)}
.tl .axis div:first-child{border-left:0}
.tl .lane{display:grid;align-items:center;border-bottom:1px solid var(--line);min-height:64px}
.tl .lane:last-child{border-bottom:0}
.tl .lane-name{padding:8px 12px;font-weight:700;font-size:13.5px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;background:var(--panel);border-right:1px solid var(--line)}
.tl .lane-name small{font-weight:400;color:var(--muted);font-size:12px}
.tbar{margin:8px 6px;padding:6px 10px;border-radius:10px;font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--line-strong);background:var(--surface);position:relative;z-index:2;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow-card)}
.tbar:hover{border-color:var(--primary)}
.tbar.done{background:var(--ok-bg);border-color:transparent}
.tbar.progress{background:var(--container);border-color:transparent;color:var(--on-container)}
.tbar.ready{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.tbar.shaping{border-style:dashed}
.tbar .rid{font-weight:700;font-size:11.5px;opacity:.8}
.tbar.late{box-shadow:0 0 0 2px var(--bad)}
.tbar .early{display:inline-flex;align-items:center;gap:3px;color:var(--bad);font-weight:700;font-size:11.5px}.tbar .early .icon{font-size:14px}
.tl svg{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
.tl svg path{fill:none;stroke:var(--line-strong);stroke-width:2}
.tl svg path.bad{stroke:var(--bad);stroke-dasharray:5 4}
.tl svg .arrow{fill:var(--line-strong)}.tl svg .arrow.bad{fill:var(--bad)}

/* Project page */
.pdetail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.brief-sec{margin:0 0 18px}
.brief-sec h3{font-size:12px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:0 0 4px;display:flex;align-items:center;gap:8px}
.brief-sec p,.brief-sec ul{margin:0}
.brief-sec ul{padding-left:20px}
.req{list-style:none;padding:0!important;display:grid;gap:6px}
.req li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;font-size:14px}
.req code{font-weight:700;color:var(--muted)}
.appetite{display:flex;flex-wrap:wrap;gap:8px}
.appetite span{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:10px;background:var(--panel);font-size:13px}
.appetite .icon{font-size:17px;color:var(--muted)}
.scope{list-style:none;margin:0;padding:0}
.scope>li{border-top:1px solid var(--line);padding:10px 0}
.scope>li:first-child{border-top:0}
.scope h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:13.5px}
.scope h3 .n{font-weight:400;color:var(--muted)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0 5px 4px;font-size:13.5px}
.item .rid{font-size:12px;font-weight:700;color:var(--muted)}
.item .why{display:block;font-size:12px;color:var(--muted)}
.item .why.bad{color:var(--bad)}
.istate{font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.istate .icon{font-size:16px}
.istate.done{color:var(--ok)}.istate.blocked{color:var(--bad)}.istate.batched{color:var(--on-container)}.istate.backlog,.istate.queued{color:var(--muted)}.istate.review{color:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.callout{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--container);color:var(--on-container);font-size:13.5px;margin:0 0 16px}
.callout .icon{font-size:19px}
.callout.warn{background:var(--warn-bg);color:var(--warn)}

/* Board (simplified from WORK-UX-01) */
.lanes2{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;margin:0 0 26px;align-items:start}
.blane{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px}
.blane-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blane-head small{display:block;color:var(--muted);font-size:12px}
.blane-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13.5px}
.bcard .rid{font-size:12px;font-weight:700;color:var(--muted);margin-right:6px}
.bcard .sub{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.bcard.new{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 25%,transparent)}
.pchip{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:0 6px;background:var(--work-bg);color:var(--work);font-weight:700;font-size:11.5px;text-decoration:none;line-height:18px}
.qgroup{margin:0 0 14px}
.qgroup h3{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:0 0 6px}
.fill-list{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
.fill-list li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:12px;font-size:13.5px}
.fill-list li.skip{opacity:.65}
.fill-list small{display:block;color:var(--muted);font-size:12.5px}

/* Team */
.roles{display:grid;gap:12px}
.rolecard{display:grid;grid-template-columns:240px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rolecard.newrole{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 20%,transparent)}
.rolecard>header{padding:14px 16px;border-right:1px solid var(--line);background:var(--panel)}
.rolecard>header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.rolecard ul{list-style:none;margin:0;padding:6px 16px}
.rolecard li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.rolecard li:first-child{border-top:0}
.rolecard li small{color:var(--muted)}
.tag-new{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--container);color:var(--on-container)}
.tag-moved{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}

/* Home */
.homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start}
.bigbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:8px 0 6px}
.bigbar i{display:block}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mini li{display:flex;gap:8px;align-items:center;font-size:13.5px;flex-wrap:wrap}
.mini li .push{font-size:12px}
.plainlist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px}.plainlist .icon{font-size:17px;color:var(--muted);margin-right:4px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary);animation:pulse 1.6s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.live{animation:none}}

@media (max-width:1100px){.grid2,.pdetail{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;background:none}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 16px}
  .rail .spacer,.project,.nav-sep{display:none}.nav{display:flex;flex-wrap:wrap;gap:2px}.nav a{padding:6px 10px}
  .content,.topbar{padding-left:16px;padding-right:16px}
  .lanes2{grid-template-columns:1fr}
  .rolecard{grid-template-columns:1fr}.rolecard>header{border-right:0;border-bottom:1px solid var(--line)}
  .node .kind{min-width:0}
  .tree ul{margin-left:8px;padding-left:10px}
  .pgrid{grid-template-columns:1fr}
  .item{grid-template-columns:auto minmax(0,1fr)}.item .istate{grid-column:2}
}

/* ---------- v2 additions ---------- */
.lane-empty{padding:14px;border:1px dashed var(--line-strong);border-radius:14px;color:var(--muted);font-size:13.5px;text-align:center;margin:0}
.rolecard2.newrole{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 20%,transparent)}
.chipev{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 9px 1px 6px;font-size:12px;font-weight:500;line-height:20px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chipev .icon{font-size:15px}
.chipev:hover,.chipev:focus-visible{border-color:var(--primary)}
.chipev .sep{opacity:.5}
.chipev.assumed{color:var(--muted)}
.chipev.evidenced{color:var(--pages);border-color:color-mix(in srgb,var(--pages) 35%,var(--line))}
.chipev.validated{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.chipev.contradicted{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.chipev.plain{color:var(--muted)}
.claim .tools{display:flex;gap:2px;align-items:center}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:8px;display:inline-grid;place-items:center}
.iconbtn:hover,.iconbtn:focus-visible{background:var(--hover);color:var(--ink)}
.iconbtn .icon{font-size:18px}
.claim .tools .iconbtn{opacity:0}
.claim:hover .tools .iconbtn,.claim:focus-within .tools .iconbtn{opacity:1}
@media (hover:none){.claim .tools .iconbtn{opacity:1}}
.addrow{display:flex;gap:8px;margin:8px 10px 0;flex-wrap:wrap}
.addrow input,.editin{flex:1 1 240px;min-width:0;padding:7px 10px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
.editrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%}
.linked{font-size:12px;color:var(--muted)}
.linked.none{color:var(--warn)}
.personas{display:flex;flex-wrap:wrap;gap:6px;margin:0 10px 8px;align-items:center}
.pchip2{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px;border-radius:999px;background:var(--product-bg);color:var(--product);font-size:13px;font-weight:500}
.pchip2 .avatar{background:var(--product);width:20px;height:20px;font-size:10px}

/* Documents */
.doclist{display:grid;gap:8px}
.docrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-decoration:none;color:var(--ink)}
.docrow:hover{border-color:var(--primary)}
.docrow .ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--product-bg);color:var(--product)}
.docrow small{display:block;color:var(--muted);font-size:12.5px}
.docbody{font-size:15.5px;line-height:1.65;max-width:740px}
.docbody h2{font-size:22px;margin:0 0 10px}.docbody h3{font-size:16px;margin:18px 0 6px}
.docbody p{margin:0 0 12px}
.stale{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;margin:0 0 16px}
.fresh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-size:13.5px;margin:0 0 16px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.switch input{width:36px;height:20px;accent-color:var(--primary)}

/* Library v2 */
.filters2{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 14px}
.filters2 label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.filters2 select{padding:5px 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:13px}
.icard{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;display:grid;gap:8px}
.icard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.icard .top .rid{font-size:12px;font-weight:700;color:var(--muted)}
.icard strong{font-size:15px}
.icard details summary{cursor:pointer;font-size:13px;color:var(--muted)}
.strength{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--panel);color:var(--muted)}
.strength.strong{background:var(--ok-bg);color:var(--ok)}.strength.moderate{background:var(--container);color:var(--on-container)}
.usedin{display:flex;flex-wrap:wrap;gap:6px}
.usedin .ref.contra{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.srcpage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.transcript{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 22px;font-size:15px;line-height:1.7}
.transcript p{margin:0 0 12px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px}
.transcript .sp{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding-top:3px}
.transcript mark{background:#ffe89a;color:#171a24;border-radius:3px;padding:0 1px;cursor:pointer;box-shadow:0 2px 0 #d8a800}
.transcript mark:focus-visible{outline:2px solid var(--primary)}
.selpop{position:absolute;z-index:40;display:flex;gap:6px;background:var(--ink);color:var(--bg);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.selpop button{border:0;background:none;color:inherit;font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.selpop button:hover{background:#ffffff26}
.selpop[hidden]{display:none}
.newfind{border:1px dashed var(--primary);border-radius:14px;padding:12px 14px;display:grid;gap:10px;background:color-mix(in srgb,var(--container) 25%,var(--surface))}
.newfind blockquote{margin:0;padding:6px 10px;border-left:3px solid #d8a800;background:var(--panel);border-radius:0 8px 8px 0;font-style:italic}
.newfind select,.newfind input{padding:6px 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);width:100%}

/* Items list (Linear-style) */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px}
.toolbar label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.toolbar select{padding:5px 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:13px}
.ilist{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.igroup>summary{list-style:none;display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--panel);border-top:1px solid var(--line);cursor:pointer;font-size:13.5px;font-weight:700}
.igroup:first-child>summary{border-top:0}
.igroup>summary::-webkit-details-marker{display:none}
.igroup>summary .n{font-weight:400;color:var(--muted)}
.igroup>summary .chev{transition:transform .15s;color:var(--muted)}
.igroup[open]>summary .chev{transform:rotate(90deg)}
.irow{display:grid;grid-template-columns:22px 52px minmax(0,1fr) auto auto 26px 22px;gap:10px;align-items:center;padding:7px 14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink);text-decoration:none}
.irow:hover{background:var(--panel)}
.irow .rid{font-size:12px;font-weight:700;color:var(--muted)}
.irow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .blk{color:var(--bad);display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700}
.irow .blk .icon{font-size:15px}
.lbl{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 8px;line-height:20px;white-space:nowrap}
.lbl i{width:7px;height:7px;border-radius:50%;display:inline-block}
.sicon .icon{font-size:18px}
.sicon.s-backlog{color:var(--line-strong)}.sicon.s-queued{color:var(--muted)}.sicon.s-batched{color:var(--p-medium)}.sicon.s-review{color:var(--primary)}.sicon.s-done{color:var(--ok)}
.pr .icon{font-size:18px}
.pr.highest{color:var(--p-highest)}.pr.high{color:var(--p-high)}.pr.medium{color:var(--p-medium)}.pr.low{color:var(--p-low)}.pr.lowest{color:var(--p-lowest)}

/* Projects list */
.ptable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.ptable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
.ptable th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.ptable td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.ptable tr.mhead td{background:var(--panel);font-weight:700;border-top:1px solid var(--line-strong)}
.ptable tr.mhead td small{font-weight:400;color:var(--muted);margin-left:8px}
.ptable a{color:var(--ink);text-decoration:none;font-weight:500}.ptable a:hover{color:var(--primary);text-decoration:underline}
.health{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap}
.health i{width:9px;height:9px;border-radius:50%;display:inline-block}
.budget{display:grid;gap:3px;min-width:120px;font-size:12px;color:var(--muted)}
.budget .track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.budget .track b{display:block;height:100%;background:var(--data);border-radius:3px}
.pst{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap}
.pst .icon{font-size:17px}
.pst.backlog{color:var(--muted)}.pst.planned{color:var(--muted)}.pst.progress{color:var(--p-medium)}.pst.completed{color:var(--ok)}
.pct{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}

/* Calendar timeline */
.tlbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 10px}
.cal{position:relative;overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);max-height:640px}
.cal-inner{position:relative}
.cal-head{position:sticky;top:0;z-index:6;display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.cal-corner{position:sticky;left:0;z-index:7;flex:none;width:250px;background:var(--panel);border-right:1px solid var(--line);padding:8px 12px;font-size:12px;color:var(--muted)}
.cal-ticks{position:relative;height:46px;flex:none}
.cal-ticks .tk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11.5px;color:var(--muted);padding:4px 6px;white-space:nowrap}
.cal-ticks .tk.major{color:var(--ink);font-weight:700}
.cal-row{display:flex;height:44px;border-bottom:1px solid var(--line)}
.cal-row.mrow{height:36px;background:color-mix(in srgb,var(--panel) 60%,var(--surface))}
.cal-name{position:sticky;left:0;z-index:4;flex:none;width:250px;background:var(--surface);border-right:1px solid var(--line);padding:0 12px;display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.cal-row.mrow .cal-name{background:var(--panel);font-weight:700}
.cal-name a{color:var(--ink);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-name a:hover{color:var(--primary);text-decoration:underline}
.cal-track{position:relative;flex:none}
.cal-grid{position:absolute;inset:0;pointer-events:none}
.cal-grid i{position:absolute;top:0;bottom:0;border-left:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.cal-grid i.wk{border-color:var(--line)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:3;pointer-events:none}
.today span{position:absolute;top:2px;left:4px;font-size:11px;font-weight:700;color:var(--bad);background:var(--surface);padding:0 3px;border-radius:4px}
.pbar{position:absolute;top:8px;height:28px;border-radius:8px;z-index:2;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12.5px;font-weight:500;cursor:grab;user-select:none;touch-action:none;white-space:nowrap;overflow:hidden;box-shadow:var(--shadow-card);border:1px solid transparent}
.pbar:active{cursor:grabbing}
.pbar.planned,.pbar.backlog{background:var(--panel);border-color:var(--line-strong);color:var(--ink)}
.pbar.progress{background:var(--container);color:var(--on-container)}
.pbar.completed{background:var(--ok-bg);color:var(--ok)}
.pbar .fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,currentColor 14%,transparent);pointer-events:none}
.pbar .h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.pbar .h.l{left:0}.pbar .h.r{right:0}
.pbar .h:hover{background:color-mix(in srgb,currentColor 25%,transparent)}
.pbar.bad{outline:2px solid var(--bad)}
.pbar:focus-visible{outline:3px solid var(--primary)}
.cp{position:absolute;top:13px;width:14px;height:14px;transform:rotate(45deg);background:var(--surface);border:2px solid var(--on-container);z-index:3;pointer-events:none}
.cp.done{background:var(--ok);border-color:var(--ok)}
.tgt{position:absolute;top:10px;z-index:2;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.tgt .d{width:12px;height:12px;transform:rotate(45deg);border:2px solid var(--muted);display:inline-block}
.mtarget{position:absolute;top:8px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.mtarget .d{width:12px;height:12px;transform:rotate(45deg);background:var(--primary);display:inline-block}
.nodates{position:absolute;top:10px;left:8px;z-index:2}
.cal svg{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
.cal svg path{fill:none;stroke:var(--line-strong);stroke-width:1.6}
.cal svg path.bad{stroke:var(--bad);stroke-dasharray:4 3}
.cal svg circle{fill:var(--line-strong)}.cal svg circle.bad{fill:var(--bad)}

/* Project page v2 */
.props{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 0 14px;border-bottom:1px solid var(--line);margin:0 0 16px;font-size:13.5px}
.props .p{display:inline-flex;gap:6px;align-items:center}
.props .p .k{color:var(--muted)}
.props input[type=date]{padding:3px 6px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13px}
.subnav{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:0 0 16px}
.subnav a{padding:6px 0;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.subnav a[aria-current="page"]{color:var(--ink);border-color:var(--primary)}
.cplist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.cplist li{display:flex;gap:10px;align-items:center;font-size:13.5px}
.cplist .dd{width:11px;height:11px;transform:rotate(45deg);border:2px solid var(--on-container);display:inline-block;flex:none}
.cplist .dd.done{background:var(--ok);border-color:var(--ok)}

/* Next N panel */
.nextn{position:absolute;z-index:45;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px;font-size:13.5px}
.nextn[hidden]{display:none}
.nextn .rule{margin:0;color:var(--muted);font-size:12.5px;background:var(--panel);border-radius:10px;padding:8px 10px}
.nextn label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.nextn input,.nextn select{padding:6px 8px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.nextn .row2{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px}

/* Roles and team */
.acttable{width:100%;border-collapse:collapse;font-size:13.5px}
.acttable th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:6px 10px}
.acttable td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
.acttable select{padding:3px 6px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:13px}
.mem{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 3px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.mem .star{color:var(--p-medium);font-size:15px}
.mem .avatar{width:20px;height:20px;font-size:9.5px}
.members{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rolecard2{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rolecard2>header{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.rolecard2>header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.rolecard2 .tablewrap{overflow-x:auto;padding:4px 6px 8px}
.teamtable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.teamtable th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:8px 12px}
.teamtable td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.teamtable .who{display:flex;gap:10px;align-items:center}
.teamtable small{display:block;color:var(--muted);font-size:12px}
.agentgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.acard header{display:flex;gap:10px;align-items:center}
.acard header small{display:block;color:var(--muted);font-size:12px}

.origin{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:1px 7px;border-radius:999px}
.origin.borrowed{background:var(--ok-bg);color:var(--ok)}.origin.invented{background:var(--warn-bg);color:var(--warn)}

@media (max-width:1100px){.srcpage{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .irow{grid-template-columns:22px 46px minmax(0,1fr) 22px;grid-template-areas:none}
  .irow .hide-s{display:none}
  .cal-corner,.cal-name{width:170px}
  .transcript{padding:14px}
  .transcript p{grid-template-columns:1fr;gap:0}
}

/* ---------- v3: one colour per layer, used everywhere ---------- */
:root{--vision:var(--product);--vision-bg:var(--product-bg);--library:#56617a;--library-bg:#e5e9f1;--home:var(--primary);--home-bg:var(--container);--on-layer:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--library:#b6c1d8;--library-bg:#262c3b;--on-layer:#10121a}}
:root[data-theme="dark"]{--library:#b6c1d8;--library-bg:#262c3b;--on-layer:#10121a}
[data-l="vision"]{--lc:var(--vision);--lb:var(--vision-bg)}[data-l="design"]{--lc:var(--design);--lb:var(--design-bg)}[data-l="pages"]{--lc:var(--pages);--lb:var(--pages-bg)}
[data-l="data"]{--lc:var(--data);--lb:var(--data-bg)}[data-l="platform"]{--lc:var(--platform);--lb:var(--platform-bg)}[data-l="work"]{--lc:var(--work);--lb:var(--work-bg)}
[data-l="library"]{--lc:var(--library);--lb:var(--library-bg)}[data-l="home"],[data-l="settings"]{--lc:var(--home);--lb:var(--home-bg)}

/* Nav style A (tiles, like Confluence space avatars) */
body.nav-tiles .nav a{padding:6px 10px 6px 6px;gap:10px;border-radius:12px}
body.nav-tiles .nav a .tile{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--lb);color:var(--lc)}
body.nav-tiles .nav a .tile .icon{font-size:19px}
body.nav-tiles .nav a.active{background:var(--lb);color:var(--ink);font-weight:700}
body.nav-tiles .nav a.active .tile{background:var(--lc);color:var(--on-layer)}
/* Nav style B (owner's idea: coloured icon, solid when active) */
body.nav-solid .nav a .tile{display:inline-grid;color:var(--lc)}
body.nav-solid .nav a.active{background:var(--lc);color:var(--on-layer)}
body.nav-solid .nav a.active .tile{color:var(--on-layer)}
body.nav-solid .nav a.active .badge{background:var(--on-layer);color:var(--lc)}
.nav a:hover{background:color-mix(in srgb,var(--lb) 70%,transparent)}
.eyebrow.layer{display:inline-flex;align-items:center;gap:6px;color:var(--lc);font-weight:700}
.eyebrow.layer .icon{font-size:16px}
main .tabs a.active{border-color:var(--lc)}
.tabs a{display:inline-flex;align-items:center;gap:6px}
.tabs a .icon{font-size:18px;color:var(--lc)}
.tabs a:not(.active) .icon{opacity:.75}

/* Universal chips: every reference to a record */
.ref{--lc:var(--muted)}
.ref[data-l]{border-color:color-mix(in srgb,var(--lc) 28%,var(--line))}
.ref .icon{color:var(--lc)!important}
.ref .kind{color:var(--lc);font-weight:700;font-size:11.5px}
.ref .tt{overflow:hidden;text-overflow:ellipsis}
.ref.short .tt{display:none}
.ref.contra{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.hovercard .hc-kind{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--lc)}
.hovercard .hc-kind .icon{font-size:16px}
.hovercard .props2{display:flex;flex-wrap:wrap;gap:6px 12px;margin:6px 0 8px;font-size:12.5px;color:var(--ink)}
.hovercard .props2 span{display:inline-flex;align-items:center;gap:4px}
.hovercard .props2 .icon{font-size:16px}

/* Plain references inside pills and the timeline */
.refx{display:inline-flex;align-items:center;gap:3px;color:var(--ink);text-decoration:none;--lc:var(--work)}
.refx .icon{font-size:15px;color:var(--lc)}
.refx .rid{font-weight:700;font-size:12px;color:var(--muted)}
.refx:hover .tt,.refx:hover .rid{text-decoration:underline}
.ptitle .refx .rid{display:none}
/* Evidence chip v3 */
.ref{min-width:0}
.stackv{grid-template-columns:minmax(0,1fr)}.members{align-items:center}.agentgrid{align-items:start}.srcpage>*{min-width:0}
.srcpage aside .row>.ref{flex:0 1 auto}
.pst.progress{color:var(--ink)}.pst.progress .icon{color:var(--p-medium)}
.propgrid dd>span{flex-wrap:wrap}
@media (max-width:860px){.propgrid{grid-template-columns:minmax(0,1fr)}.propgrid dt{margin-top:6px}}
.ev3{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 9px 1px 6px;font-size:12px;font-weight:500;line-height:20px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.ev3 .icon{font-size:15px}
.ev3:hover,.ev3:focus-visible{border-color:var(--primary)}
.ev3.sup{color:var(--pages);border-color:color-mix(in srgb,var(--pages) 35%,var(--line))}
.ev3.con{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.ev3 b{font-weight:700;font-variant-numeric:tabular-nums}
.evsplit{display:inline-flex;align-items:stretch;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;background:var(--surface);cursor:pointer;padding:0;font-size:12px;line-height:20px}
.evsplit span{display:inline-flex;align-items:center;gap:3px;padding:1px 8px 1px 6px;font-weight:700;font-variant-numeric:tabular-nums}
.evsplit span+span{border-left:1px solid var(--line-strong)}
.evsplit .icon{font-size:15px}
.evsplit .s{color:var(--pages)}.evsplit .c{color:var(--bad)}
.evsplit:hover,.evsplit:focus-visible{border-color:var(--primary)}

/* Story drawer: why + evidence */

function viewLibrary(){

  const list = Object.keys(INSIGHTS).filter(iid => { const i = INSIGHTS[iid];

function groupList(items, groupBy){
  const keyOf = { status:i => i.status, project:i => i.p || 'none', who:i => i.who, layer:i => i.layer, cp:i => i.cp || 'none' }[groupBy];
  const order = { status:Object.keys(ISTAT), project:[...PROJECTS.map(p => p.id), 'none'], who:[...Object.keys(PEOPLE), ...Object.keys(AGENTS)], layer:LAYER_ORDER, cp:['CP-1','CP-2','none'] }[groupBy];

const drawer = document.getElementById('drawer'); let drawerFrom = null, drawerKind = null;

/* Quick view on every chip */

  const r = el.getBoundingClientRect(), w = hc.offsetWidth, h = hc.offsetHeight; let top = r.bottom + 6; if (top + h > innerHeight - 8) top = r.top - h - 6;
  hc.style.top = Math.max(8, top) + 'px'; hc.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px'; hcA = el; el.setAttribute('aria-describedby', 'hovercard'); }

document.addEventListener('focusin', e => { const el = e.target.closest('[data-hc]'); if (el) { clearTimeout(hcT); hcT = setTimeout(() => showHC(el), 500); } else hideHC(); });

document.addEventListener('click', e => {
  const t = e.target; hideHC();
  const ev = t.closest('[data-ev]'); if (ev) { e.preventDefault(); openDrawer(evDrawer(ev.dataset.ev), true, ['ev', ev.dataset.ev]); return; }

    case 'regen': { const d = DOCS.find(x => x.id === id); d.stale = 0; d.rev++; render(); toast('Regenerated from the latest Brief.'); break; }
    case 'setdates': { const p = PROJECTS.find(x => x.id === id); p.start = '2026-11-02'; p.target = '2026-11-13'; render(); toast(`${p.id} given 2–13 Nov. Drag to adjust.`); break; }

    case 'untag': { const i = INSIGHTS[id]; i.tags = i.tags.filter(x => x !== act.dataset.tag); render(); break; }
    case 'unfind': { const i = INSIGHTS[id]; i.f = i.f.filter(x => x !== act.dataset.f); render(); toast(`${act.dataset.f} removed from ${id}. The finding stays on its source.`); break; }
    case 'nfcancel': document.getElementById('newfind').innerHTML = ''; break;
    case 'editn': state.editN = act.dataset.who; render(); document.getElementById('n-' + act.dataset.who).select(); break;
    case 'next': { const w = act.dataset.who, c = nextFor(w).slice(0, state.nextN[w]); c.forEach(i => { i.status = 'batched'; i.justAdded = true; }); render(); toast(c.length ? `Added ${c.map(i => i.id).join(', ')} to ${w === 'You' ? 'your' : w + '’s'} batch.` : `Nothing ready for ${w} in the active milestone.`); break; }
    case 'elev': { const [ri, ai] = id.split(':').map(Number); const a = ROLES[ri].actions[ai]; a.elevated = !a.elevated; render(); document.querySelector(`[data-act="elev"][data-id="${id}"]`).focus(); break; }
    case 'setup': state.setupOpen = state.setupOpen === id ? null : id; render(); document.querySelector(`[data-act="setup"][data-id="${id}"]`).focus(); break;
  }
});
document.addEventListener('input', e => { if (e.target.matches('[data-lfq]')) { state.lf.q = e.target.value; const pos = e.target.selectionStart; render(); const q = document.querySelector('[data-lfq]'); q.focus(); q.setSelectionRange(pos, pos); } });

const LEDGER = [
